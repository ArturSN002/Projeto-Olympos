  /**
   * Ponto de entrada chamado pelo router modular
   */
  function init() {
    var selMes = document.getElementById('selectMesCalendario');
    if (selMes) selMes.value = String(selectedMonth);
    bindEvents();
    renderizar();

    // Sincronização em segundo plano da agenda do Supabase
    if (window.OlymposSupabase && typeof window.OlymposSupabase.carregarAgendaEventos === 'function') {
      window.OlymposSupabase.carregarAgendaEventos(selectedYear).then(function(eventosSup) {
        if (Array.isArray(eventosSup) && eventosSup.length > 0) {
          var locais = obterEventosAgendaCustom();
          var mapLocais = {};
          locais.forEach(function(l) { mapLocais[l.id] = l; });
          eventosSup.forEach(function(s) {
            mapLocais[s.id] = Object.assign({}, mapLocais[s.id] || {}, s);
          });
          salvarListaAgendaCustom(Object.keys(mapLocais).map(function(k) { return mapLocais[k]; }));
          renderizar();
        }
      }).catch(function(err) {
        console.warn('[Calendario] Carregamento inicial do Supabase em background:', err);
      });
    }
  }

  /**
   * Vincula ouvintes de eventos da interface (executado uma única vez)
   */
  function bindEvents() {
    if (eventsBound) return;
    eventsBound = true;

    // Alternador de Ano: 2026 vs 2027
    var btn2026 = document.getElementById('btnAno2026');
    var btn2027 = document.getElementById('btnAno2027');
    if (btn2026) {
      btn2026.addEventListener('click', function() { setAno(2026); });
    }
    if (btn2027) {
      btn2027.addEventListener('click', function() { setAno(2027); });
    }

    // Abas de visualização: Mês vs Bimestre
    var btnTabMes = document.getElementById('btnCalTabMes');
    var btnTabBimestre = document.getElementById('btnCalTabBimestre');
    if (btnTabMes) {
      btnTabMes.addEventListener('click', function() { setTab('mes'); });
    }
    if (btnTabBimestre) {
      btnTabBimestre.addEventListener('click', function() { setTab('bimestre'); });
    }

    // Navegação de Mês
    var btnMesAnt = document.getElementById('btnMesAnterior');
    var btnMesProx = document.getElementById('btnMesProximo');
    var btnMesHoje = document.getElementById('btnMesHoje');
    var selMes = document.getElementById('selectMesCalendario');

    if (btnMesAnt) {
      btnMesAnt.addEventListener('click', function() {
        if (selectedMonth > 0) {
          setMes(selectedMonth - 1);
        } else {
          setMes(11);
        }
      });
    }
    if (btnMesProx) {
      btnMesProx.addEventListener('click', function() {
        if (selectedMonth < 11) {
          setMes(selectedMonth + 1);
        } else {
          setMes(0);
        }
      });
    }
    if (btnMesHoje) {
      btnMesHoje.addEventListener('click', function() {
        // Redireciona para o mês atual ou fevereiro (início oficial)
        var hoje = new Date();
        if (hoje.getFullYear() === selectedYear) {
          setMes(hoje.getMonth());
        } else {
          setMes(1); // Fevereiro
        }
      });
    }
    if (selMes) {
      selMes.addEventListener('change', function(e) {
        var val = parseInt(e.target.value, 10);
        if (!isNaN(val)) setMes(val);
      });
    }

    // Filtros de Categoria (Pills)
    var filterContainer = document.getElementById('calFilterPillsContainer');
    if (filterContainer) {
      filterContainer.addEventListener('click', function(e) {
        var pill = e.target.closest('.cal-pill');
        if (!pill) return;
        var cat = pill.getAttribute('data-category');
        if (cat) setFiltro(cat);
      });
    }

    // Botões de Exportação iCal (.ics)
    var btnExport = document.getElementById('btnExportarIcal');
    if (btnExport) {
      btnExport.addEventListener('click', function() { exportarIcal(); });
    }
    var btnExportTop = document.getElementById('btnExportarIcalTop');
    if (btnExportTop) {
      btnExportTop.addEventListener('click', function() { exportarIcal(); });
    }

    // Botão + Novo Evento da Agenda
    var btnNovoEvt = document.getElementById('btnNovoEventoAgenda');
    if (btnNovoEvt) {
      btnNovoEvt.addEventListener('click', function() {
        abrirModalFormAgenda();
      });
    }

    // Filtro por Setor Homologado
    var selSetor = document.getElementById('selectFiltroSetorCalendario');
    if (selSetor) {
      selSetor.addEventListener('change', function(e) {
        setSetor(e.target.value);
      });
    }

    // Formulário do Modal de Evento da Agenda
    var formAgenda = document.getElementById('formAgendaEventoCalendario');
    if (formAgenda) {
      formAgenda.addEventListener('submit', function(e) {
        e.preventDefault();
        var id = (document.getElementById('agendaEventoId') ? document.getElementById('agendaEventoId').value : '') || '';
        var titulo = (document.getElementById('agendaTitulo') ? document.getElementById('agendaTitulo').value : '') || '';
        var dataInicio = (document.getElementById('agendaDataInicio') ? document.getElementById('agendaDataInicio').value : '') || '';
        var dataFim = (document.getElementById('agendaDataFim') ? document.getElementById('agendaDataFim').value : '') || '';
        var horario = (document.getElementById('agendaHorario') ? document.getElementById('agendaHorario').value : '') || '';
        var setor = (document.getElementById('agendaSetor') ? document.getElementById('agendaSetor').value : '') || '';
        var categoria = (document.getElementById('agendaCategoria') ? document.getElementById('agendaCategoria').value : '') || '';
        var local = (document.getElementById('agendaLocal') ? document.getElementById('agendaLocal').value : '') || '';
        var descricao = (document.getElementById('agendaDescricao') ? document.getElementById('agendaDescricao').value : '') || '';

        salvarEventoAgenda({
          id: id,
          titulo: titulo,
          dataInicio: dataInicio,
          dataFim: dataFim,
          horario: horario,
          setor: setor,
          categoria: categoria,
          local: local,
          descricao: descricao
        });
      });
    }

    // Botão Excluir Evento da Agenda
    var btnExcluirAgenda = document.getElementById('btnExcluirEventoAgenda');
    if (btnExcluirAgenda) {
      btnExcluirAgenda.addEventListener('click', function() {
        var idIn = document.getElementById('agendaEventoId');
        if (idIn && idIn.value && confirm('Deseja realmente excluir este evento da agenda intersetorial?')) {
          excluirEventoAgenda(idIn.value);
        }
      });
    }

    // Cancelar e Fechar Modal da Agenda
    var btnCancelarAgenda = document.getElementById('btnCancelarFormAgenda');
    var btnCloseAgendaX = document.getElementById('closeModalFormAgendaBtn');
    var modalAgendaBackdrop = document.getElementById('modalFormAgendaEvento');

    if (btnCancelarAgenda) {
      btnCancelarAgenda.addEventListener('click', fecharModalFormAgenda);
    }
    if (btnCloseAgendaX) {
      btnCloseAgendaX.addEventListener('click', fecharModalFormAgenda);
    }
    if (modalAgendaBackdrop) {
      modalAgendaBackdrop.addEventListener('click', function(e) {
        if (e.target === modalAgendaBackdrop) fecharModalFormAgenda();
      });
    }

    // Modal de Detalhes do Dia
    var btnFecharModal = document.getElementById('btnFecharModalDetalhesDia');
    var btnCloseModalX = document.getElementById('closeModalDetalhesDiaBtn');
    var modalBackdrop = document.getElementById('modalDetalhesDiaCalendario');

    if (btnFecharModal) {
      btnFecharModal.addEventListener('click', fecharModalDetalhesDia);
    }
    if (btnCloseModalX) {
      btnCloseModalX.addEventListener('click', fecharModalDetalhesDia);
    }
    if (modalBackdrop) {
      modalBackdrop.addEventListener('click', function(e) {
        if (e.target === modalBackdrop) fecharModalDetalhesDia();
      });
    }
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        fecharModalDetalhesDia();
        fecharModalFormAgenda();
      }
    });
  }

  /**

   */
  function setFiltro(cat) {
    activeCategory = cat || 'todos';
    var pills = document.querySelectorAll('#calFilterPillsContainer .cal-pill');
    pills.forEach(function(p) {
      if (p.getAttribute('data-category') === activeCategory) {

  /**
   * Obtém a base de dados do ano selecionado
   */
  function getDadosAtivos() {
    return selectedYear === 2027 ? DADOS_2027 : DADOS_2026;
  }

  /**
   * Renderização mestra do módulo
   */
  function renderizar() {
    var dados = getDadosAtivos();

    // 1. Atualizar Seletor de Ano
    var btn2026 = document.getElementById('btnAno2026');
    var btn2027 = document.getElementById('btnAno2027');
    if (btn2026 && btn2027) {
      if (selectedYear === 2026) {
        btn2026.classList.add('active');
        btn2027.classList.remove('active');
      } else {
        btn2026.classList.remove('active');
        btn2027.classList.add('active');
      }
    }

    // 2. Renderizar KPIs Executivos
    renderizarKpis(dados);

    // 3. Atualizar Contadores dos Filtros
    renderizarContadoresFiltros(dados);

    // 4. Renderizar Abas e Visualizações
    renderizarTabs();
  }

  /**
   * Renderiza os 5 KPIs no topo do painel
   */
  function renderizarKpis(dados) {
    var kpiDias = document.getElementById('calKpiDiasLetivos');
    var kpiDiasMeta = document.getElementById('calKpiDiasLetivosMeta');
    var kpiBimestres = document.getElementById('calKpiBimestres');
    var kpiBimestresMeta = document.getElementById('calKpiBimestresMeta');
    var kpiRecesso = document.getElementById('calKpiRecesso');
    var kpiRecessoMeta = document.getElementById('calKpiRecessoMeta');
    var kpiSabados = document.getElementById('calKpiSabados');
    var kpiSabadosMeta = document.getElementById('calKpiSabadosMeta');
    var kpiMatriculas = document.getElementById('calKpiMatriculas');
    var kpiMatriculasMeta = document.getElementById('calKpiMatriculasMeta');

    if (kpiDias) kpiDias.textContent = String(dados.totalDiasLetivos);
    if (kpiDiasMeta) {
      kpiDiasMeta.textContent = selectedYear === 2026
        ? 'Oficial: 203d (Meta LDB: 200d)'
        : 'Estimado: 202d (Meta LDB: 200d)';
    }

    if (kpiBimestres) kpiBimestres.textContent = String(dados.bimestres.length);
    if (kpiBimestresMeta) {
      var b1 = dados.bimestres[0];
      var b4 = dados.bimestres[dados.bimestres.length - 1];
      kpiBimestresMeta.textContent = formatarDataCurta(b1.dataInicio) + ' a ' + formatarDataCurta(b4.dataFim);
    }

    if (kpiRecesso) kpiRecesso.textContent = String(dados.recesso.dias) + 'd';
    if (kpiRecessoMeta) {
      kpiRecessoMeta.textContent = formatarDataCurta(dados.recesso.dataInicio) + ' a ' + formatarDataCurta(dados.recesso.dataFim);
    }

    // Contagem de sábados letivos
    var totalSabados = 0;
    dados.bimestres.forEach(function(b) {
      totalSabados += (b.sabadosLetivos || []).length;
    });
    if (kpiSabados) kpiSabados.textContent = String(totalSabados);
    if (kpiSabadosMeta) {
      kpiSabadosMeta.textContent = selectedYear === 2026 ? '8 Sábados Temáticos' : '6 Sábados Estimados';
    }

    // Contagem de etapas de matrícula
    var matriculasCount = dados.eventos.filter(function(e) {

    }).length;
    if (kpiMatriculas) kpiMatriculas.textContent = String(matriculasCount || 4);
    if (kpiMatriculasMeta) {
      kpiMatriculasMeta.textContent = 'Renovação, Rede, Novos & NEE';
    }
  }

  /**
   * Atualiza contadores numéricos nas pílulas de filtro
   */
  function renderizarContadoresFiltros(dados) {
    var counts = {
      todos: 0,
      letivo: 0,
      feriado: 0,
      matricula: 0,
      jornada: 0,
      sabado_letivo: 0,
      exame: 0,
      agenda: 0
    };

    var todos = obterTodosEventos(dados);
    todos.forEach(function(ev) {

      if (ev.custom || ev.categoria === 'agenda_intersetorial' || ev.categoria === 'reuniao' || ev.categoria === 'capacitacao') {

      countFiltroLetivos: counts.letivo,
      countFiltroFeriados: counts.feriado,
      countFiltroMatriculas: counts.matricula,
      countFiltroJornadas: counts.jornada,
      countFiltroSabados: counts.sabado_letivo,
      countFiltroExames: counts.exame,
      countFiltroAgenda: counts.agenda
    };

    Object.keys(map).forEach(function(id) {
      var el = document.getElementById(id);
      if (el) el.textContent = String(map[id]);

  /**

  /**
   * Monta o HTML da grade de dias para o mês especificado
   */
  function montarGradeDiasHtml(dados, ano, mes) {
    var primeiroDiaSemana = new Date(ano, mes, 1).getDay(); // 0 (Dom) a 6 (Sáb)
    var diasNoMes = new Date(ano, mes + 1, 0).getDate();
    var diasMesAnterior = new Date(ano, mes, 0).getDate();

    var html = '';

    // 1. Dias do mês anterior para preencher a primeira semana
    for (var i = primeiroDiaSemana - 1; i >= 0; i--) {
      var diaAnt = diasMesAnterior - i;
      html += '<div class="cal-day-cell fora-mes" data-day="' + diaAnt + '" data-fora="prev">';
      html += '  <div class="cal-day-header"><span class="cal-day-number">' + diaAnt + '</span></div>';
      html += '</div>';
    }

    // 2. Dias do mês atual
    var hoje = new Date();
    var ehMesAtualReal = (hoje.getFullYear() === ano && hoje.getMonth() === mes);
    var diaHojeReal = hoje.getDate();

    for (var dia = 1; dia <= diasNoMes; dia++) {
      var dataStr = ano + '-' + padZero(mes + 1) + '-' + padZero(dia);
      var diaSemana = new Date(ano, mes, dia).getDay();
      var ehFimDeSemana = (diaSemana === 0 || diaSemana === 6);

      // Obter eventos para a data
      var eventosDoDia = obterEventosNaData(dados, dataStr);

      // Se há filtro ativo e a data não possui evento da categoria, verifica se deve ocultar
      var atendeFiltro = true;
      if (activeCategory !== 'todos') {
        atendeFiltro = eventosDoDia.some(function(ev) {
          if (activeCategory === 'agenda_intersetorial') {
            return ev.custom || ev.categoria === 'agenda_intersetorial' || ev.categoria === 'reuniao' || ev.categoria === 'capacitacao';
          }
          return ev.categoria === activeCategory;
        });
      }
      if (atendeFiltro && activeSector !== 'todos') {
        atendeFiltro = eventosDoDia.some(function(ev) {
          return ev.setor && (ev.setor === activeSector || ev.setor.includes(activeSector));
        });
      }

      // Classificação do dia
      var ehLetivo = isDiaLetivo(dados, ano, mes, dia, diaSemana, eventosDoDia);
      var ehSabadoLetivo = diaSemana === 6 && ehLetivo;
      var ehFeriado = eventosDoDia.some(function(ev) { return ev.categoria === 'feriado'; });
      var ehRecesso = isDataNoRecesso(dados, dataStr);
      var ehJornada = eventosDoDia.some(function(ev) { return ev.categoria === 'jornada'; });
      var ehMatricula = eventosDoDia.some(function(ev) { return ev.categoria === 'matricula'; });
      var ehExame = eventosDoDia.some(function(ev) { return ev.categoria === 'exame'; });
      var ehAgenda = eventosDoDia.some(function(ev) {
        return ev.custom || ev.categoria === 'agenda_intersetorial' || ev.categoria === 'reuniao' || ev.categoria === 'capacitacao';
      });

      var classes = ['cal-day-cell'];
      if (!atendeFiltro) classes.push('cal-day-dimmed');
      if (ehMesAtualReal && dia === diaHojeReal) classes.push('hoje');
      if (ehFeriado) classes.push('feriado');
      if (ehRecesso) classes.push('recesso');
      if (ehSabadoLetivo) classes.push('sabado-letivo');
      if (ehJornada) classes.push('jornada');
      if (ehMatricula) classes.push('matricula');
      if (ehExame) classes.push('exame');
      if (ehLetivo && !ehSabadoLetivo) classes.push('letivo');
      if (ehAgenda) classes.push('tem-agenda');
      if (ehFimDeSemana && !ehSabadoLetivo && !ehFeriado && !ehRecesso) classes.push('fim-de-semana');

      html += '<div class="' + classes.join(' ') + '" data-date="' + dataStr + '" tabindex="0" role="button" aria-label="Dia ' + dia + ' de ' + MESES_NOMES[mes] + '">';
      html += '  <div class="cal-day-header">';
      html += '    <span class="cal-day-number">' + dia + '</span>';

      // Badges resumidos no cabeçalho do dia
      if (ehFeriado) {
        html += '    <span class="cal-day-tag feriado" title="Feriado">Feriado</span>';
      } else if (ehRecesso) {
        html += '    <span class="cal-day-tag recesso" title="Recesso Escolar">Recesso</span>';
      } else if (ehSabadoLetivo) {
        html += '    <span class="cal-day-tag sabado" title="Sábado Letivo Temático">Sáb Letivo</span>';
      } else if (ehJornada) {
        html += '    <span class="cal-day-tag jornada" title="Jornada Pedagógica">Jornada</span>';
      } else if (ehMatricula) {
        html += '    <span class="cal-day-tag matricula" title="Matrículas">Matrícula</span>';
      } else if (ehExame) {
        html += '    <span class="cal-day-tag exame" title="Exames Finais">Exame</span>';
      } else if (ehAgenda) {
        html += '    <span class="cal-day-tag agenda" title="Possui compromisso da Agenda Intersetorial">🗓️ Agenda</span>';
      } else if (ehLetivo) {
        html += '    <span class="cal-day-tag letivo" title="Dia Letivo Regular">Letivo</span>';
      }
      html += '  </div>';

      // Ordenar eventos para priorizar visualização de chips da agenda intersetorial
      eventosDoDia.sort(function(a, b) {
        var aPri = (a.custom || a.categoria === 'agenda_intersetorial' || a.categoria === 'reuniao' || a.categoria === 'capacitacao') ? 1 : 0;
        var bPri = (b.custom || b.categoria === 'agenda_intersetorial' || b.categoria === 'reuniao' || b.categoria === 'capacitacao') ? 1 : 0;
        return bPri - aPri;
      });

      // Eventos e chips do dia
      html += '  <div class="cal-day-events">';
      for (var evIdx = 0; evIdx < Math.min(2, eventosDoDia.length); evIdx++) {
        var ev = eventosDoDia[evIdx];
        var isCustomEvt = ev.custom || (typeof ev.id === 'string' && ev.id.indexOf('age_') === 0);
        var icone = ev.icone || (isCustomEvt ? '🗓️' : '📌');
        var tituloCurto = ev.titulo.length > 28 ? ev.titulo.substring(0, 26) + '...' : ev.titulo;
        var chipCategoria = ev.categoria || 'agenda_intersetorial';
        html += '    <div class="cal-event-chip ' + chipCategoria + '" title="' + escapeAttr(ev.titulo + (ev.setor ? ' (' + ev.setor + ')' : '')) + '">';
        html += '      <span class="cal-chip-icon">' + icone + '</span>';
        html += '      <span class="cal-chip-text">' + escapeHtml(tituloCurto) + '</span>';
        html += '    </div>';
      }
      if (eventosDoDia.length > 2) {
        html += '    <div class="cal-event-more">+' + (eventosDoDia.length - 2) + ' mais</div>';
      }
      html += '  </div>';
      html += '</div>';
    }

    // 3. Dias do mês seguinte para completar o grid (múltiplo de 7)
    var totalCelulas = primeiroDiaSemana + diasNoMes;
    var celulasRestantes = (7 - (totalCelulas % 7)) % 7;
    for (var j = 1; j <= celulasRestantes; j++) {
      html += '<div class="cal-day-cell fora-mes" data-day="' + j + '" data-fora="next">';
      html += '  <div class="cal-day-header"><span class="cal-day-number">' + j + '</span></div>';
      html += '</div>';
    }

    return html;
  }

  /**
   * Conecta evento de clique nos dias do calendário
   */
  function vincularCliquesGradeDias(dados) {
    var cells = document.querySelectorAll('#calGridDias .cal-day-cell:not(.fora-mes)');
    cells.forEach(function(cell) {
      cell.addEventListener('click', function() {
        var dataStr = cell.getAttribute('data-date');
        if (dataStr) {
          abrirModalDetalhesDia(dataStr);
        }
      });
      cell.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          var dataStr = cell.getAttribute('data-date');
          if (dataStr) abrirModalDetalhesDia(dataStr);
        }
      });
    });
  }

  /**
   * Monta a lista de eventos do mês selecionado
   */
  function montarListaEventosMesHtml(dados, ano, mes) {
    var inicioMesStr = ano + '-' + padZero(mes + 1) + '-01';
    var fimMesStr = ano + '-' + padZero(mes + 1) + '-' + padZero(new Date(ano, mes + 1, 0).getDate());

    var todos = obterTodosEventos(dados);
    var eventosMes = todos.filter(function(ev) {
      // Evento intercepta o mês atual
      return (ev.dataInicio <= fimMesStr && ev.dataFim >= inicioMesStr);
    });

    if (activeSector !== 'todos') {
      eventosMes = eventosMes.filter(function(ev) {
        return !ev.setor || ev.setor === activeSector || ev.setor.includes(activeSector);
      });
    }

    if (activeCategory !== 'todos') {
      eventosMes = eventosMes.filter(function(ev) {
        if (activeCategory === 'agenda_intersetorial') {
          return ev.custom || ev.categoria === 'agenda_intersetorial' || ev.categoria === 'reuniao' || ev.categoria === 'capacitacao';
        }
        return ev.categoria === activeCategory;
      });
    }

    if (eventosMes.length === 0) {
      return '<div class="cal-empty-state"><p>Nenhum evento registrado com os filtros ativos para este mês.</p></div>';
    }

    // Ordena por data de início
    eventosMes.sort(function(a, b) {
      return a.dataInicio.localeCompare(b.dataInicio);
    });

    var html = '<div class="cal-timeline-list">';
    eventosMes.forEach(function(ev) {
      var isCustomEvt = ev.custom || (typeof ev.id === 'string' && ev.id.indexOf('age_') === 0);
      var icone = ev.icone || (isCustomEvt ? '🗓️' : '📅');
      var periodoFormatado = formatarPeriodoEvento(ev.dataInicio, ev.dataFim);

      html += '<div class="cal-timeline-item ' + ev.categoria + '">';
      html += '  <div class="cal-timeline-marker">' + icone + '</div>';
      html += '  <div class="cal-timeline-content">';
      html += '    <div class="cal-timeline-header" style="display:flex; justify-content:space-between; align-items:center;">';
      html += '      <div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap;">';
      html += '        <span class="cal-timeline-date">' + periodoFormatado + '</span>';
      html += '        <span class="cal-pill-badge ' + ev.categoria + '">' + formatarCategoriaLabel(ev.categoria) + '</span>';
      if (ev.bimestre) {
        html += '        <span class="cal-pill-badge bimestre">' + ev.bimestre + 'º Bimestre</span>';
      }
      html += '      </div>';
      if (isCustomEvt) {
        html += '      <button type="button" class="btn btn-ghost btn-sm" style="font-size:11px; padding:2px 8px; color:var(--brand-gold);" onclick="window.OlymposViews.calendario.abrirModalFormAgenda(\'' + escapeAttr(ev.id) + '\')">✏️ Editar</button>';
      }
      html += '    </div>';
      html += '    <h5 class="cal-timeline-title">' + escapeHtml(ev.titulo) + '</h5>';
      html += '    <p class="cal-timeline-desc">' + escapeHtml(ev.descricao) + '</p>';
      if (ev.setor || ev.horario || ev.local) {
        html += '    <div class="cal-timeline-meta" style="display:flex; gap:12px; flex-wrap:wrap; font-size:11.5px; color:var(--text-muted);">';
        if (ev.setor) html += '    <div><strong>Setor:</strong> ' + escapeHtml(ev.setor) + '</div>';
        if (ev.horario) html += '    <div><strong>Horário:</strong> ' + escapeHtml(ev.horario) + '</div>';
        if (ev.local) html += '    <div><strong>Local:</strong> ' + escapeHtml(ev.local) + '</div>';
        html += '    </div>';
      }
      html += '  </div>';
      html += '</div>';
    });
    html += '</div>';

    return html;
  }

  /**
   * Abre modal detalhado ao clicar em qualquer dia do mês
   */
  function abrirModalDetalhesDia(dataStr) {
    var dados = getDadosAtivos();
    var modal = document.getElementById('modalDetalhesDiaCalendario');
    var tituloEl = document.getElementById('modalDetalhesDiaTitulo');
    var badgeEl = document.getElementById('modalDetalhesDiaBadge');
    var bodyEl = document.getElementById('modalDetalhesDiaBody');

    if (!modal || !bodyEl) return;

    var partes = dataStr.split('-');
    var ano = parseInt(partes[0], 10);
    var mes = parseInt(partes[1], 10) - 1;
    var dia = parseInt(partes[2], 10);
    var dateObj = new Date(ano, mes, dia);
    var diaSemana = dateObj.getDay();

    var eventosDoDia = obterEventosNaData(dados, dataStr);
    var ehLetivo = isDiaLetivo(dados, ano, mes, dia, diaSemana, eventosDoDia);
    var ehSabadoLetivo = (diaSemana === 6 && ehLetivo);
    var ehRecesso = isDataNoRecesso(dados, dataStr);

    // Título e Badge
    if (tituloEl) {
      tituloEl.textContent = dia + ' de ' + MESES_NOMES[mes] + ' de ' + ano + ' (' + DIAS_SEMANA_NOMES[diaSemana] + ')';
    }
    if (badgeEl) {
      badgeEl.textContent = ehLetivo ? '📚 Dia Letivo Homologado' : (ehRecesso ? '🏖️ Recesso Escolar' : '📅 Agenda SMEB');
    }

    var html = '<div class="cal-modal-content-wrap">';

    // Status Legal do Dia

  // =========================================================================
  // EXPORTAÇÃO iCAL (.ICS) COMPATÍVEL COM RFC 5545 E GOOGLE CALENDAR
  // =========================================================================

  /**
   * Gera e dispara o download do arquivo .ics do calendário oficial/planejado
   */
  function exportarIcal() {
    var dados = getDadosAtivos();
    var agora = new Date();
    var dtStamp = formatarIcalTimestamp(agora);

    var linhas = [
      'BEGIN:VCALENDAR',
      'VERSION:2.0',
      'PRODID:-//SMEB Ceara-Mirim//Hub Olympos Calendario Escolar//PT-BR',
      'CALSCALE:GREGORIAN',
      'METHOD:PUBLISH',
      'X-WR-CALNAME:Calendário Escolar SMEB Ceará-Mirim ' + selectedYear,
      'X-WR-TIMEZONE:America/Fortaleza',
      'X-WR-CALDESC:Calendário Escolar Oficial (' + dados.totalDiasLetivos + ' dias letivos) - Secretaria Municipal de Educação Básica de Ceará-Mirim/RN'
    ];

    var todos = obterTodosEventos(dados);
    todos.forEach(function(ev) {
      var uid = 'evt-' + selectedYear + '-' + ev.id + '@olympos.smeb.cearamirim.rn.gov.br';
      var dtStart = formatarIcalDate(ev.dataInicio);
      var dtEnd = formatarIcalDateFimExclusiva(ev.dataFim || ev.dataInicio);

      linhas.push('BEGIN:VEVENT');
      linhas.push('UID:' + uid);
      linhas.push('DTSTAMP:' + dtStamp);
      linhas.push('DTSTART;VALUE=DATE:' + dtStart);
      linhas.push('DTEND;VALUE=DATE:' + dtEnd);
      linhas.push('SUMMARY:' + sanitizarIcalTexto(ev.titulo));
      var descPartes = [];
      if (ev.descricao) descPartes.push(ev.descricao);
      if (ev.setor) descPartes.push('Responsável: ' + ev.setor);
      if (ev.horario) descPartes.push('Horário: ' + ev.horario);
      if (ev.local) descPartes.push('Local: ' + ev.local);
      linhas.push('DESCRIPTION:' + sanitizarIcalTexto(descPartes.join(' | ')));
      linhas.push('LOCATION:' + sanitizarIcalTexto(ev.local || 'Ceará-Mirim - RN'));
      linhas.push('CATEGORIES:' + sanitizarIcalTexto(formatarCategoriaLabel(ev.categoria) + (ev.setor ? ',' + ev.setor : '')));
      linhas.push('STATUS:CONFIRMED');
      linhas.push('TRANSP:' + (ev.letivo ? 'OPAQUE' : 'TRANSPARENT'));
      linhas.push('END:VEVENT');
    });

    linhas.push('END:VCALENDAR');

    var icsContent = linhas.join('\r\n') + '\r\n';

    try {
      var blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8;' });
      var url = URL.createObjectURL(blob);
      var downloadLink = document.createElement('a');
      downloadLink.href = url;
      downloadLink.download = 'calendario_escolar_smeb_' + selectedYear + '.ics';
      document.body.appendChild(downloadLink);
      downloadLink.click();
      document.body.removeChild(downloadLink);
      URL.revokeObjectURL(url);

      if (window.OlymposApp && typeof window.OlymposApp.showToast === 'function') {
        window.OlymposApp.showToast('Calendário ' + selectedYear + ' exportado com sucesso (.ics)!');
      }
    } catch (err) {
      console.error('[calendario.js] Falha ao exportar iCal:', err);
      if (window.OlymposApp && typeof window.OlymposApp.showToast === 'function') {
        window.OlymposApp.showToast('Erro ao exportar arquivo .ics');
      }
    }
  }

  // =========================================================================
  // MÉTODOS AUXILIARES E REGRAS DE NEGÓCIO DO CALENDÁRIO
  // =========================================================================

  function obterEventosNaData(dados, dataStr) {
    var todos = obterTodosEventos(dados);
    return todos.filter(function(ev) {
      return (ev.dataInicio <= dataStr && ev.dataFim >= dataStr);
    });
  }

  function isDataNoRecesso(dados, dataStr) {
    if (!dados.recesso) return false;
    return (dados.recesso.dataInicio <= dataStr && dados.recesso.dataFim >= dataStr);
  }

  /**
   * Determina com precisão se uma data é considerada dia letivo oficial
   */
  function isDiaLetivo(dados, ano, mes, dia, diaSemana, eventosDoDia) {
    var dataStr = ano + '-' + padZero(mes + 1) + '-' + padZero(dia);

    // 1. Se estiver no recesso escolar discente, NÃO é dia letivo
    if (isDataNoRecesso(dados, dataStr)) {
      return false;
    }

    // 2. Se for feriado ou ponto facultativo, NÃO é dia letivo
    var ehFeriado = eventosDoDia.some(function(ev) {
      return !ev.custom && ev.categoria === 'feriado';
    });
    if (ehFeriado) return false;

    // 3. Se for jornada pedagógica (sem alunos), NÃO é dia letivo de alunos
    var ehJornada = eventosDoDia.some(function(ev) {
      return !ev.custom && ev.categoria === 'jornada';
    });
    if (ehJornada) return false;

    // 4. Se for sábado letivo temático homologado, É dia letivo
    var ehSabadoLetivo = eventosDoDia.some(function(ev) {
      return !ev.custom && ev.categoria === 'sabado_letivo';
    });
    if (ehSabadoLetivo) return true;

    // 5. Domingo e sábados não letivos NÃO são dias letivos
    if (diaSemana === 0 || diaSemana === 6) return false;

    // 6. Verificação do período letivo oficial 2026 (19/02 a 23/12)
    if (ano === 2026) {
      if (dataStr < '2026-02-19') return false;
      if (dataStr > '2026-12-23') return false;
      return true;
    }

    // 7. Verificação do período letivo 2027 (15/02 a 22/12)
    if (ano === 2027) {
      if (dataStr < '2027-02-15') return false;
      if (dataStr > '2027-12-22') return false;
      return true;
    }

    return false;
  }

  function contarSabadosLetivosNoMes(dados, ano, mes) {
    var mesPrefix = ano + '-' + padZero(mes + 1);
    var count = 0;
    dados.eventos.forEach(function(ev) {
      if (ev.categoria === 'sabado_letivo' && ev.dataInicio.indexOf(mesPrefix) === 0) {
        count++;
      }
    });
    return count;
  }

  function contarFeriadosNoMes(dados, ano, mes) {
    var mesPrefix = ano + '-' + padZero(mes + 1);
    var count = 0;
    dados.eventos.forEach(function(ev) {
      if (ev.categoria === 'feriado' && (ev.dataInicio.indexOf(mesPrefix) === 0 || ev.dataFim.indexOf(mesPrefix) === 0)) {
        count++;
      }
    });
    return count;
  }

  function obterDestaqueMes(dados, mes) {
    if (selectedYear === 2026) {
      var destaques2026 = {
        0: 'Período de férias e matrículas (Renovação, Rede, Novos e NEE).',
        1: 'Jornada Pedagógica SMEB e Início das Aulas em 19/02 (7 dias letivos).',
        2: '23 dias letivos com 2 Sábados Letivos Temáticos (Família na Escola e Poesia).',
        3: 'Encerramento do 1º Bimestre (23/04) e Início do 2º Bimestre (24/04).',
        4: '21 dias letivos com Sábado Letivo Temático de Saúde Emocional (09/05).',
        5: 'Semana do Meio Ambiente e Fechamento do 2º Bimestre (25/06). Recesso inicia 29/06.',
        6: 'Recesso Escolar até 13/07. Aulas retornam 13/07 (Início do 3º Bimestre).',
        7: '21 dias letivos com Sábado Letivo Temático do Folclore Potiguar (15/08).',
        8: 'Semana da Pátria e Encerramento do 3º Bimestre (28/09). Início 4º Bim (29/09).',
        9: 'Semana da Criança e Sábado Letivo Temático de Feira de Ciências (24/10).',
        10: 'Sábado Letivo Temático da Consciência Negra e Educação Antirracista (21/11).',
        11: 'Encerramento das Aulas (23/12), Exames Finais e Conselho de Classe Final.'
      };
      return destaques2026[mes] || 'Atividades regulares do calendário escolar.';
    }
    return 'Planejamento preliminar para o exercício de 2027.';
  }

  function formatarCategoriaLabel(cat) {
    var labels = {
      todos: 'Todos os Eventos',
      letivo: 'Dias Letivos',
      feriado: 'Feriados / Recessos',
      matricula: 'Matrículas',
      jornada: 'Jornadas Pedagógicas',
      sabado_letivo: 'Sábados Letivos',
      exame: 'Exames & Avaliações',
      comemorativa: 'Semanas Comemorativas',
      agenda_intersetorial: 'Agenda Intersetorial',
      reuniao: 'Reunião Setorial',
      capacitacao: 'Capacitação / Formação',
      visita_tecnica: 'Visita Técnica',
      audiencia: 'Audiência Pública'
    };
    return labels[cat] || cat;
  }

  function formatarDataCurta(dataIso) {
    if (!dataIso) return '';
    var p = dataIso.split('-');
    return p[2] + '/' + p[1];
  }

  function formatarDataExtensa(dataIso) {
    if (!dataIso) return '';
    var p = dataIso.split('-');
    var d = parseInt(p[2], 10);
    var m = parseInt(p[1], 10) - 1;
    return d + ' de ' + MESES_NOMES[m];
  }

  function formatarPeriodoEvento(inicio, fim) {
    if (!inicio) return '';
    if (inicio === fim || !fim) {
      return formatarDataExtensa(inicio);
    }
    return formatarDataCurta(inicio) + ' a ' + formatarDataCurta(fim);
  }

  function obterMesDeData(dataIso) {
    if (!dataIso) return 0;
    var partes = dataIso.split('-');
    return parseInt(partes[1], 10) - 1;
  }

  function padZero(num) {
    return num < 10 ? '0' + num : String(num);
  }

  function formatarIcalDate(dataIso) {
    return dataIso.replace(/-/g, '');
  }

  function formatarIcalDateFimExclusiva(dataIso) {
    // RFC 5545 requer que DTEND para eventos de dia inteiro seja o dia seguinte à data final inclusiva
    var partes = dataIso.split('-');
    var ano = parseInt(partes[0], 10);
    var mes = parseInt(partes[1], 10) - 1;
    var dia = parseInt(partes[2], 10);
    var nextDay = new Date(ano, mes, dia + 1);
    var y = nextDay.getFullYear();
    var m = padZero(nextDay.getMonth() + 1);
    var d = padZero(nextDay.getDate());
    return '' + y + m + d;
  }

  function formatarIcalTimestamp(d) {
    return '' + d.getUTCFullYear() +
      padZero(d.getUTCMonth() + 1) +
      padZero(d.getUTCDate()) + 'T' +
      padZero(d.getUTCHours()) +
      padZero(d.getUTCMinutes()) +
      padZero(d.getUTCSeconds()) + 'Z';
  }

  function sanitizarIcalTexto(str) {
    if (!str) return '';
    return str
      .replace(/\\/g, '\\\\')
      .replace(/;/g, '\\;')
      .replace(/,/g, '\\,')
      .replace(/\r?\n/g, '\\n');
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function escapeAttr(str) {
    return escapeHtml(str);
  }

  // =========================================================================
  // API PÚBLICA EXPOSTA
  // =========================================================================

  return {
    init: init,
    setAno: setAno,
    setTab: setTab,
    setFiltro: setFiltro,
    setMes: setMes,
    setSetor: setSetor,
    exportarIcal: exportarIcal,
    abrirModalDetalhesDia: abrirModalDetalhesDia,
    fecharModalDetalhesDia: fecharModalDetalhesDia,
    abrirModalFormAgenda: abrirModalFormAgenda,
    fecharModalFormAgenda: fecharModalFormAgenda,
    salvarEventoAgenda: salvarEventoAgenda,
    excluirEventoAgenda: excluirEventoAgenda,
    obterEventosAgendaCustom: obterEventosAgendaCustom,
    getDadosAno: function(ano) {
      return (ano === 2027) ? DADOS_2027 : DADOS_2026;
    }
  };
})();

/**
 * Hub Olympos V2.3 — Módulo de Visualização e Gestão: Escolas, CEIs e Instituições de Ceará-Mirim
 * Georreferenciamento de precisão com Leaflet.js 1.9.4, marcadores circulares temáticos,
 * sincronização automática imediata com Supabase (`public.escolas` + `public.catalogos_json`),
 * Categorias Institucionais padronizadas ('Escola', 'Centro de Educação Infantil', 'Instituição'),
 * popups ricos legíveis nos modos claro/escuro e CRUD completo na interface.
 */
window.OlymposViews = window.OlymposViews || {};

window.OlymposViews.escolas = (function() {
  'use strict';

  var STORAGE_KEY = 'olympos_escolas_municipais';
  var leafletMap = null;
  var markersLayer = null;
  var tempClickMarker = null;
  var markerMap = {}; // id -> L.marker
  var observerEscolas = null;
  var supabaseInicialCarregado = false;

  var activeCategoryFilter = 'todas';
  var activeZonaFilter = 'todas';
  var activeRedeFilter = 'todas';
  var activeSegmentFilter = 'todos';
  var currentSearchTerm = '';

  var CATEGORIAS_INSTITUCIONAIS = [
    'Escola',
    'Centro de Educação Infantil',
    'Instituição'
  ];

  // Bounding box territorial aproximada de Ceará-Mirim/RN (do litoral de Muriú/Jacumã ao extremo norte em São Miguel/Riachão)
  var BOUNDS_CEARA_MIRIM = {
    minLat: -5.750000,
    maxLat: -5.460000,
    minLng: -35.600000,
    maxLng: -35.210000
  };

  /**
   * Normaliza qualquer categoria legada ou informada nos 3 tipos institucionais oficiais:
   * 'Escola', 'Centro de Educação Infantil' ou 'Instituição'.
   * Garante que uma Escola ofertando Ed. Infantil + Ens. Fundamental I jamais vire CEI.
   */
  function normalizarCategoriaInstitucional(cat, nome) {
    var c = String(cat || '').trim();
    var cLow = c.toLowerCase();
    var nLow = String(nome || '').trim().toLowerCase();

    if (
      c === 'Instituição' ||
      cLow === 'instituicao' ||
      cLow.includes('institui') ||
      cLow.includes('sede') ||
      nLow.includes('smeb sede') ||
      nLow.includes('secretaria') ||
      nLow.includes('ifrn')
    ) {
      return 'Instituição';
    }

    if (
      c === 'Centro de Educação Infantil' ||
      c === 'Educação Infantil' ||
      c === 'Educação Infantil (CEI)' ||
      cLow === 'cei' ||
      cLow === 'cmei' ||
      cLow === 'creche' ||
      /^c\.?e\.?i\.?\b/i.test(nLow) ||
      /^cmei\b/i.test(nLow) ||
      nLow.includes('centro de educação infantil')
    ) {
      return 'Centro de Educação Infantil';
    }

    return 'Escola';
  }

  /**
   * Converte uma categoria em segmentos educacionais canônicos caso segmentos não tenha sido informado
   */
  function normalizarSegmentosDeCategoria(cat, nome) {
    var catInst = normalizarCategoriaInstitucional(cat, nome);
    var cLow = String(cat || '').toLowerCase();

    if (catInst === 'Centro de Educação Infantil') {
      return ['Ed. Infantil'];
    }
    if (catInst === 'Instituição') {
      if (String(nome || '').toLowerCase().includes('ifrn')) {
        return ['Ensino Médio', 'Ensino Técnico'];
      }
      return ['Sede Administrativa'];
    }
    if (cLow.includes('especial')) {
      return ['Educação Especial'];
    }
    if (cLow.includes('medio') || cLow.includes('médio')) {
      return ['Ensino Médio'];
    }
    return ['Ens. Fundamental I', 'Ens. Fundamental II'];
  }

  /**
   * Ponto de entrada chamado pelo roteador modular.
   * Renderiza de imediato e dispara sincronização automática com o Supabase (`escolas` / `catalogos_json`).
   */
  function init() {
    garantirBancoInicial();
    bindEvents();
    inicializarMapa();
    renderizarInterface();
    observarVisibilidadePagina();
    sincronizarInicialComSupabase();
  }

  /**
   * Carrega imediatamente as coordenadas e registros oficiais armazenados no Supabase
   * assim que o usuário entra na interface, atualizando localStorage, KPIs, mapa e tabela.
   */
  function sincronizarInicialComSupabase() {
    if (supabaseInicialCarregado) return;
    if (!window.OlymposSupabase || typeof window.OlymposSupabase.carregarEscolas !== 'function') return;

    supabaseInicialCarregado = true;
    try {
      var promessa = window.OlymposSupabase.carregarEscolas();
      if (promessa && typeof promessa.then === 'function') {
        promessa.then(function(listaRemota) {
          if (Array.isArray(listaRemota) && listaRemota.length > 0) {
            var saneadas = listaRemota.map(sanitizarRegistroEscola);
            salvarEscolas(saneadas);
            renderizarInterface();
          }
        }).catch(function(err) {
          console.warn('[EscolasView] Falha ao sincronizar catálogo inicial do Supabase:', err);

      }
    } catch (eSync) {
      console.warn('[EscolasView] Exceção ao disparar carga inicial do Supabase:', eSync);
    }
  }

  /**
   * Garante integridade de categoria institucional, cor e símbolo de cada unidade
   */
  function sanitizarRegistroEscola(esc) {
    if (!esc) return esc;
    var copia = Object.assign({}, esc);

    if (typeof copia.nome === 'string' && copia.nome.includes('CMEI')) {
      copia.nome = copia.nome.replace(/\bCMEI\b/g, 'CEI');
    }

    if (!copia.rede || !['Municipal', 'Estadual', 'Federal', 'Privada'].includes(copia.rede)) {
      copia.rede = 'Municipal';
    }

    var catAntiga = copia.categoria;
    copia.categoria = normalizarCategoriaInstitucional(catAntiga, copia.nome);

    if (!Array.isArray(copia.segmentos) || copia.segmentos.length === 0) {
      copia.segmentos = normalizarSegmentosDeCategoria(catAntiga, copia.nome);
    }

    var corEsperada = obterCorPorRedeECategoria(copia.rede, copia.categoria, copia.zona);
    var iconeEsperado = obterIconePorRedeECategoria(copia.rede, copia.categoria, copia.zona);

    // Repara unidades Escola que haviam recebido indevidamente ícone 'C' ou cor âmbar de CEI
    if (!copia.icone || (copia.categoria === 'Escola' && copia.icone === 'C')) {
      copia.icone = iconeEsperado;
    }
    if (!copia.cor || (copia.categoria === 'Escola' && copia.cor === '#F59E0B')) {
      copia.cor = corEsperada;
    }

    return copia;
  }

  /**
   * Garante inicialização no localStorage a partir do catálogo semente e auto-repara categorias/símbolos
   */
  function garantirBancoInicial() {
    try {
      var gravado = localStorage.getItem(STORAGE_KEY);
      if (!gravado || gravado === '[]') {
        var semente = (typeof window.BANCO_SEMENTE_ESCOLAS !== 'undefined' && Array.isArray(window.BANCO_SEMENTE_ESCOLAS))
          ? window.BANCO_SEMENTE_ESCOLAS.map(sanitizarRegistroEscola)
          : [];
        if (semente.length > 0) {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(semente));
        }
      } else {
        try {
          var arr = JSON.parse(gravado);
          if (Array.isArray(arr)) {
            var antesStr = JSON.stringify(arr);
            var saneadoArr = arr.filter(Boolean).map(sanitizarRegistroEscola);
            var depoisStr = JSON.stringify(saneadoArr);
            if (antesStr !== depoisStr) {
              localStorage.setItem(STORAGE_KEY, depoisStr);
            }
          }
        } catch (eMig) {
          console.warn('[EscolasView] Erro na auto-migração de escolas:', eMig);
        }
      }
    } catch (e) {
      console.warn('[EscolasView] LocalStorage inacessível:', e);
    }
  }

  /**
   * Retorna lista de escolas do localStorage ou semente
   */
  function obterEscolas() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var arr = JSON.parse(raw);
        if (Array.isArray(arr) && arr.length > 0) {
          return arr.filter(Boolean).map(sanitizarRegistroEscola);
        }
      }
    } catch (e) {
      console.warn('[EscolasView] Erro ao ler escolas do localStorage:', e);
    }
    if (typeof window.BANCO_SEMENTE_ESCOLAS !== 'undefined' && Array.isArray(window.BANCO_SEMENTE_ESCOLAS)) {
      return window.BANCO_SEMENTE_ESCOLAS.slice();
    }
    return [];
  }

  /**
   * Persiste lista de escolas no localStorage
   */
  function salvarEscolas(arr) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
      return true;
    } catch (e) {
      console.error('[EscolasView] Erro ao salvar escolas:', e);
      if (window.OlymposApp && typeof window.OlymposApp.showToast === 'function') {
        window.OlymposApp.showToast('Erro ao salvar dados no armazenamento local.', true);
      }
      return false;
    }
  }

  /**
   * Inicializa o mapa Leaflet 1.9.4
   */
  function inicializarMapa() {
    var mapEl = document.getElementById('mapaEscolasCearaMirim') || document.getElementById('mapaEscolas');
    if (!mapEl || typeof window.L === 'undefined') return;

    if (!leafletMap) {
      leafletMap = window.L.map(mapEl.id, {
        center: [-5.634, -35.428],
        zoom: 11,
        zoomControl: true,
        scrollWheelZoom: true
      });

      window.L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors • SMEB Ceará-Mirim'
      }).addTo(leafletMap);

      markersLayer = window.L.layerGroup().addTo(leafletMap);

      leafletMap.on('click', function(e) {
        tratarCliqueMapa(e);
      });
    }

    setTimeout(function() {
      if (leafletMap) leafletMap.invalidateSize();
    }, 150);

    renderizarMarcadores();
  }

  /**
   * Trata clique interativo no mapa
   */
  function tratarCliqueMapa(e) {
    var lat = e.latlng.lat;
    var lng = e.latlng.lng;

    var liveDisplay = document.getElementById('escolasCoordLiveDisplay');
    if (liveDisplay) {
      liveDisplay.textContent = 'Lat: ' + lat.toFixed(6) + ' | Lng: ' + lng.toFixed(6);
    }

    var modal = document.getElementById('modalCadastroEscola') || document.getElementById('modalEscola');
    var isModalAberto = modal && !modal.classList.contains('hidden') && modal.style.display !== 'none';

    if (isModalAberto) {
      var inLat = document.getElementById('escolaLatitude');
      var inLng = document.getElementById('escolaLongitude');
      if (inLat && inLng) {
        inLat.value = lat.toFixed(6);
        inLng.value = lng.toFixed(6);
        validarCoordenadasForm();
      }

      if (window.OlymposApp && typeof window.OlymposApp.showToast === 'function') {
        window.OlymposApp.showToast('📍 Coordenadas capturadas do clique no mapa!');
      }
    }

    if (leafletMap) {
      if (tempClickMarker) {
        leafletMap.removeLayer(tempClickMarker);
      }
      var clickIcon = window.L.divIcon({
        className: 'escola-click-divicon',
        html: '<div style="width: 14px; height: 14px; border-radius: 50%; background: #EF4444; border: 2px solid #FFFFFF; box-shadow: 0 0 0 4px rgba(239,68,68,0.35); animation: pulse 1.5s infinite;"></div>',
        iconSize: [14, 14],
        iconAnchor: [7, 7]
      });
      tempClickMarker = window.L.marker([lat, lng], { icon: clickIcon, zIndexOffset: 1000 }).addTo(leafletMap);

      if (!isModalAberto) {
        setTimeout(function() {
          if (tempClickMarker && leafletMap) {
            leafletMap.removeLayer(tempClickMarker);
            tempClickMarker = null;
          }
        }, 4000);
      }
    }
  }

  /**
   * Valida se latitude e longitude estão na bounding box de Ceará-Mirim
   */
  function estaEmCearaMirim(lat, lng) {
    var nLat = parseFloat(lat);
    var nLng = parseFloat(lng);
    if (isNaN(nLat) || isNaN(nLng)) return false;
    return nLat >= BOUNDS_CEARA_MIRIM.minLat &&
           nLat <= BOUNDS_CEARA_MIRIM.maxLat &&
           nLng >= BOUNDS_CEARA_MIRIM.minLng &&
           nLng <= BOUNDS_CEARA_MIRIM.maxLng;
  }

  /**
   * Atualiza badge visual de validação no formulário
   */
  function validarCoordenadasForm() {
    var inLat = document.getElementById('escolaLatitude');
    var inLng = document.getElementById('escolaLongitude');
    var badge = document.getElementById('escolaCoordValidacaoBadge');
    if (!badge || !inLat || !inLng) return;

    var lat = parseFloat(inLat.value);
    var lng = parseFloat(inLng.value);

    if (isNaN(lat) || isNaN(lng)) {
      badge.className = 'pill-badge pill-muted';
      badge.textContent = 'Informe latitude e longitude decimais válidas.';
      return;
    }

    if (estaEmCearaMirim(lat, lng)) {
      badge.className = 'pill-badge pill-green';
      badge.innerHTML = '✓ Coordenadas dentro da delimitação territorial de Ceará-Mirim/RN';
    } else {
      badge.className = 'pill-badge pill-amber';
      badge.innerHTML = '⚠️ Atenção: Ponto fora dos limites territoriais típicos de Ceará-Mirim';
    }
  }

  /**
   * Determina a cor visual do marcador estritamente pela Categoria Institucional e Zona.
   * Somente 'Centro de Educação Infantil' recebe o âmbar (#F59E0B).
   */
  function obterCorPorCategoria(categoria, zona, nome) {
    var catInst = normalizarCategoriaInstitucional(categoria, nome);
    var zon = String(zona || '').toLowerCase();

    if (catInst === 'Instituição') return '#D4AF37'; // Dourado Instituição / Sede
    if (catInst === 'Centro de Educação Infantil') return '#F59E0B'; // Âmbar exclusivo CEI
    if (zon.includes('rural')) return '#10B981'; // Verde Escola Rural
    return '#38BDF8'; // Azul Escola Urbana
  }

  /**
   * Determina o ícone ou letra no centro do marcador circular estritamente pela Categoria Institucional.
   * Escolas ('Escola') jamais recebem 'C' mesmo que ofertem Ed. Infantil + Ens. Fundamental I.
   */
  function obterIconePorCategoria(categoria, zona, nome) {
    var catInst = normalizarCategoriaInstitucional(categoria, nome);
    var zon = String(zona || '').toLowerCase();

    if (catInst === 'Instituição') return '★';
    if (catInst === 'Centro de Educação Infantil') return 'C';
    if (zon.includes('rural')) return 'R';
    return 'U';
  }

  /**
   * Determina a cor visual do marcador considerando rede e categoria institucional
   */
  function obterCorPorRedeECategoria(rede, categoria, zona, nome) {
    var r = String(rede || 'Municipal').toLowerCase();
    if (r === 'estadual') return '#2563EB';
    if (r === 'federal') return '#16A34A';
    if (r === 'privada') return '#9333EA';
    return obterCorPorCategoria(categoria, zona, nome);
  }

  /**
   * Determina o ícone ou símbolo do marcador considerando rede e categoria institucional
   */
  function obterIconePorRedeECategoria(rede, categoria, zona, nome) {
    var r = String(rede || 'Municipal').toLowerCase();
    if (r === 'estadual') return '🏛';
    if (r === 'federal') return '🎓';
    if (r === 'privada') return '⭐';
    return obterIconePorCategoria(categoria, zona, nome);
  }

  /**
   * Renderiza todos os marcadores no mapa Leaflet
   */
  function renderizarMarcadores() {
    if (!leafletMap || !markersLayer) return;
    markersLayer.clearLayers();
    markerMap = {};

    var escolas = obterEscolasFiltradas();

    escolas.forEach(function(escola) {
      var lat = parseFloat(escola.lat);
      var lng = parseFloat(escola.lng);
      if (isNaN(lat) || isNaN(lng)) return;

      var rede = escola.rede || 'Municipal';
      var catInst = normalizarCategoriaInstitucional(escola.categoria, escola.nome);
      var corCalculada = obterCorPorRedeECategoria(rede, catInst, escola.zona, escola.nome);
      var iconeCalculado = obterIconePorRedeECategoria(rede, catInst, escola.zona, escola.nome);

      // Protege contra ícone 'C' residual em unidades do tipo 'Escola'
      var cor = (catInst === 'Escola' && escola.cor === '#F59E0B') ? corCalculada : (escola.cor || corCalculada);
      var icone = (catInst === 'Escola' && escola.icone === 'C') ? iconeCalculado : (escola.icone || iconeCalculado);

      var markerHtml =
        '<div style="background:' + cor + '; width: 24px; height: 24px; border-radius: 50%; border: 2.5px solid #FFFFFF; box-shadow: 0 2px 6px rgba(0,0,0,0.38); display: flex; align-items: center; justify-content: center; font-size: 11px; color: #FFFFFF; font-weight: 700; cursor: pointer; transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);">' +
        icone +
        '</div>';

      var divIcon = window.L.divIcon({
        className: 'cadmo-leaflet-divicon escola-leaflet-divicon',
        html: markerHtml,
        iconSize: [24, 24],
        iconAnchor: [12, 12],
        popupAnchor: [0, -14]
      });

      var marker = window.L.marker([lat, lng], { icon: divIcon });

      var rotaUrl = 'https://www.google.com/maps/dir/?api=1&destination=' + lat.toFixed(6) + ',' + lng.toFixed(6);

      var segmentos = Array.isArray(escola.segmentos) && escola.segmentos.length > 0
        ? escola.segmentos
        : normalizarSegmentosDeCategoria(catInst, escola.nome);

      var segmentosHtml = segmentos.map(function(seg) {
        return '<span class="pill-segmento-mini">' + escapeHtml(seg) + '</span>';
      }).join(' ');

      var redeClass = 'pill-rede-' + (rede.toLowerCase());

      var popupHtml =
        '<div class="cadmo-map-popup escola-map-popup">' +
          '<div class="escola-popup-header">' +
            '<span class="pill-badge pill-rede ' + redeClass + '">' + escapeHtml(rede) + '</span>' +
            '<span class="escola-popup-meta-tag">' + escapeHtml(catInst) + ' • ' + escapeHtml(escola.zona || 'Urbana') + '</span>' +
          '</div>' +
          '<strong class="escola-popup-title">' + escapeHtml(escola.nome) + '</strong>' +
          '<div class="escola-popup-segmentos">' + segmentosHtml + '</div>' +
          (escola.bairroDistrito ? '<div class="escola-popup-detail">📍 <strong>Bairro/Distrito:</strong> ' + escapeHtml(escola.bairroDistrito) + '</div>' : '') +
          (escola.endereco ? '<div class="escola-popup-address">' + escapeHtml(escola.endereco) + '</div>' : '') +
          (escola.inep ? '<div class="escola-popup-detail">INEP: <code>' + escapeHtml(escola.inep) + '</code></div>' : '') +
          (escola.telefone ? '<div class="escola-popup-detail">📞 ' + escapeHtml(escola.telefone) + '</div>' : '') +
          '<div class="escola-popup-coords">' +
            lat.toFixed(6) + ', ' + lng.toFixed(6) +
          '</div>' +
          '<div class="escola-popup-actions">' +
            '<button type="button" class="btn-map-action" onclick="window.OlymposViews.escolas.abrirModalEdicao(\'' + escola.id + '\')">✏️ Editar</button>' +
            '<button type="button" class="btn-map-action" onclick="window.OlymposViews.escolas.excluirEscola(\'' + escola.id + '\')">🗑️ Excluir</button>' +
            '<a href="' + rotaUrl + '" target="_blank" rel="noopener" class="btn-map-action">🗺️ Rota</a>' +
            '<button type="button" class="btn-map-action" onclick="window.OlymposViews.escolas.copiarCoordenadas(' + lat + ', ' + lng + ')">📋 Copiar</button>' +
          '</div>' +
        '</div>';

      marker.bindPopup(popupHtml);
      markersLayer.addLayer(marker);
      markerMap[escola.id] = marker;
    });
  }

  /**
   * Filtra lista conforme busca textual, rede, segmento, categoria institucional e zona
   */
  function obterEscolasFiltradas() {
    var todas = obterEscolas();
    var termo = (currentSearchTerm || '').trim().toLowerCase();
    var filtroCat = String(activeCategoryFilter || 'todas').toLowerCase();
    var filtroZona = String(activeZonaFilter || 'todas').toLowerCase();
    var filtroRede = activeRedeFilter;
    var filtroSeg = activeSegmentFilter;

    var termoNormalizado = termo;
    var termoAlternativo = null;
    if (termo === 'cmei') {
      termoAlternativo = 'cei';
    } else if (termo === 'cei') {
      termoAlternativo = 'cmei';
    }

    return todas.filter(function(item) {
      var catInst = normalizarCategoriaInstitucional(item.categoria, item.nome);
      var catLow = catInst.toLowerCase();
      var zon = String(item.zona || 'Urbana').toLowerCase();
      var rede = String(item.rede || 'Municipal');
      var segmentos = Array.isArray(item.segmentos) && item.segmentos.length > 0
        ? item.segmentos
        : normalizarSegmentosDeCategoria(catInst, item.nome);

      // 1. Filtro por Rede
      if (filtroRede && filtroRede !== 'todas') {
        if (rede.toLowerCase() !== filtroRede.toLowerCase()) {
          return false;
        }
      }

      // 2. Filtro por Segmento (Inclusivo)
      if (filtroSeg && filtroSeg !== 'todos') {
        var matchSeg = segmentos.some(function(s) {
          return s.toLowerCase() === filtroSeg.toLowerCase();
        });
        if (!matchSeg) {
          return false;
        }
      }

      // 3. Filtro de Categoria Institucional (e aliases legados)
      if (filtroCat && filtroCat !== 'todas') {
        if (filtroCat === 'escola' || filtroCat === 'escolas') {
          if (catInst !== 'Escola') return false;
        } else if (filtroCat === 'cei' || filtroCat === 'cmei' || filtroCat === 'centro de educação infantil') {
          if (catInst !== 'Centro de Educação Infantil') return false;
        } else if (filtroCat === 'instituicao' || filtroCat === 'instituição' || filtroCat === 'sede') {
          if (catInst !== 'Instituição') return false;
        } else if (filtroCat === 'urbana') {
          if (zon !== 'urbana') return false;
        } else if (filtroCat === 'rural') {
          if (zon !== 'rural') return false;
        }
      }

      // 4. Filtro de Zona dedicado
      if (filtroZona && filtroZona !== 'todas') {
        if (zon !== filtroZona) return false;
      }

      // 5. Filtro de Busca Textual
      if (termoNormalizado) {
        var strNome = String(item.nome || '').toLowerCase();
        var strBairro = String(item.bairroDistrito || '').toLowerCase();
        var strEndereco = String(item.endereco || '').toLowerCase();
        var strInep = String(item.inep || '').toLowerCase();
        var strRede = rede.toLowerCase();
        var strSegs = segmentos.join(' ').toLowerCase();

        var matchPadrao = strNome.includes(termoNormalizado) ||
                          strBairro.includes(termoNormalizado) ||
                          strEndereco.includes(termoNormalizado) ||
                          strInep.includes(termoNormalizado) ||
                          strRede.includes(termoNormalizado) ||
                          strSegs.includes(termoNormalizado) ||
                          catLow.includes(termoNormalizado);

        var matchAlt = termoAlternativo ? (strNome.includes(termoAlternativo) || catLow.includes(termoAlternativo)) : false;

        if (!matchPadrao && !matchAlt) {
          return false;
        }
      }

      return true;
    });
  }

  /**
   * Renderiza todos os blocos da interface: KPIs, Tabela e Marcadores
   */
  function renderizarInterface() {
    renderizarKpis();
    renderizarMarcadores();
    renderizarTabela();
  }

  /**
   * Atualiza cartões numéricos KPI usando estritamente a Categoria Institucional normalizada
   */
  function renderizarKpis() {
    var todas = obterEscolas();
    var totalMunicipal = 0;
    var urbanasMun = 0;
    var ruraisMun = 0;
    var ceisMun = 0;
    var estaduais = 0;
    var federais = 0;
    var privadas = 0;

    todas.forEach(function(item) {
      var rede = String(item.rede || 'Municipal').toLowerCase();
      var catInst = normalizarCategoriaInstitucional(item.categoria, item.nome);
      var zon = String(item.zona || '').toLowerCase();

      if (rede === 'estadual') {
        estaduais++;
      } else if (rede === 'federal') {
        federais++;
      } else if (rede === 'privada') {
        privadas++;
      } else {
        totalMunicipal++;
        if (catInst === 'Centro de Educação Infantil') {
          ceisMun++;
        } else if (zon === 'rural') {
          ruraisMun++;
        } else {
          urbanasMun++;
        }
      }
    });

    var elTotal = document.getElementById('kpiEscolasTotal');
    var elUrbanas = document.getElementById('kpiEscolasUrbanas');
    var elRurais = document.getElementById('kpiEscolasRurais');
    var elCeis = document.getElementById('kpiEscolasCeis') || document.getElementById('kpiEscolasCmeis');
    var elEstaduais = document.getElementById('kpiEscolasEstaduais');
    var elFederais = document.getElementById('kpiEscolasFederais');
    var elPrivadas = document.getElementById('kpiEscolasPrivadas');

    if (elTotal) elTotal.textContent = totalMunicipal;
    if (elUrbanas) elUrbanas.textContent = urbanasMun;
    if (elRurais) elRurais.textContent = ruraisMun;
    if (elCeis) elCeis.textContent = ceisMun;
    if (elEstaduais) elEstaduais.textContent = estaduais;
    if (elFederais) elFederais.textContent = federais;
    if (elPrivadas) elPrivadas.textContent = privadas;
  }

  /**
   * Renderiza a listagem tabular das escolas
   */
  function renderizarTabela() {
    var tbody = document.getElementById('tabelaEscolasBody');
    var contagem = document.getElementById('escolasContagemExibida');
    if (!tbody) return;

    var lista = obterEscolasFiltradas();
    if (contagem) {
      contagem.textContent = 'Exibindo ' + lista.length + ' de ' + obterEscolas().length + ' unidades cadastradas';
    }

    if (lista.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" class="text-muted text-center" style="padding: 32px;">Nenhuma unidade escolar encontrada com os filtros aplicados.</td></tr>';
      return;
    }

    var html = '';
    lista.forEach(function(escola) {
      var lat = parseFloat(escola.lat);
      var lng = parseFloat(escola.lng);
      var rede = escola.rede || 'Municipal';
      var catInst = normalizarCategoriaInstitucional(escola.categoria, escola.nome);
      var corCalc = obterCorPorRedeECategoria(rede, catInst, escola.zona, escola.nome);
      var cor = (catInst === 'Escola' && escola.cor === '#F59E0B') ? corCalc : (escola.cor || corCalc);
      var redeClass = 'pill-rede-' + (rede.toLowerCase());
      var segmentos = Array.isArray(escola.segmentos) && escola.segmentos.length > 0
        ? escola.segmentos
        : normalizarSegmentosDeCategoria(catInst, escola.nome);
      var segsHtml = segmentos.map(function(s) {
        return '<span class="pill-segmento">' + escapeHtml(s) + '</span>';
      }).join('');

      html += '<tr data-escola-id="' + escola.id + '">';
      html += '<td data-label="Unidade Escolar">';
      html +=   '<div style="display: flex; align-items: center; gap: 8px;">';
      html +=     '<span style="display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; background: ' + cor + ';"></span>';
      html +=     '<div>';
      html +=       '<strong style="color: var(--text-main); font-size: 13px;">' + escapeHtml(escola.nome) + '</strong>';
      html +=       '<div style="font-size: 11px; color: var(--text-muted);">' + escapeHtml(catInst) + (escola.inep ? ' • INEP: <code>' + escapeHtml(escola.inep) + '</code>' : '') + '</div>';
      html +=     '</div>';
      html +=   '</div>';
      html += '</td>';
      html += '<td data-label="Rede"><span class="pill-badge pill-rede ' + redeClass + '">' + escapeHtml(rede) + '</span></td>';
      html += '<td data-label="Segmentos Atendidos">' + segsHtml + '</td>';

                  lat.toFixed(6) + ', ' + lng.toFixed(6) +
                '</span>';

      html +=     '<button type="button" class="btn btn-secondary btn-mini" title="Editar informações cadastrais" onclick="window.OlymposViews.escolas.abrirModalEdicao(\'' + escola.id + '\')">✏️ Editar</button>';
      html +=     '<button type="button" class="btn btn-ghost btn-mini" style="color: #EF4444;" title="Excluir escola" onclick="window.OlymposViews.escolas.excluirEscola(\'' + escola.id + '\')">🗑️</button>';
      html +=   '</div>';
      html += '</td>';
      html += '</tr>';
    });

    tbody.innerHTML = html;

  /**
   * Abre modal em modo de inclusão (Create)
   */
  function abrirModalCadastro(lat, lng) {
    var modal = document.getElementById('modalCadastroEscola') || document.getElementById('modalEscola');
    var titulo = document.getElementById('modalCadastroEscolaTitulo') || document.getElementById('modalEscolaTitulo');
    var form = document.getElementById('formCadastroEscola') || document.getElementById('formEscola');
    if (!modal || !form) return;

    form.reset();
    var inId = document.getElementById('escolaId');
    if (inId) inId.value = '';

    var inRede = document.getElementById('escolaRede');
    if (inRede) inRede.value = 'Municipal';

    var inCat = document.getElementById('escolaCategoria');
    if (inCat) inCat.value = 'Escola';

    document.querySelectorAll('input[name="escolaSegmentos"]').forEach(function(ck) {
      ck.checked = (ck.value === 'Ens. Fundamental I');
    });

    if (titulo) titulo.textContent = 'Cadastrar Nova Unidade Escolar';

    var inLat = document.getElementById('escolaLatitude');
    var inLng = document.getElementById('escolaLongitude');
    if (inLat && inLng) {
      if (typeof lat === 'number' && typeof lng === 'number') {
        inLat.value = lat.toFixed(6);
        inLng.value = lng.toFixed(6);
      } else {
        inLat.value = '-5.634000';
        inLng.value = '-35.428000';
      }
      validarCoordenadasForm();
    }

    modal.classList.remove('hidden');
    modal.style.display = 'flex';

    var inNome = document.getElementById('escolaNome');
    if (inNome) inNome.focus();
  }

  /**
   * Abre modal em modo de edição (Update)
   */
  function abrirModalEdicao(id) {
    var modal = document.getElementById('modalCadastroEscola') || document.getElementById('modalEscola');
    var titulo = document.getElementById('modalCadastroEscolaTitulo') || document.getElementById('modalEscolaTitulo');
    var form = document.getElementById('formCadastroEscola') || document.getElementById('formEscola');
    if (!modal || !form) return;

    var escolas = obterEscolas();
    var escola = escolas.find(function(e) { return e.id === id; });
    if (!escola) {
      if (window.OlymposApp && typeof window.OlymposApp.showToast === 'function') {
        window.OlymposApp.showToast('Unidade escolar não localizada para edição.', true);
      }
      return;
    }

    form.reset();

    var inId = document.getElementById('escolaId');
    var inNome = document.getElementById('escolaNome');
    var inInep = document.getElementById('escolaInep');
    var inRede = document.getElementById('escolaRede');
    var inCat = document.getElementById('escolaCategoria');
    var inZona = document.getElementById('escolaZona');
    var inBairro = document.getElementById('escolaBairroDistrito');
    var inEnd = document.getElementById('escolaEndereco');
    var inTel = document.getElementById('escolaTelefone');
    var inDir = document.getElementById('escolaDiretor');
    var inLat = document.getElementById('escolaLatitude');
    var inLng = document.getElementById('escolaLongitude');

    var catInst = normalizarCategoriaInstitucional(escola.categoria, escola.nome);

    if (inId) inId.value = escola.id;
    if (inNome) inNome.value = escola.nome || '';
    if (inInep) inInep.value = escola.inep || '';
    if (inRede) inRede.value = escola.rede || 'Municipal';
    if (inCat) inCat.value = CATEGORIAS_INSTITUCIONAIS.includes(catInst) ? catInst : 'Escola';
    if (inZona) inZona.value = escola.zona || 'Urbana';
    if (inBairro) inBairro.value = escola.bairroDistrito || '';
    if (inEnd) inEnd.value = escola.endereco || '';
    if (inTel) inTel.value = escola.telefone || '';
    if (inDir) inDir.value = escola.diretor || '';
    if (inLat) inLat.value = parseFloat(escola.lat).toFixed(6);
    if (inLng) inLng.value = parseFloat(escola.lng).toFixed(6);

    var segs = Array.isArray(escola.segmentos) && escola.segmentos.length > 0
      ? escola.segmentos
      : normalizarSegmentosDeCategoria(catInst, escola.nome);

    document.querySelectorAll('input[name="escolaSegmentos"]').forEach(function(ck) {
      ck.checked = segs.includes(ck.value);
    });

    validarCoordenadasForm();

    if (titulo) titulo.textContent = 'Editar Unidade: ' + escola.nome;

    modal.classList.remove('hidden');
    modal.style.display = 'flex';
  }

  /**
   * Fecha o modal de cadastro/edição
   */
  function fecharModal() {
    var modal = document.getElementById('modalCadastroEscola') || document.getElementById('modalEscola');
    if (modal) {
      modal.classList.add('hidden');
      modal.style.display = 'none';
    }

  /**
   * Salva dados submetidos pelo formulário (Create ou Update) sem jamais sobrescrever
   * a Categoria Institucional com a lista de segmentos.
   */
  function salvarEscolaSubmit(e) {
    if (e && e.preventDefault) e.preventDefault();

    var inId = document.getElementById('escolaId');
    var inNome = document.getElementById('escolaNome');
    var inInep = document.getElementById('escolaInep');
    var inRede = document.getElementById('escolaRede');
    var inCat = document.getElementById('escolaCategoria');
    var inZona = document.getElementById('escolaZona');
    var inBairro = document.getElementById('escolaBairroDistrito');
    var inEnd = document.getElementById('escolaEndereco');
    var inTel = document.getElementById('escolaTelefone');
    var inDir = document.getElementById('escolaDiretor');
    var inLat = document.getElementById('escolaLatitude');
    var inLng = document.getElementById('escolaLongitude');

    var nome = (inNome ? inNome.value : '').trim();
    var inep = (inInep ? inInep.value : '').trim();
    var rede = (inRede ? inRede.value : 'Municipal').trim() || 'Municipal';
    var categoria = normalizarCategoriaInstitucional(inCat ? inCat.value : 'Escola', nome);
    var zona = (inZona ? inZona.value : 'Urbana').trim();
    var bairro = (inBairro ? inBairro.value : '').trim();
    var endereco = (inEnd ? inEnd.value : '').trim();
    var telefone = (inTel ? inTel.value : '').trim();
    var diretor = (inDir ? inDir.value : '').trim();
    var lat = parseFloat(inLat ? inLat.value : '');
    var lng = parseFloat(inLng ? inLng.value : '');

    if (!nome) {
      alert('O nome da unidade escolar é obrigatório.');
      return;
    }
    if (isNaN(lat) || isNaN(lng)) {
      alert('Latitude e longitude devem ser números válidos.');
      return;
    }

    var segmentos = [];
    document.querySelectorAll('input[name="escolaSegmentos"]:checked').forEach(function(ck) {
      if (ck.value) segmentos.push(ck.value);
    });
    if (segmentos.length === 0) {
      segmentos = normalizarSegmentosDeCategoria(categoria, nome);
    }

    var id = (inId ? inId.value : '').trim();
    var escolas = obterEscolas();
    var cor = obterCorPorRedeECategoria(rede, categoria, zona, nome);
    var icone = obterIconePorRedeECategoria(rede, categoria, zona, nome);

    var escolaObjeto = null;

    if (id) {
      var idx = escolas.findIndex(function(item) { return item.id === id; });
      if (idx !== -1) {
        escolas[idx].nome = nome;
        escolas[idx].inep = inep;
        escolas[idx].rede = rede;
        escolas[idx].segmentos = segmentos;
        escolas[idx].categoria = categoria;
        escolas[idx].zona = zona;
        escolas[idx].bairroDistrito = bairro;
        escolas[idx].endereco = endereco;
        escolas[idx].telefone = telefone;
        escolas[idx].diretor = diretor;
        escolas[idx].lat = lat;
        escolas[idx].lng = lng;
        escolas[idx].cor = cor;
        escolas[idx].icone = icone;
        escolaObjeto = escolas[idx];
      }
    } else {
      var novoId = 'esc_' + Date.now();
      escolaObjeto = {
        id: novoId,
        nome: nome,
        inep: inep,
        rede: rede,
        segmentos: segmentos,
        categoria: categoria,
        zona: zona,
        bairroDistrito: bairro,
        endereco: endereco,
        telefone: telefone,
        diretor: diretor,
        lat: lat,
        lng: lng,
        cor: cor,
        icone: icone,
        turnos: ['Matutino', 'Vespertino']
      };
      escolas.unshift(escolaObjeto);
      id = novoId;
    }

    salvarEscolas(escolas);
    fecharModal();
    renderizarInterface();

    // Sincroniza registro individual e o arquivo JSON completo no Supabase
    if (escolaObjeto && window.OlymposSupabase) {
      if (typeof window.OlymposSupabase.sincronizarEscola === 'function') {
        window.OlymposSupabase.sincronizarEscola(escolaObjeto);
      }
      if (typeof window.OlymposSupabase.sincronizarCatalogoEscolasJson === 'function') {
        window.OlymposSupabase.sincronizarCatalogoEscolasJson(escolas);
      }
    }

    if (window.OlymposApp && typeof window.OlymposApp.showToast === 'function') {
      window.OlymposApp.showToast('Unidade escolar salva com sucesso!');
    }

    centralizarEscola(lat, lng, id);
  }

  /**
   * Exclui uma unidade escolar com confirmação amigável e sincroniza com Supabase
   */
  function excluirEscola(id) {
    var escolas = obterEscolas();
    var escola = escolas.find(function(e) { return e.id === id; });
    var nome = escola ? escola.nome : 'esta unidade';

    if (!confirm('Deseja realmente remover "' + nome + '" do mapa municipal?')) {
      return;
    }

    var filtradas = escolas.filter(function(e) { return e.id !== id; });
    salvarEscolas(filtradas);
    renderizarInterface();

    if (window.OlymposSupabase) {
      if (typeof window.OlymposSupabase.excluirEscola === 'function') {
        window.OlymposSupabase.excluirEscola(id);
      }
      if (typeof window.OlymposSupabase.sincronizarCatalogoEscolasJson === 'function') {
        window.OlymposSupabase.sincronizarCatalogoEscolasJson(filtradas);
      }
    }

    if (window.OlymposApp && typeof window.OlymposApp.showToast === 'function') {
      window.OlymposApp.showToast('Unidade escolar removida do mapa.');
    }
  }

  /**
   * Centraliza a visualização do mapa em uma unidade específica e abre seu popup
   */
  function centralizarEscola(lat, lng, id) {
    if (!leafletMap) return;

    var nLat = parseFloat(lat);
    var nLng = parseFloat(lng);
    if (isNaN(nLat) || isNaN(nLng)) return;

    leafletMap.flyTo([nLat, nLng], 15, {
      duration: 1.2
    });

    setTimeout(function() {
      if (id && markerMap[id]) {
        markerMap[id].openPopup();
      }
    }, 600);

    var outer = document.querySelector('.escola-map-outer') || document.getElementById('mapaEscolasCearaMirim');
    if (outer && typeof outer.scrollIntoView === 'function') {
      outer.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }

  /**
   * Recentraliza o mapa para a visão global de Ceará-Mirim
   */
  function recentralizarMapa() {
    if (leafletMap) {
      leafletMap.flyTo([-5.634, -35.428], 11, { duration: 1.0 });
    }
  }

  /**
   * Copia coordenadas geográficas para a área de transferência
   */
  function copiarCoordenadas(lat, lng) {
    var texto = lat.toFixed(6) + ', ' + lng.toFixed(6);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(texto).then(function() {
        if (window.OlymposApp && typeof window.OlymposApp.showToast === 'function') {
          window.OlymposApp.showToast('Coordenadas copiadas: ' + texto);
        }
      });
    } else {
      prompt('Copie as coordenadas:', texto);
    }
  }

  /**
   * Exporta os registros em arquivo JSON
   */
  function exportarJson() {
    var escolas = obterEscolas();
    var jsonStr = JSON.stringify(escolas, null, 2);
    var blob = new Blob([jsonStr], { type: 'application/json;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'escolas_cearamirim_' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    if (window.OlymposApp && typeof window.OlymposApp.showToast === 'function') {
      window.OlymposApp.showToast('Arquivo JSON de escolas exportado com sucesso!');
    }
  }

  /**
   * Importa arquivo JSON com validação de formato e sincronização com Supabase
   */
  function importarJson(file) {
    if (!file) return;

    var reader = new FileReader();
    reader.onload = function(evt) {
      try {
        var dados = JSON.parse(evt.target.result);
        if (!Array.isArray(dados)) {
          alert('O arquivo deve conter uma lista JSON de unidades escolares.');
          return;
        }

        var validas = dados.filter(function(item) {
          return item && item.nome && !isNaN(parseFloat(item.lat)) && !isNaN(parseFloat(item.lng));
        }).map(sanitizarRegistroEscola);

        if (validas.length === 0) {
          alert('Nenhuma unidade escolar válida localizada no arquivo JSON.');
          return;
        }

        if (confirm('Foram identificadas ' + validas.length + ' escolas válidas. Deseja substituir a base atual?')) {
          salvarEscolas(validas);
          renderizarInterface();

          if (window.OlymposSupabase) {
            if (typeof window.OlymposSupabase.sincronizarCatalogoEscolasJson === 'function') {
              window.OlymposSupabase.sincronizarCatalogoEscolasJson(validas);
            }
            if (typeof window.OlymposSupabase.sincronizarEscola === 'function') {
              validas.forEach(function(item) {
                window.OlymposSupabase.sincronizarEscola(item);
              });
            }
          }

          if (window.OlymposApp && typeof window.OlymposApp.showToast === 'function') {
            window.OlymposApp.showToast('Importação concluída: ' + validas.length + ' unidades carregadas!');
          }
        }
      } catch (err) {
        console.error('[EscolasView] Erro ao ler JSON:', err);
        alert('Erro ao interpretar o arquivo JSON: ' + err.message);
      }
    };
    reader.readAsText(file, 'utf-8');
  }

  /**
   * Restaura o catálogo semente oficial de 25 unidades
   */
  function restaurarPadroes() {
    if (confirm('Deseja restaurar o catálogo oficial de unidades de Ceará-Mirim? Modificações manuais serão redefinidas.')) {
      if (typeof window.BANCO_SEMENTE_ESCOLAS !== 'undefined' && Array.isArray(window.BANCO_SEMENTE_ESCOLAS)) {
        var padrao = window.BANCO_SEMENTE_ESCOLAS.map(sanitizarRegistroEscola);
        salvarEscolas(padrao);
        renderizarInterface();
        recentralizarMapa();

        if (window.OlymposSupabase && typeof window.OlymposSupabase.sincronizarCatalogoEscolasJson === 'function') {
          window.OlymposSupabase.sincronizarCatalogoEscolasJson(padrao);
        }

        if (window.OlymposApp && typeof window.OlymposApp.showToast === 'function') {
          window.OlymposApp.showToast('Catálogo oficial de escolas restaurado com sucesso!');
        }
      }
    }
  }

  /**
   * Observa quando a view de escolas torna-se visível para reajustar Leaflet
   */
  function observarVisibilidadePagina() {
    var pageEscolas = document.getElementById('page-escolas');
    if (!pageEscolas || observerEscolas) return;

    observerEscolas = new MutationObserver(function() {
      if (!pageEscolas.classList.contains('hidden')) {
        if (leafletMap) {
          setTimeout(function() {
            leafletMap.invalidateSize();
          }, 120);
        }
        sincronizarInicialComSupabase();
      }
    });

    observerEscolas.observe(pageEscolas, {
      attributes: true,
      attributeFilter: ['class', 'style']
    });
  }

  /**
   * Sanitiza strings para HTML
   */
  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function setFiltroCategoria(cat) {

    renderizarInterface();
  }

  function setFiltroZona(zona) {

    renderizarInterface();
  }
