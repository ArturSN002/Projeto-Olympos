  /**
   * Motor de Matching Automático da Persona Hera:
   * Pontuação ponderada:
   *  1. Cargo / Disciplina: 40 pontos
   *  2. Carga Horária: 30 pontos
   *  3. Rota Inversa de Permuta: 30 pontos
   * Total: 0 a 100%
   * Badges: Excelente (>= 80%), Boa (>= 60%), Regular (< 60%)
   */
  function calcularCompatibilidadeHera(intA, intB) {
    // 1. Cargo & Disciplina (40 pts)
    let ptsCargo = 0;
    const mesmoCargo = intA.cargo === intB.cargo;
    const mesmaDisciplina = intA.disciplina === intB.disciplina;

    if (mesmoCargo && mesmaDisciplina) {
      ptsCargo = 40;
    } else if (mesmoCargo) {
      ptsCargo = 28;
    } else if (mesmaDisciplina) {
      ptsCargo = 18;
    } else {
      ptsCargo = 0;
    }

    // 2. Carga Horária (30 pts)
    let ptsCH = 0;
    const chA = parseInt(intA.cargaHoraria, 10) || 30;
    const chB = parseInt(intB.cargaHoraria, 10) || 30;
    const diffCH = Math.abs(chA - chB);

    if (diffCH === 0) {
      ptsCH = 30;
    } else if (diffCH <= 10) {
      ptsCH = 16; // Requer compensação de carga horária pela comissão
    } else {
      ptsCH = 0;
    }

    // 3. Rota Inversa de Permuta (30 pts)
    let ptsRota = 0;
    const munOrigA = intA.municipioOrigem || extrairMunicipioOrigem(intA.origem);
    const munDestA = intA.destino;
    const munOrigB = intB.municipioOrigem || extrairMunicipioOrigem(intB.origem);
    const munDestB = intB.destino;

    const rotaInversaExata = (munOrigA.toLowerCase() === munDestB.toLowerCase()) &&
                             (munOrigB.toLowerCase() === munDestA.toLowerCase());

    if (rotaInversaExata) {
      ptsRota = 30;
    } else if (munOrigA.toLowerCase() === munDestB.toLowerCase() || munOrigB.toLowerCase() === munDestA.toLowerCase()) {
      ptsRota = 18;
    } else {
      ptsRota = 5;
    }

    const scoreTotal = ptsCargo + ptsCH + ptsRota;

    let nivel = 'Regular';
    let badgeClass = 'badge-regular';
    let parecerHera = 'Parecer Hera: Requer análise curricular detalhada e adequação de carga horária pela Comissão de RH.';

    if (scoreTotal >= 80) {
      nivel = 'Excelente';
      badgeClass = 'badge-excelente';
      parecerHera = 'Parecer Hera: Compatibilidade pedagógica e rota geográfica recíproca perfeitas. Deferimento prioritário recomendado.';
    } else if (scoreTotal >= 60) {
      nivel = 'Boa';
      badgeClass = 'badge-boa';
      parecerHera = 'Parecer Hera: Viabilidade operacional confirmada. Necessário alinhamento de turno ou ajuste funcional leve.';
    }

    return {
      score: scoreTotal,
      nivel: nivel,
      badgeClass: badgeClass,
      ptsCargo: ptsCargo,
      ptsCH: ptsCH,
      ptsRota: ptsRota,
      parecerHera: parecerHera
    };
  }

  function executarMatchingHera() {
    const container = document.getElementById('resultadoMatchingHera');
    const badgeTotal = document.getElementById('badgeTotalMatches');
    if (!container) return;

    const banco = obterBancoPermutas();
    const matches = [];

    // Cruzamento combinatório de pares (i < j)
    for (let i = 0; i < banco.length; i++) {
      for (let j = i + 1; j < banco.length; j++) {
        const intA = banco[i];
        const intB = banco[j];

        // Evita cruzar mesma pessoa ou matrícula
        if (intA.matricula === intB.matricula) continue;

        const resultado = calcularCompatibilidadeHera(intA, intB);

        // Considera match relevante se score >= 50 ou se rota inversa for compatível
        if (resultado.score >= 50) {
          matches.push({
            candidatoA: intA,
            candidatoB: intB,
            resultado: resultado
          });
        }
      }
    }

    // Ordenação decrescente por score de compatibilidade
    matches.sort(function(a, b) {
      return b.resultado.score - a.resultado.score;
    });

    if (badgeTotal) {
      badgeTotal.textContent = matches.length + (matches.length === 1 ? ' oportunidade' : ' oportunidades');
    }

    if (matches.length === 0) {
      container.innerHTML =
        '<div class="output-panel text-center" style="padding: 32px 20px;">' +
          '<div style="font-size: 1.8rem; margin-bottom: 8px;">🤝</div>' +

    let html = '<div class="hera-matches-grid">';

              '<span class="selo-hera-badge" title="Instrução validada pela Persona Hera">⚡ Selo Hera</span>' +

              '🗺️ Ver Rota no Mapa' +
            '</button>' +
          '</div>' +

          '<div class="match-candidatos-row">' +
            '<div class="candidato-box">' +
              '<div class="candidato-badge-tag">Servidor(a) A</div>' +
              '<strong class="candidato-nome">' + window.OlymposApp.escapeHtml(cA.nome) + '</strong>' +
              '<div class="candidato-meta">Matrícula: ' + window.OlymposApp.escapeHtml(cA.matricula) + ' • ' + window.OlymposApp.escapeHtml(cA.cargaHoraria) + ' (' + window.OlymposApp.escapeHtml(cA.turno) + ')</div>' +
              '<div class="candidato-cargo">' + window.OlymposApp.escapeHtml(cA.cargo) + ' — ' + window.OlymposApp.escapeHtml(cA.disciplina) + '</div>' +
              '<div class="rota-chip-container">' +

              '<div class="candidato-cargo">' + window.OlymposApp.escapeHtml(cB.cargo) + ' — ' + window.OlymposApp.escapeHtml(cB.disciplina) + '</div>' +
              '<div class="rota-chip-container">' +
                '<span class="rota-chip-origem">' + window.OlymposApp.escapeHtml(cB.origem) + '</span>' +
                '<span class="rota-arrow">➔</span>' +
                '<span class="rota-chip-destino">' + window.OlymposApp.escapeHtml(cB.destino) + '</span>' +

            '<div class="score-pill-item">' +
              '<span class="score-pill-label">Carga Horária</span>' +
              '<span class="score-pill-val">' + res.ptsCH + ' / 30 pts</span>' +
            '</div>' +
            '<div class="score-pill-item">' +
              '<span class="score-pill-label">Rota Inversa</span>' +
              '<span class="score-pill-val">' + res.ptsRota + ' / 30 pts</span>' +
            '</div>' +
          '</div>' +

          '<div class="parecer-hera-box">' +
            '<span class="parecer-hera-icon">⚖️</span>' +

  }

  function tracarRotaPermuta(origemA, origemB, score) {
    if (!leafletMap || !routeLayer) return;
    routeLayer.clearLayers();

    // Localiza coordenadas de A e B
    let coordA = null;
    let coordB = null;

    PONTOS_GEORREFERENCIADOS.forEach(function(p) {
      if (p.nome === origemA || origemA.includes(p.nome) || p.nome.includes(origemA)) {
        coordA = p.coords;
      }
      if (p.nome === origemB || origemB.includes(p.nome) || p.nome.includes(origemB)) {
        coordB = p.coords;
      }
    });

    if (!coordA) coordA = [-5.6344, -35.4245];
    if (!coordB) coordB = [-5.7550, -35.2600];

    const corLinha = score >= 80 ? '#10B981' : (score >= 60 ? '#D4AF37' : '#64748B');

    const polyline = window.L.polyline([coordA, coordB], {
      color: corLinha,
      weight: 4,
      dashArray: '8, 8',
      opacity: 0.95
    }).addTo(routeLayer);

    const bounds = window.L.latLngBounds([coordA, coordB]);
    leafletMap.fitBounds(bounds, { padding: [50, 50], maxZoom: 13 });

    // Scroll suave até o mapa
    const mapWrapper = document.getElementById('mapaPermutasCadmo');
    if (mapWrapper) {
      mapWrapper.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    if (window.OlymposApp && typeof window.OlymposApp.showToast === 'function') {
      window.OlymposApp.showToast('Rota de permuta traçada no mapa cartográfico!');
    }
  }

  function salvarNovaIntencaoPermuta(e) {
    if (e && e.preventDefault) e.preventDefault();

    const nome = (document.getElementById('permutaNome')?.value || '').trim();
    const matricula = (document.getElementById('permutaMatricula')?.value || '').trim();
    const cargo = (document.getElementById('permutaCargo')?.value || '').trim();
    const disciplina = (document.getElementById('permutaDisciplina')?.value || '').trim();
    const cargaHoraria = (document.getElementById('permutaCargaHoraria')?.value || '').trim();
    const turno = (document.getElementById('permutaTurno')?.value || '').trim();
    const origem = (document.getElementById('permutaEscolaOrigem')?.value || '').trim();
    const destino = (document.getElementById('permutaPoloDestino')?.value || '').trim();

    if (!nome || !matricula || !cargo || !disciplina || !origem || !destino) {
      if (window.OlymposApp && typeof window.OlymposApp.showToast === 'function') {
        window.OlymposApp.showToast('Por favor, preencha todos os campos obrigatórios da permuta.', true);
      }
      return;
    }

    const novaIntencao = {
      id: 'perm_' + Date.now(),
      nome: nome,
      matricula: matricula,
      cargo: cargo,
      disciplina: disciplina,
      cargaHoraria: cargaHoraria,
      turno: turno,
      origem: origem,
      municipioOrigem: extrairMunicipioOrigem(origem),
      destino: destino,
      dataCadastro: new Date().toISOString().slice(0, 10)
    };

    try {
      const banco = obterBancoPermutas();
      banco.unshift(novaIntencao);
      localStorage.setItem(BANCO_STORAGE_KEY, JSON.stringify(banco));

      const form = document.getElementById('formPermutaCadmo');
      if (form) form.reset();

      executarMatchingHera();

      if (window.OlymposApp && typeof window.OlymposApp.showToast === 'function') {
        window.OlymposApp.showToast('Intenção de permuta gravada com sucesso! Persona Hera recalculou as compatibilidades.');
      }
    } catch (err) {
      console.error('[PapiroCadmo] Erro ao gravar intenção no localStorage:', err);
      if (window.OlymposApp && typeof window.OlymposApp.showToast === 'function') {
        window.OlymposApp.showToast('Erro ao salvar intenção de permuta.', true);
      }
    }
  }

  function renderizarPortais(termoRaw) {
    const grid = document.getElementById('cadmoPortaisGrid');
    if (!grid) return;

    const termo = String(termoRaw || '').toLowerCase().trim();
    const filtrados = PORTAIS.filter(function(p) {
      if (!termo) return true;
      return p.nome.toLowerCase().includes(termo) ||
        p.regiao.toLowerCase().includes(termo) ||
        p.tecnologia.toLowerCase().includes(termo);
    });

    grid.innerHTML = '';
    filtrados.forEach(function(p) {

  function normalizar(texto) {
    if (!texto) return '';
    return String(texto)
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toLowerCase()
      .trim();
  }

  function obterChaveStorage(arquivo) {
    return 'olympos_memoria_' + normalizar(arquivo).replace(/[^a-z0-9_]/g, '_');
  }

  function obterConteudoLocal(arquivo) {
    try {
      if (typeof localStorage === 'undefined') return null;
      var chave = obterChaveStorage(arquivo);
      return localStorage.getItem(chave);
    } catch (e) {
      return null;
    }
  }

  function salvarLocal(arquivo, conteudo) {
    try {
      if (typeof localStorage === 'undefined') return false;
      var chave = obterChaveStorage(arquivo);
      localStorage.setItem(chave, conteudo);
      localStorage.setItem(chave + '_updated_at', new Date().toISOString());
      localStorage.setItem(chave + '_pending_sync', 'true');
      return true;
    } catch (e) {
      console.warn('Erro ao salvar localmente no localStorage:', e);
      return false;
    }
  }

  function removerEdicaoLocal(arquivo) {
    try {
      if (typeof localStorage === 'undefined') return false;
      var chave = obterChaveStorage(arquivo);
      localStorage.removeItem(chave + '_pending_sync');
      return true;
    } catch (e) {
      return false;
    }
  }

  function temEdicaoLocalPendente(arquivo) {
    try {
      if (typeof localStorage === 'undefined') return false;
      var chave = obterChaveStorage(arquivo);
      return localStorage.getItem(chave + '_pending_sync') === 'true';
    } catch (e) {
      return false;
    }
  }

  function listarTodas() {
    return CANONICAL_MEMORIAS.map(function(m) {
      var local = obterConteudoLocal(m.arquivo);
      var conteudo = (local !== null && local !== undefined) ? local : m.conteudoCompleto;
      var linhas = conteudo ? conteudo.split('\n').length : 0;
      var pendente = temEdicaoLocalPendente(m.arquivo);

      return Object.assign({}, m, {
        conteudoCompleto: conteudo,
        totalLinhas: linhas,
        edicaoPendente: pendente
      });
    });
  }

  function listarExtras() {
    return HOST_PERSONAS.slice();
  }

  function obterPorArquivo(arquivo) {
    if (!arquivo) return null;
    var norm = normalizar(arquivo);
    var todas = listarTodas();

    // 1. Busca direta nas memórias canônicas
    for (var i = 0; i < todas.length; i++) {
      var m = todas[i];
      if (normalizar(m.arquivo) === norm || normalizar(m.slug) === norm || normalizar(m.nome) === norm) {
        return m;
      }
    }

    // 2. Busca entre as personas anfitriãs
    for (var j = 0; j < HOST_PERSONAS.length; j++) {
      var h = HOST_PERSONAS[j];
      if (normalizar(h.slug) === norm || normalizar(h.nome) === norm) {
        return obterPorArquivo(h.arquivoAnfitriao);
      }
    }

    return null;
  }

  function obterPorSlug(slug) {
    return obterPorArquivo(slug);
  }

  function obterPorNome(nome) {
    return obterPorArquivo(nome);
  }

  function getMapaIdsDrive() {
    var mapa = {};
    for (var i = 0; i < CANONICAL_MEMORIAS.length; i++) {
      mapa[CANONICAL_MEMORIAS[i].slug] = CANONICAL_MEMORIAS[i].id;
    }
    return mapa;
  }

      const arqHost = ex.arquivoAnfitriao || ('_memoria_' + String(ex.anfitriao || 'hestia').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase() + '.md');
      lista.push({
        isHostRouted: true,
        nome: ex.nome,
        anfitriao: ex.anfitriao,
        arquivo: arqHost,
        dominio: ex.dominio || '',
        icone: ex.icone || ex.nome
      });
    });

    return lista;
  }

  function renderizarGrade(lista) {
    const grid = document.getElementById('memoriasGrid');
    if (!grid) return;

    grid.innerHTML = '';
    if (lista.length === 0) {
      grid.innerHTML = '<div class="output-panel">Nenhuma persona encontrada para o filtro informado.</div>';
      return;
    }

    const session = window.OlymposApp.getSession();
    const podeEditar = !session || !session.perfil || session.perfil.podeEditarMemorias !== false;

    lista.forEach(function(item) {
      const card = document.createElement('div');
      card.className = 'memoria-card';

      const iconSvg = window.OlymposIcons ? window.OlymposIcons.get(item.icone) : '';

      if (!item.isHostRouted) {
        const pct = Math.min(100, Math.round((item.linhas / 60) * 100));
        const alertaPreview = (item.alertas && item.alertas.length > 0)
          ? item.alertas.slice(0, 2).map(function(a) { return window.OlymposApp.escapeHtml(a.replace(/^-\s*/, '')); }).join('<br />')
          : 'Sem alertas pendentes na seção 2 desta memória.';

        card.innerHTML =
          '<div>' +
            '<div class="memoria-header">' +
              '<div class="persona-emblem" aria-hidden="true">' + iconSvg + '</div>' +
              '<div class="memoria-title-wrap">' +
                '<div class="memoria-name">' + window.OlymposApp.escapeHtml(item.nome) + '</div>' +
                '<div class="memoria-domain">' + window.OlymposApp.escapeHtml(item.dominio) + '</div>' +
              '</div>' +
              '<span class="pill-badge pill-gold">' + window.OlymposApp.escapeHtml(item.arquivo) + '</span>' +
            '</div>' +
            '<div class="memoria-alerts-preview" style="margin-top:12px;">' + alertaPreview + '</div>' +
          '</div>' +
          '<div>' +
            '<div class="memoria-meter-info">' +
              '<span>Ocupação Canônica</span>' +
              '<span class="' + (item.linhas > 52 ? 'meter-warning' : '') + '">' + item.linhas + ' / 60 linhas</span>' +
            '</div>' +
            '<div class="meter-track" style="margin-bottom:14px;">' +
              '<div class="meter-bar ' + (item.linhas > 52 ? 'meter-danger' : '') + '" style="width:' + pct + '%;"></div>' +
            '</div>' +
            '<div class="memoria-actions">' +
              (podeEditar ? '<button type="button" class="btn btn-secondary btn-sm btn-edit-md">Editar .md</button>' : '') +
              '<button type="button" class="btn btn-ghost btn-sm btn-copy-md">Copiar Contexto</button>' +
              (item.url ? '<a href="' + window.OlymposApp.escapeHtml(item.url) + '" target="_blank" rel="noopener" class="folder-chip" style="margin-left:auto;">Abrir no Drive ↗</a>' : '') +
            '</div>' +
          '</div>';

        const btnEdit = card.querySelector('.btn-edit-md');
        if (btnEdit) {
          btnEdit.addEventListener('click', function() {
            abrirEditor(item.arquivo);
          });
        }
        const btnCopy = card.querySelector('.btn-copy-md');
        if (btnCopy) {
          btnCopy.addEventListener('click', function() {
            copiarPersona(item.nome);
          });
        }
      } else {
        card.innerHTML =
          '<div>' +
            '<div class="memoria-header">' +
              '<div class="persona-emblem is-host-routed" aria-hidden="true">' + iconSvg + '</div>' +
              '<div class="memoria-title-wrap">' +
                '<div class="memoria-name">' + window.OlymposApp.escapeHtml(item.nome) + '</div>' +
                '<div class="memoria-domain">' + window.OlymposApp.escapeHtml(item.dominio) + '</div>' +
              '</div>' +
              '<span class="pill-badge pill-blue">Via ' + window.OlymposApp.escapeHtml(item.anfitriao) + '</span>' +
            '</div>' +
            '<div class="memoria-alerts-preview" style="margin-top:12px;">' +
              'Persona sem arquivo isolado (prevenção de fragmentação): registra despachos diretamente em <code>' + window.OlymposApp.escapeHtml(item.arquivo) + '</code>.' +
            '</div>' +
          '</div>' +
          '<div class="memoria-actions">' +
            '<button type="button" class="btn btn-secondary btn-sm btn-open-host">Inspecionar Memória de ' + window.OlymposApp.escapeHtml(item.anfitriao) + '</button>' +
          '</div>';

        const btnHost = card.querySelector('.btn-open-host');
        if (btnHost) {
          btnHost.addEventListener('click', function() {
            abrirEditor(item.arquivo);
          });
        }
      }

      grid.appendChild(card);
    });
  }

  function filtrarMemorias() {
    const input = document.getElementById('memoriaSearchInput');
    const termo = input ? input.value.toLowerCase().trim() : '';
    const todas = montarListaCompleta17();

    if (!termo) {
      renderizarGrade(todas);
      return;
    }

    renderizarGrade(todas.filter(function(item) {
      return item.nome.toLowerCase().includes(termo) ||
        item.dominio.toLowerCase().includes(termo) ||
        (item.arquivo && item.arquivo.toLowerCase().includes(termo)) ||
        (item.anfitriao && item.anfitriao.toLowerCase().includes(termo));
    }));
  }

  function handleEnviarAlertaRapido() {
    const arq = document.getElementById('quickAlertTargetSelect').value;
    const msg = document.getElementById('quickAlertMessageInput').value.trim();

    if (!msg) {
      window.OlymposApp.showToast('Digite o recado para o Correio do Olimpo.', true);
      return;
    }

    window.OlymposApi.chamar('registrar_recado_md', { arquivo_md: arq, linha: msg }, function(res) {
      if (res && res.ok) {
        window.OlymposApp.showToast('Recado gravado no arquivo existente ' + arq + '!');
        document.getElementById('quickAlertMessageInput').value = '';
        carregarMemorias();
      } else {
        window.OlymposApp.showToast((res && res.mensagem) || 'Falha ao gravar recado.', true);
      }
    });
  }

  function abrirEditor(arquivo) {
    let found = memorias.find(function(m) { return m.arquivo === arquivo; });
    if (!found && window.OLYMPOS_MEMORIAS_CATALOGO) {
      found = window.OLYMPOS_MEMORIAS_CATALOGO.obterPorArquivo(arquivo);
    }
    if (!found) {
      found = {
        deus: arquivo,
        nome: arquivo,
        arquivo: arquivo,
        conteudoCompleto: '# ' + arquivo + '\n'
      };
    }
    if (!found.conteudoCompleto && window.OLYMPOS_MEMORIAS_CATALOGO) {
      const cat = window.OLYMPOS_MEMORIAS_CATALOGO.obterPorArquivo(found.arquivo || arquivo);
      if (cat && cat.conteudoCompleto) {
        found.conteudoCompleto = cat.conteudoCompleto;
      }
    }
    window.OlymposApp.abrirModalMemoria(found);
  }

  function copiarPersona(nomeDeus) {
    let found = memorias.find(function(m) { return m.deus === nomeDeus || m.nome === nomeDeus; });
    if (!found && window.OLYMPOS_MEMORIAS_CATALOGO) {
      found = window.OLYMPOS_MEMORIAS_CATALOGO.obterPorNome(nomeDeus);
    }
    if (!found) return;
    const nome = found.deus || found.nome;
    const ctx = '### Persona: ' + nome + ' (' + found.arquivo + ')\n' +
      'Domínio: ' + (found.dominio || '') + '\n' +
      'Conteúdo Operacional:\n' + (found.conteudoCompleto || '') + '\n';
    window.OlymposApp.copiarTexto(ctx, 'Contexto de ' + nome);
  }

  function copiarContextoCompletoGemini() {
    let ctx = '# Contexto Consolidado das Memórias Operacionais (Hub Olympos SMEB 2026)\n\n';
    const lista = (memorias && memorias.length) ? memorias : (window.OLYMPOS_MEMORIAS_CATALOGO ? window.OLYMPOS_MEMORIAS_CATALOGO.listarTodas() : []);
    lista.forEach(function(m) {
      ctx += '## ' + (m.deus || m.nome) + ' (' + m.arquivo + ')\n';
      ctx += 'Domínio: ' + (m.dominio || '') + ' | Linhas: ' + (m.totalLinhas || (m.conteudoCompleto ? m.conteudoCompleto.split('\n').length : 0)) + '/60\n';
      if (m.conteudoCompleto) ctx += m.conteudoCompleto + '\n\n';
    });
    window.OlymposApp.copiarTexto(ctx, 'Contexto consolidado das 11 memórias');
  }

  return {
    init: init,
    abrirEditor: abrirEditor,
    copiarPersona: copiarPersona,
    recarregar: carregarMemorias
  };
})();

/**
 * Hub Olympos V2.1 — Página Modular 9: Busca Global Recursiva Multi-Ano (2025–2026)
 */
window.OlymposViews = window.OlymposViews || {};

window.OlymposViews.busca = (function() {
  function init() {
    bindEvents();
  }

  function bindEvents() {
    const btnBuscar = document.getElementById('pageBuscaExecBtn');
    if (btnBuscar && !btnBuscar._bound) {
      btnBuscar._bound = true;
      btnBuscar.addEventListener('click', executarBusca);
    }

    const inSearch = document.getElementById('pageBuscaInput');
    if (inSearch && !inSearch._bound) {
      inSearch._bound = true;
      inSearch.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') executarBusca();
      });
    }

    document.querySelectorAll('[data-quick-query]').forEach(function(chip) {
      if (!chip._bound) {
        chip._bound = true;
        chip.addEventListener('click', function() {
          const q = chip.getAttribute('data-quick-query');
          dispararComTermo(q);
        });
      }
    });
  }

  function executarBusca() {
    const termo = document.getElementById('pageBuscaInput').value.trim();
    const ano = document.getElementById('pageBuscaAnoSelect').value;
    const btn = document.getElementById('pageBuscaExecBtn');
    const tbody = document.getElementById('pageBuscaTableBody');
    const statusMsg = document.getElementById('pageBuscaStatusMsg');

    if (!termo || (termo !== '*' && termo.length < 2)) {
      window.OlymposApp.showToast('Informe ao menos 2 caracteres (ou * para listar recentes).', true);
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Varrendo Drive...';
    tbody.innerHTML = '<tr><td colspan="5" class="text-muted text-center" style="padding: 28px;">Inspecionando pastas setoriais e subpastas recursivamente...</td></tr>';
    statusMsg.textContent = 'Consultando acervos oficiais (' + ano + ')...';

    const t0 = performance.now();
    window.OlymposApi.chamar('pesquisarAcervoGlobalMultiAno', { termo: termo, filtroAno: ano }, function(res) {
      btn.disabled = false;
      btn.textContent = 'Pesquisar Acervo';
      const elapsed = Math.round(performance.now() - t0);

      if (!res || !res.ok) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-danger text-center" style="padding: 24px;">' + window.OlymposApp.escapeHtml((res && res.mensagem) || 'Falha na pesquisa.') + '</td></tr>';
        statusMsg.textContent = 'Não foi possível concluir a busca.';
        return;
      }

      const resultados = res.resultados || [];
      statusMsg.textContent = resultados.length + ' arquivo(s) localizado(s) para "' + termo + '" em ' + elapsed + ' ms.';

      if (resultados.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-muted text-center" style="padding: 28px;">Nenhum documento encontrado para os termos informados.</td></tr>';
        return;
      }

      tbody.innerHTML = '';
      resultados.forEach(function(item) {
        const tr = document.createElement('tr');
        const dt = item.dataCriacao || item.dataModificacao || '--';
        const url = item.url || '';

        tr.innerHTML =
          '<td><span class="pill-badge ' + (item.ano === '2026' ? 'pill-green' : 'pill-blue') + '">' + window.OlymposApp.escapeHtml(item.ano || '2026') + '</span></td>' +
          '<td style="font-size:12.5px; font-weight:600; color:var(--text-secondary);">' + window.OlymposApp.escapeHtml(item.setor || '') + '</td>' +
          '<td style="font-family:var(--font-mono); font-size:12px; color:var(--text-muted);">' + window.OlymposApp.escapeHtml(dt) + '</td>' +
          '<td style="font-weight:600; color:var(--text-main);">' + window.OlymposApp.escapeHtml(item.nome || '') + '</td>' +
          '<td class="text-right">' +
            '<div class="button-group" style="justify-content:flex-end;">' +
              (url ? '<button type="button" class="btn btn-ghost btn-sm btn-copy-search-url">Copiar</button>' : '') +
              (url ? '<a href="' + window.OlymposApp.escapeHtml(url) + '" target="_blank" rel="noopener" class="btn btn-primary btn-sm">Abrir ↗</a>' : '') +
            '</div>' +
          '</td>';

        const copyBtn = tr.querySelector('.btn-copy-search-url');
        if (copyBtn && url) {
          copyBtn.addEventListener('click', function() {
            window.OlymposApp.copiarTexto(url, 'Link de ' + (item.nome || 'documento'));
          });
        }

        tbody.appendChild(tr);
      });
    }, function(err) {
      btn.disabled = false;
      btn.textContent = 'Pesquisar Acervo';
      tbody.innerHTML = '<tr><td colspan="5" class="text-danger text-center" style="padding: 24px;">Erro: ' + window.OlymposApp.escapeHtml(err.message) + '</td></tr>';
      statusMsg.textContent = 'Falha na comunicação com o motor de busca.';
    });
  }

  function dispararComTermo(termo) {
    const inSearch = document.getElementById('pageBuscaInput');
    if (inSearch) inSearch.value = termo;
    executarBusca();
  }

  return {
    init: init,
    dispararComTermo: dispararComTermo
  };
})();

/**
 * Hub Olympos V2.1 — Página Modular 10: Configurações, Gateway Dual-Front & Preferências
 */
window.OlymposViews = window.OlymposViews || {};

window.OlymposViews.configuracoes = (function() {
  function init() {
    bindEvents();
    carregarValoresAtuais();
  }

  function bindEvents() {
    const bind = function(id, evt, fn) {
      const el = document.getElementById(id);
      if (el && !el._bound) {
        el._bound = true;
        el.addEventListener(evt, fn);
      }
    };

    bind('configSalvarApiBtn', 'click', salvarUrlApi);
    bind('configTestarApiBtn', 'click', testarConexaoApi);
    bind('configResetApiBtn', 'click', function() {
      window.OlymposApi.setApiUrl(window.OlymposApi.DEFAULT_API_URL);
      carregarValoresAtuais();
      window.OlymposApp.showToast('Endpoint restaurado para a implantação oficial do Hub!');
    });
    bind('configLogoutBtn', 'click', function() {
      window.OlymposApp.fazerLogout();
    });
    bind('configTemaSelect', 'change', function(e) {
      window.OlymposApp.definirTema(e.target.value);
    });
  }

  function carregarValoresAtuais() {
    const inUrl = document.getElementById('configGasUrlInput');
    if (inUrl) inUrl.value = window.OlymposApi.getApiUrl();

    const selTema = document.getElementById('configTemaSelect');
    if (selTema) selTema.value = document.documentElement.getAttribute('data-theme') || 'light';

    const session = window.OlymposApp.getSession();
    const userLabel = document.getElementById('configUserLabel');
    const userRole = document.getElementById('configUserRole');
    const userTabs = document.getElementById('configUserTabs');

    if (session && session.perfil) {
      if (userLabel) userLabel.textContent = session.nome || session.usuario;
      if (userRole) userRole.textContent = session.perfil.nome;
      if (userTabs) userTabs.textContent = (session.perfil.abasPermitidas || []).join(', ');
    }
  }

  function salvarUrlApi() {
    const val = document.getElementById('configGasUrlInput').value.trim();
    try {
      window.OlymposApi.setApiUrl(val);
      window.OlymposApp.showToast('URL do Gateway Google Apps Script salva!');
      testarConexaoApi();
    } catch (e) {
      window.OlymposApp.showToast(e.message, true);
    }
  }

  function testarConexaoApi() {
    const btn = document.getElementById('configTestarApiBtn');
    const resBox = document.getElementById('configTestResult');

    btn.disabled = true;
    btn.textContent = 'Verificando...';
    resBox.innerHTML = 'Medindo latência com o Gateway Google Apps Script...';

    window.OlymposApi.testarConexao(function(res) {
      btn.disabled = false;
      btn.textContent = 'Testar Latência';

      if (res.ok) {
        resBox.innerHTML =
          '<div style="color:var(--success); font-weight:700;">Gateway Conectado com Sucesso</div>' +
          '<div style="margin-top:4px; font-family:var(--font-mono); font-size:11.5px;">' +
            'Latência: ' + res.latency + ' ms • Sistema: ' + window.OlymposApp.escapeHtml((res.data && res.data.sistema) || 'Hub Olympos') +
            ' • Versão: ' + window.OlymposApp.escapeHtml((res.data && res.data.versao) || '2.1.0') +
          '</div>';
        window.OlymposApp.atualizarStatusConexao(true);
      } else {
        resBox.innerHTML =
          '<div style="color:var(--danger); font-weight:700;">Falha de Conectividade</div>' +
          '<div style="margin-top:4px; font-size:12px;">' + window.OlymposApp.escapeHtml(res.error || 'Verifique a URL /exec.') + '</div>';
        window.OlymposApp.atualizarStatusConexao(false);
      }
    });
  }

  return {
    init: init
  };
})();

/**
 * Hub Olympos V2.1 — Controlador Central da Aplicação Modular
 * Estética Editorial (Google DeepMind + The Keyword), RBAC, Tema 60-30-10 e Modais.
 */
window.OlymposApp = (function() {
  let currentUserSession = null;
  let activeMemoriaEditando = null;

  const LEGACY_TAB_MAP = {
    'tab-apolo': ['visao-geral', 'oficios', 'personas', 'busca'],
    'tab-pincel': ['portarias', 'oficios'],
    'tab-licencas': ['licencas'],
    'tab-lira': ['certificados'],
    'tab-prometheus': ['diario-oficial', 'papiro-cadmo']
  };

  document.addEventListener('DOMContentLoaded', function() {
    hydrateVectorIcons();
    initTheme();
    initSession();
    bindGlobalElements();
    window.OlymposRouter.init();
    verificarStatusConexaoInicial();
  });

  function hydrateVectorIcons() {
    if (!window.OlymposIcons) return;
    const setHtml = function(id, svg) {
      const el = document.getElementById(id);
      if (el) el.innerHTML = svg;
    };

    setHtml('brandMarkSvg', window.OlymposIcons.ui('olymposMark'));
    setHtml('topQuickSearchBtn', window.OlymposIcons.ui('search'));
    setHtml('mobileMenuToggleBtn', window.OlymposIcons.ui('menu'));
    setHtml('closeModalBtn', window.OlymposIcons.ui('close'));
    setHtml('closeContadoresModalBtn', window.OlymposIcons.ui('close'));
    setHtml('pincelDoneCheckSvg', window.OlymposIcons.ui('check'));

    document.querySelectorAll('[data-persona-icon]').forEach(function(badge) {
      const key = badge.getAttribute('data-persona-icon');
      badge.innerHTML = window.OlymposIcons.get(key);
    });
  }

  // =========================================================================
  // TEMA 60-30-10 (MODO CLARO & MODO ESCURO DEEPMIND MIDNIGHT)
  // =========================================================================
  function initTheme() {
    const saved = localStorage.getItem('olympos_theme') ||
      (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    definirTema(saved);
  }

  function definirTema(theme) {
    const target = theme === 'dark' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', target);
    localStorage.setItem('olympos_theme', target);

    const btn = document.getElementById('themeToggleBtn');
    if (btn && window.OlymposIcons) {
      btn.innerHTML = target === 'dark'
        ? window.OlymposIcons.ui('sunMode')
        : window.OlymposIcons.ui('moonMode');
    }

    const sel = document.getElementById('configTemaSelect');
    if (sel) sel.value = target;
  }

  function alternarTema() {
    const current = document.documentElement.getAttribute('data-theme') || 'light';
    definirTema(current === 'dark' ? 'light' : 'dark');
  }

  // =========================================================================
  // AUTENTICAÇÃO E CONTROLE DE ACESSO RBAC
  // =========================================================================
  function initSession() {
    // 1. Tenta sessionStorage (memória da aba ativa para carregamento veloz)
    try {
      const cachedRbac = sessionStorage.getItem('olympos_session_rbac');
      if (cachedRbac) {
        const sessionObj = JSON.parse(cachedRbac);
        if (sessionObj && sessionObj.perfil) {
          currentUserSession = sessionObj;
          aplicarSessaoNaInterface(currentUserSession);
          return;
        }
      }
    } catch (e) {
      sessionStorage.removeItem('olympos_session_rbac');
    }

    // 2. Fallback resiliente para localStorage
    const stored = localStorage.getItem('olympos_session');
    if (stored) {
      try {
        currentUserSession = JSON.parse(stored);
        try {
          sessionStorage.setItem('olympos_session_rbac', JSON.stringify(currentUserSession));
          if (currentUserSession.perfil) {
            sessionStorage.setItem('olympos_rbac_profile_cache', JSON.stringify(currentUserSession.perfil));
          }
        } catch (eStore) {}
        aplicarSessaoNaInterface(currentUserSession);
      } catch (e) {
        localStorage.removeItem('olympos_session');
        solicitarLogin();
      }
    } else {
      solicitarLogin();
    }
  }

  function solicitarLogin() {
    const modal = document.getElementById('loginScreen');
    if (modal) modal.classList.remove('hidden');
  }

  const RBAC_TAB_PERMISSIONS = {
    ADMIN_GABINETE: [
      'visao-geral', 'oficios', 'portarias', 'licencas', 'certificados',
      'diario-oficial', 'papiro-cadmo', 'personas', 'busca', 'configuracoes'
    ],
    RH_COMISSAO: [
      'visao-geral', 'oficios', 'portarias', 'licencas',
      'diario-oficial', 'papiro-cadmo', 'personas', 'busca', 'configuracoes'
    ],
    PEDAGOGICO_EVENTOS: [
      'visao-geral', 'oficios', 'certificados', 'personas', 'busca', 'configuracoes'
    ],
    JURIDICO: [
      'visao-geral', 'oficios', 'portarias', 'diario-oficial',
      'papiro-cadmo', 'personas', 'busca', 'configuracoes'
    ]
  };

  async function handleLoginSubmit() {
    const userInputEl = document.getElementById('loginUserInput') || document.getElementById('loginEmail');
    const passInputEl = document.getElementById('loginPasswordInput') || document.getElementById('loginSenha');
    const userInput = userInputEl ? userInputEl.value.trim() : '';
    const passInput = passInputEl ? passInputEl.value.trim() : '';
    const btn = document.getElementById('loginSubmitBtn');

    if (!userInput || !passInput) {
      showToast('Informe identificador/e-mail e senha de acesso.', true);
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Validando credenciais...';

    // 1. Autenticação primária via Supabase Auth
    if (window.OlymposSupabase && window.OlymposSupabase.isConfigured()) {
      try {
        const authResult = await window.OlymposSupabase.login(userInput, passInput);
        btn.disabled = false;
        btn.textContent = 'Acessar Ambiente Olympos';

        const profile = authResult.profile || {};
        const role = profile.role || 'RH_COMISSAO';
        const abas = RBAC_TAB_PERMISSIONS[role] || RBAC_TAB_PERMISSIONS.RH_COMISSAO;

        currentUserSession = {
          ok: true,
          token: authResult.session.access_token,
          access_token: authResult.session.access_token,
          usuario: authResult.user.email,
          nome: profile.full_name || authResult.user.email,
          perfil: {
            id: role,
            nome: role,
            abasPermitidas: abas
          }
        };

        localStorage.setItem('olympos_session', JSON.stringify(currentUserSession));
        try {
          sessionStorage.setItem('olympos_session_rbac', JSON.stringify(currentUserSession));
          sessionStorage.setItem('olympos_rbac_profile_cache', JSON.stringify(profile));
        } catch (eStore) {}
        document.getElementById('loginScreen').classList.add('hidden');
        aplicarSessaoNaInterface(currentUserSession);
        showToast('Bem-vindo(a), ' + (profile.full_name || authResult.user.email) + '!');

        if (window.OlymposViews && window.OlymposViews.visaoGeral) {
          window.OlymposViews.visaoGeral.recarregar();
        }
        window.OlymposRouter.navegarPara(window.OlymposRouter.getPaginaAtual(), true);
        return;
      } catch (err) {
        console.warn('[handleLoginSubmit] Falha no Supabase Auth:', err);
        if (err.message && (err.message.includes('Invalid login') || err.message.includes('credentials'))) {
          btn.disabled = false;
          btn.textContent = 'Acessar Ambiente Olympos';
          showToast('Credenciais inválidas no Supabase Auth. Verifique e-mail e senha.', true);
          return;
        }
      }
    }

    // 2. Fallback via backend GAS (se configurado ou em contingência)
    window.OlymposApi.chamar('auth_login', { usuario: userInput, senha: passInput }, function(res) {
      btn.disabled = false;
      btn.textContent = 'Acessar Ambiente Olympos';

      if (res && res.ok) {
        currentUserSession = res;
        localStorage.setItem('olympos_session', JSON.stringify(res));
        try {
          sessionStorage.setItem('olympos_session_rbac', JSON.stringify(res));
          if (res.perfil) {
            sessionStorage.setItem('olympos_rbac_profile_cache', JSON.stringify(res.perfil));
          }
        } catch (eStore) {}
        document.getElementById('loginScreen').classList.add('hidden');
        aplicarSessaoNaInterface(res);
        showToast(res.mensagem || 'Acesso autenticado com sucesso!');

        if (window.OlymposViews && window.OlymposViews.visaoGeral) {
          window.OlymposViews.visaoGeral.recarregar();
        }
        window.OlymposRouter.navegarPara(window.OlymposRouter.getPaginaAtual(), true);
      } else {
        showToast((res && res.mensagem) || 'Credenciais inválidas. Configure o Supabase no botão abaixo.', true);
      }
    }, function(err) {
      btn.disabled = false;
      btn.textContent = 'Acessar Ambiente Olympos';
      showToast('Falha de comunicação ao autenticar: ' + err.message, true);
    });
  }

  function normalizarPermissoesRbac(listaBruta) {
    const set = new Set(['visao-geral', 'configuracoes', 'personas', 'busca']);
    (listaBruta || []).forEach(function(item) {
      if (LEGACY_TAB_MAP[item]) {
        LEGACY_TAB_MAP[item].forEach(function(p) { set.add(p); });
      } else {
        set.add(item);
      }
    });
    return Array.from(set);
  }

  function aplicarSessaoNaInterface(sessao) {
    if (!sessao || !sessao.perfil) return;

    const nomeExibicao = sessao.nome || sessao.usuario || 'Gabinete';
    const userBadgeName = document.getElementById('userBadgeName');
    const userBadgeRole = document.getElementById('userBadgeRole');
    const avatarInitials = document.getElementById('userAvatarInitials');

    if (userBadgeName) userBadgeName.textContent = nomeExibicao;
    if (userBadgeRole) userBadgeRole.textContent = sessao.perfil.nome || 'Autenticado';
    if (avatarInitials) {
      const partes = nomeExibicao.split(/\s+/).filter(Boolean);
      const iniciais = partes.length >= 2
        ? (partes[0][0] + partes[1][0]).toUpperCase()
        : nomeExibicao.substring(0, 2).toUpperCase();
      avatarInitials.textContent = iniciais;
    }

    const permitidas = normalizarPermissoesRbac(sessao.perfil.abasPermitidas);
    document.querySelectorAll('.nav-link').forEach(function(link) {
      const pageTarget = link.getAttribute('data-page');
      if (permitidas.includes(pageTarget) || permitidas.includes('TODOS')) {
        link.classList.remove('hidden');
      } else {
        link.classList.add('hidden');
      }
    });

    // Controle de Visibilidade RBAC para Moderador (ADMIN_GABINETE)
    const isAdmin = Boolean(sessao.perfil && (sessao.perfil.id === 'ADMIN_GABINETE' || sessao.perfil.nome === 'ADMIN_GABINETE'));
    const blocoGestao = document.getElementById('blocoGestaoUsuarios');
    if (blocoGestao) {
      if (isAdmin) {
        blocoGestao.classList.remove('hidden');
      } else {
        blocoGestao.classList.add('hidden');
      }
    }
    const topNovoUsuarioBtn = document.getElementById('topNovoUsuarioBtn');
    if (topNovoUsuarioBtn) {
      if (isAdmin) {
        topNovoUsuarioBtn.classList.remove('hidden');
      } else {
        topNovoUsuarioBtn.classList.add('hidden');
      }
    }
  }

  function abrirJanelaGeminiCompanion() {
    const width = 520;
    const height = 780;
    const availWidth = (window.screen && window.screen.availWidth) ? window.screen.availWidth : window.innerWidth;
    const availHeight = (window.screen && window.screen.availHeight) ? window.screen.availHeight : window.innerHeight;

    // Posicionamento ergonômico no quadrante direito da tela
    const left = Math.max(0, availWidth - 540);
    const top = Math.max(20, Math.round((availHeight - height) / 2));

    const windowFeatures = [
      'width=' + width,
      'height=' + height,
      'left=' + left,
      'top=' + top,
      'resizable=yes',
      'scrollbars=yes',
      'status=no',
      'toolbar=no',
      'menubar=no',
      'location=yes'
    ].join(',');

    const geminiWin = window.open('https://gemini.google.com/', 'GeminiOlympos', windowFeatures);
    if (geminiWin && !geminiWin.closed) {
      geminiWin.focus();
    }
  }

  function renderSkeletonTable(tbodyElement, rows = 4, cols = 4, colWidths = ['15%', '25%', '45%', '15%']) {
    if (!tbodyElement) return;
    tbodyElement.innerHTML = '';
    for (let r = 0; r < rows; r++) {
      const tr = document.createElement('tr');
      tr.className = 'skeleton-table-row skeleton-row';
      for (let c = 0; c < cols; c++) {
        const td = document.createElement('td');
        td.className = 'skeleton-cell';
        const w = colWidths[c % colWidths.length] || '100%';
        td.innerHTML = '<span class="skeleton-shimmer" style="max-width: ' + w + ';"></span>';
        tr.appendChild(td);
      }
      tbodyElement.appendChild(tr);
    }
  }

  function carregarConfiguracaoBoletimEmails() {
    const salvo = localStorage.getItem('olympos_boletim_emails') || '';
    const inCfg = document.getElementById('configBoletimEmailInput');
    const inDiario = document.getElementById('diarioBoletimEmailInput');
    if (inCfg && !inCfg.value) inCfg.value = salvo;
    if (inDiario && !inDiario.value) inDiario.value = salvo;

    if (window.OlymposApi && typeof window.OlymposApi.chamar === 'function') {
      window.OlymposApi.chamar('prometheus_get_config', {}, function(res) {
        if (res && res.destinatarios) {
          localStorage.setItem('olympos_boletim_emails', res.destinatarios);
          if (inCfg) inCfg.value = res.destinatarios;
          if (inDiario) inDiario.value = res.destinatarios;
        }

  function salvarBoletimEmails(emails) {
    const clean = String(emails || '').trim();
    localStorage.setItem('olympos_boletim_emails', clean);
    const inCfg = document.getElementById('configBoletimEmailInput');
    const inDiario = document.getElementById('diarioBoletimEmailInput');
    if (inCfg) inCfg.value = clean;
    if (inDiario) inDiario.value = clean;

    const fbCfg = document.getElementById('configBoletimEmailFeedback');
    const fbDiario = document.getElementById('diarioBoletimEmailFeedback');
    if (fbCfg) {
      fbCfg.textContent = 'Gravando destinatários...';
      fbCfg.style.display = 'block';
    }
    if (fbDiario) {
      fbDiario.textContent = 'Gravando destinatários...';
      fbDiario.style.display = 'block';
    }

    if (window.OlymposApi && typeof window.OlymposApi.chamar === 'function') {
      window.OlymposApi.chamar('prometheus_config_emails', { destinatarios: clean }, function(res) {
        const msg = (res && res.mensagem) || 'Destinatários do boletim gravados com sucesso!';
        if (fbCfg) fbCfg.textContent = '✅ ' + msg;
        if (fbDiario) fbDiario.textContent = '✅ ' + msg;
        showToast(msg);
      }, function(err) {
        if (fbCfg) fbCfg.textContent = '⚠️ Salvo localmente no navegador (pendente sync com servidor).';
        if (fbDiario) fbDiario.textContent = '⚠️ Salvo localmente no navegador.';
        showToast('Destinatários salvos localmente.');
      });
    } else {
      showToast('Destinatários gravados no armazenamento local.');
    }

      link.addEventListener('click', function(e) {

        document.body.classList.remove('nav-drawer-open');
        window.OlymposRouter.navegarPara(page);
      });
    });

    document.querySelectorAll('[data-nav-target]').forEach(function(el) {
      el.addEventListener('click', function() {
        const target = el.getAttribute('data-nav-target');
        document.body.classList.remove('nav-drawer-open');
        if (target) window.OlymposRouter.navegarPara(target);
      });
    });

    const inTopSearch = document.getElementById('topQuickSearchInput');
    const btnTopSearch = document.getElementById('topQuickSearchBtn');
    if (btnTopSearch && inTopSearch) {
      const exec = function() {
        const val = inTopSearch.value.trim();
        if (val) {
          window.OlymposRouter.navegarPara('busca');
          if (window.OlymposViews && window.OlymposViews.busca) {
            window.OlymposViews.busca.dispararComTermo(val);
          }
        }
      };
      btnTopSearch.addEventListener('click', exec);
      inTopSearch.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') exec();
      });
    }

    // Atalho "/" estilo Google DeepMind para focar a busca rápida
    document.addEventListener('keydown', function(e) {
      if (e.key === '/' && inTopSearch) {
        const tag = (document.activeElement && document.activeElement.tagName) || '';
        if (tag !== 'INPUT' && tag !== 'TEXTAREA' && tag !== 'SELECT') {
          e.preventDefault();
          inTopSearch.focus();
        }

    const closeMem = document.getElementById('closeModalBtn');
    if (closeMem) {
      closeMem.addEventListener('click', function() {
        document.getElementById('memoriaModal').classList.add('hidden');
      });

    const closeCont = document.getElementById('closeContadoresModalBtn');
    if (closeCont) {
      closeCont.addEventListener('click', function() {
        document.getElementById('contadoresModal').classList.add('hidden');
      });
    }

    const btnSaveCont = document.getElementById('saveContadoresMdBtn');
    if (btnSaveCont) btnSaveCont.addEventListener('click', salvarContadoresMd);

    const btnSaveMem = document.getElementById('saveMemoriaBtn');
    if (btnSaveMem) btnSaveMem.addEventListener('click', salvarMemoriaMd);

    // Modal de Cadastro de Novo Usuário (Exclusivo ADMIN_GABINETE)
    const btnOpenNovoUser = document.getElementById('btnAbrirModalNovoUsuario');
    if (btnOpenNovoUser) btnOpenNovoUser.addEventListener('click', abrirModalNovoUsuario);

    const btnTopNovoUser = document.getElementById('topNovoUsuarioBtn');
    if (btnTopNovoUser) btnTopNovoUser.addEventListener('click', abrirModalNovoUsuario);

    const btnCloseNovoUser = document.getElementById('closeModalNovoUsuarioBtn');
    if (btnCloseNovoUser) btnCloseNovoUser.addEventListener('click', fecharModalNovoUsuario);

    const btnCancelNovoUser = document.getElementById('btnCancelarNovoUsuario');

    const btnGenPass = document.getElementById('btnGerarSenhaNovoUsuario');
    if (btnGenPass) btnGenPass.addEventListener('click', gerarSenhaParaFormularioNovoUsuario);

    const btnTogglePass = document.getElementById('btnToggleVisibilidadeSenha');
    if (btnTogglePass) btnTogglePass.addEventListener('click', toggleVisibilidadeSenhaNovoUsuario);

    const formNovoUser = document.getElementById('formNovoUsuario');
    if (formNovoUser) {
      formNovoUser.addEventListener('submit', function(e) {
        e.preventDefault();
        handleNovoUsuarioSubmit(e);
      });
    }

    // Configuração de Destinatários do Boletim (Ajustes e Diário Oficial)
    const btnSalvarCfgEmail = document.getElementById('configSalvarBoletimEmailBtn');
    if (btnSalvarCfgEmail) {
      btnSalvarCfgEmail.addEventListener('click', function() {
        const inCfg = document.getElementById('configBoletimEmailInput');
        salvarBoletimEmails(inCfg ? inCfg.value : '');

    const btnTestarCfgEmail = document.getElementById('configTestarBoletimEmailBtn');

    const btnSalvarDiarioEmail = document.getElementById('diarioSalvarBoletimEmailBtn');
    if (btnSalvarDiarioEmail) {
      btnSalvarDiarioEmail.addEventListener('click', function() {
        const inDiario = document.getElementById('diarioBoletimEmailInput');
        salvarBoletimEmails(inDiario ? inDiario.value : '');
      });
    }

    carregarConfiguracaoBoletimEmails();
  }

        proximaPortaria2026: parseInt(ptVal, 10),
        signatarioTitular: sigVal
      },
      motivo: motVal
    }, function(res) {

      btn.textContent = 'Gravar Numeração';

  function abrirModalMemoria(memoriaObj) {
    activeMemoriaEditando = memoriaObj;
    const nome = memoriaObj.deus || memoriaObj.nome || memoriaObj.arquivo;
    document.getElementById('modalMemoriaTitle').textContent = nome + ' — ' + memoriaObj.arquivo;
    const ta = document.getElementById('modalMemoriaTextarea');

    // Recupera conteúdo com preferência para edições locais salvas no catálogo
    let conteudo = memoriaObj.conteudoCompleto || '';
    if (window.OLYMPOS_MEMORIAS_CATALOGO) {
      const local = window.OLYMPOS_MEMORIAS_CATALOGO.obterConteudoLocal(memoriaObj.arquivo);
      if (local !== null && local !== undefined) {
        conteudo = local;
      }
    }
    ta.value = conteudo;

    const atualizarContadorLinhas = function() {
      const l = ta.value.split('\n').length;
      const counter = document.getElementById('modalLineCounter');
      counter.textContent = l + ' / 60 linhas';
      counter.className = 'pill-badge ' + (l > 55 ? 'pill-red' : 'pill-gold');
    };

    atualizarContadorLinhas();
    ta.oninput = atualizarContadorLinhas;
    document.getElementById('memoriaModal').classList.remove('hidden');
  }

  function salvarMemoriaMd() {
    if (!activeMemoriaEditando) return;
    const novoConteudo = document.getElementById('modalMemoriaTextarea').value;
    const arq = activeMemoriaEditando.arquivo;
    const btn = document.getElementById('saveMemoriaBtn');

    // 1. Persistência local imediata no browser (localStorage e in-memory)
    if (window.OLYMPOS_MEMORIAS_CATALOGO) {
      window.OLYMPOS_MEMORIAS_CATALOGO.salvarLocal(arq, novoConteudo);
    }
    activeMemoriaEditando.conteudoCompleto = novoConteudo;

    btn.disabled = true;
    btn.textContent = 'Sincronizando no Drive...';

    // 2. Sincronização remota via Gateway GAS (CORS Simple Request)
    window.OlymposApi.salvarMemoria(arq, novoConteudo, function(res) {
      btn.disabled = false;
      btn.textContent = 'Salvar no Arquivo Existente';

      if (res && res.ok) {
        if (window.OLYMPOS_MEMORIAS_CATALOGO) {
          window.OLYMPOS_MEMORIAS_CATALOGO.removerEdicaoLocal(arq);
        }
        showToast('Memória ' + arq + ' sincronizada com sucesso no Google Drive!');
        document.getElementById('memoriaModal').classList.add('hidden');
        if (window.OlymposViews && window.OlymposViews.personas) {
          window.OlymposViews.personas.recarregar();
        }
        if (window.OlymposViews && window.OlymposViews.visaoGeral) {
          window.OlymposViews.visaoGeral.recarregar();
        }
      } else {
        showToast('Salvo localmente no navegador! Sincronização com o Drive pendente (' + ((res && res.mensagem) || 'offline') + ').', false);
        document.getElementById('memoriaModal').classList.add('hidden');
        if (window.OlymposViews && window.OlymposViews.personas) {
          window.OlymposViews.personas.recarregar();
        }
      }
    }, function() {
      btn.disabled = false;
      btn.textContent = 'Salvar no Arquivo Existente';
      // Modo offline: salvo com sucesso no localStorage, não trava nem perde a edição
      showToast('Salvo localmente no navegador! Sincronização com o Drive ocorrerá quando o Gateway estiver online.', false);
      document.getElementById('memoriaModal').classList.add('hidden');
      if (window.OlymposViews && window.OlymposViews.personas) {
        window.OlymposViews.personas.recarregar();
      }
    });
  }

  function copiarTexto(texto, rotulo) {

    navigator.clipboard.writeText(texto).then(function() {
      showToast((rotulo || 'Link') + ' copiado para a área de transferência!');
    });
  }

  function copiarKpi(elemId, rotulo) {
    const el = document.getElementById(elemId);
    if (!el) return;
    copiarTexto(el.textContent.trim(), rotulo);
  }

  function renderizarItensLinksGerados(listContainer, arquivos) {
    if (!listContainer) return;
    listContainer.innerHTML = '';

    if (!arquivos || arquivos.length === 0) {
      listContainer.innerHTML = '<div style="font-size:12.5px; color:var(--text-muted);">Processamento concluído. Consulte a pasta oficial para visualizar os documentos anteriores.</div>';
      return;
    }

    arquivos.forEach(function(arq) {
      const row = document.createElement('div');
      row.className = 'job-link-item';

      const titulo = arq.titulo || (arq.portaria ? 'Portaria Nº ' + arq.portaria + '/2026' : (arq.identificador || arq.nome || 'Documento Gerado'));
      const subtituloPartes = [];
      if (arq.identificador && titulo !== arq.identificador) subtituloPartes.push(arq.identificador);
      if (arq.matricula) subtituloPartes.push('Mat. ' + arq.matricula);
      if (arq.detalhe) subtituloPartes.push(arq.detalhe);
      if (arq.hash) subtituloPartes.push('Hash ' + arq.hash);

      const url = arq.url || arq.urlPdf || arq.urlArquivo || '';

      row.innerHTML =
        '<div class="job-link-info">' +
          '<span class="job-link-name">' + escapeHtml(titulo) + '</span>' +
          (subtituloPartes.length ? '<span class="job-link-meta">' + escapeHtml(subtituloPartes.join(' • ')) + '</span>' : '') +
        '</div>' +
        '<div class="button-group">' +
          (url ? '<button type="button" class="btn btn-secondary btn-sm btn-copy-single">Copiar Link</button>' : '') +
          (url ? '<a href="' + escapeHtml(url) + '" target="_blank" rel="noopener" class="btn btn-primary btn-sm">Abrir Arquivo ↗</a>' : '') +
        '</div>';

      const copyBtn = row.querySelector('.btn-copy-single');
      if (copyBtn && url) {
        copyBtn.addEventListener('click', function() {
          copiarTexto(url, 'Link de ' + titulo);
        });
      }

      listContainer.appendChild(row);
    });
  }

  function showToast(msg, isError) {
    const t = document.getElementById('globalToast');
    if (!t) return;
    t.textContent = msg;
    t.classList.toggle('error', Boolean(isError));
    t.classList.remove('hidden');
    clearTimeout(t._timer);
    t._timer = setTimeout(function() {
      t.classList.add('hidden');
    }, 4200);
  }

  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // =========================================================================
  // GESTÃO DE USUÁRIOS E MODAL NOVO USUÁRIO (EXCLUSIVO ADMIN_GABINETE)
  // =========================================================================
  function abrirModalNovoUsuario() {
    const sessao = currentUserSession;
    const role = sessao && sessao.perfil && (sessao.perfil.id || sessao.perfil.nome);
    if (role !== 'ADMIN_GABINETE') {
      showToast('Acesso restrito ao Moderador do Gabinete (ADMIN_GABINETE).', true);
      return;
    }
    const modal = document.getElementById('modalNovoUsuario');
    if (modal) {
      modal.classList.remove('hidden');
      const inNome = document.getElementById('novoUsuarioNome');
      if (inNome) inNome.focus();
    }
  }

  function fecharModalNovoUsuario() {
    const modal = document.getElementById('modalNovoUsuario');
    if (modal) modal.classList.add('hidden');
    const feedback = document.getElementById('novoUsuarioFeedback');
    if (feedback) {
      feedback.classList.add('hidden');
      feedback.innerHTML = '';
    }
  }

  function gerarSenhaSeguraAleatoria() {
    const maiusculas = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
    const minusculas = 'abcdefghijkmnopqrstuvwxyz';
    const numeros = '23456789';
    const simbolos = '!@#$%&*';
    const todos = maiusculas + minusculas + numeros + simbolos;

    let senha = '';
    senha += maiusculas.charAt(Math.floor(Math.random() * maiusculas.length));
    senha += minusculas.charAt(Math.floor(Math.random() * minusculas.length));
    senha += numeros.charAt(Math.floor(Math.random() * numeros.length));
    senha += simbolos.charAt(Math.floor(Math.random() * simbolos.length));

    for (let i = 4; i < 14; i++) {
      senha += todos.charAt(Math.floor(Math.random() * todos.length));
    }
    return senha.split('').sort(function() { return 0.5 - Math.random(); }).join('');
  }

  function gerarSenhaParaFormularioNovoUsuario() {
    const inSenha = document.getElementById('novoUsuarioSenha');
    if (inSenha) {
      inSenha.value = gerarSenhaSeguraAleatoria();
      inSenha.type = 'text';
      const btnToggle = document.getElementById('btnToggleVisibilidadeSenha');
      if (btnToggle) btnToggle.textContent = '🔒';
      showToast('Senha segura gerada com sucesso!');
    }
  }

  function toggleVisibilidadeSenhaNovoUsuario() {
    const inSenha = document.getElementById('novoUsuarioSenha');
    const btnToggle = document.getElementById('btnToggleVisibilidadeSenha');
    if (!inSenha) return;
    if (inSenha.type === 'password') {
      inSenha.type = 'text';
      if (btnToggle) btnToggle.textContent = '🔒';
    } else {
      inSenha.type = 'password';
      if (btnToggle) btnToggle.textContent = '👁️';
    }
  }

  function exibirFeedbackNovoUsuario(msg, tipo) {
    const fb = document.getElementById('novoUsuarioFeedback');
    if (!fb) return;
    fb.classList.remove('hidden');
    let cor = 'var(--text-primary)';
    if (tipo === 'erro') cor = 'var(--danger, #e53935)';
    else if (tipo === 'sucesso') cor = 'var(--success, #43a047)';
    else if (tipo === 'info') cor = 'var(--accent-gold, #c99738)';
    fb.innerHTML = '<span style="color:' + cor + '; font-weight:600;">' + escapeHtml(msg) + '</span>';
  }

  async function handleNovoUsuarioSubmit(e) {
    if (e && e.preventDefault) e.preventDefault();
    const sessao = currentUserSession;
    const role = sessao && sessao.perfil && (sessao.perfil.id || sessao.perfil.nome);
    if (role !== 'ADMIN_GABINETE') {
      showToast('Ação restrita ao Moderador do Gabinete.', true);
      return;
    }

    const inNome = document.getElementById('novoUsuarioNome');
    const inEmail = document.getElementById('novoUsuarioEmail');
    const inRole = document.getElementById('novoUsuarioRole');
    const inDepto = document.getElementById('novoUsuarioDepartamento');
    const inSenha = document.getElementById('novoUsuarioSenha');
    const btnSubmit = document.getElementById('btnSalvarNovoUsuario');

    const nome = inNome ? inNome.value.trim() : '';
    const email = inEmail ? inEmail.value.trim() : '';
    const papel = inRole ? inRole.value.trim() : '';
    const departamento = inDepto ? inDepto.value.trim() : 'Secretaria Municipal de Educacao';
    const senha = inSenha ? inSenha.value.trim() : '';

    if (!nome || !email || !papel || !senha) {
      exibirFeedbackNovoUsuario('Preencha todos os campos obrigatórios (*).', 'erro');
      return;
    }

    if (senha.length < 8) {
      exibirFeedbackNovoUsuario('A senha temporária deve conter no mínimo 8 caracteres.', 'erro');
      return;
    }

    if (btnSubmit) {
      btnSubmit.disabled = true;
      btnSubmit.textContent = 'Cadastrando...';
    }
    exibirFeedbackNovoUsuario('Provisionando operador no Supabase Auth...', 'info');

    const payload = {
      nome: nome,
      email: email,
      role: papel,
      departamento: departamento,
      senhaTemporaria: senha
    };

    try {
      const res = await window.OlymposApi.criarUsuario(payload);
      if (res && res.ok) {
        exibirFeedbackNovoUsuario(res.mensagem || 'Usuário cadastrado com sucesso!', 'sucesso');
        showToast('Usuário ' + email + ' cadastrado com sucesso!');
        const form = document.getElementById('formNovoUsuario');
        if (form) form.reset();
        setTimeout(function() {
          fecharModalNovoUsuario();
          if (btnSubmit) {
            btnSubmit.disabled = false;
            btnSubmit.textContent = 'Criar Usuário';
          }
        }, 1500);
      } else {
        exibirFeedbackNovoUsuario((res && res.mensagem) || 'Falha ao cadastrar usuário.', 'erro');
        if (btnSubmit) {
          btnSubmit.disabled = false;
          btnSubmit.textContent = 'Criar Usuário';
        }
      }
    } catch (err) {
      console.error('[handleNovoUsuarioSubmit] Erro:', err);
      exibirFeedbackNovoUsuario('Erro de comunicação: ' + (err.message || 'Falha de rede.'), 'erro');
      if (btnSubmit) {
        btnSubmit.disabled = false;
        btnSubmit.textContent = 'Criar Usuário';
      }
    }
  }

  return {
    showToast: showToast,
    copiarTexto: copiarTexto,
    copiarKpi: copiarKpi,
    renderizarItensLinksGerados: renderizarItensLinksGerados,
    abrirModalContadores: abrirModalContadores,
    abrirModalMemoria: abrirModalMemoria,
    abrirModalNovoUsuario: abrirModalNovoUsuario,
    fecharModalNovoUsuario: fecharModalNovoUsuario,
    solicitarLogin: solicitarLogin,
    handleLoginSubmit: handleLoginSubmit,
    fazerLogout: fazerLogout,
    definirTema: definirTema,
    atualizarStatusConexao: atualizarStatusConexao,
    getSession: getSession,
    getSessaoAtual: getSessaoAtual,
    atualizarTokenSessao: atualizarTokenSessao,
    abrirJanelaGeminiCompanion: abrirJanelaGeminiCompanion,
    renderSkeletonTable: renderSkeletonTable,
    carregarConfiguracaoBoletimEmails: carregarConfiguracaoBoletimEmails,
    salvarBoletimEmails: salvarBoletimEmails,
    testarEnvioBoletim: testarEnvioBoletim,
    escapeHtml: escapeHtml
  };
})();

</script>
