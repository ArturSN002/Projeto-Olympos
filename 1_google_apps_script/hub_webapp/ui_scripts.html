/**
 * Hub Olympos V2.1 — Página Modular 4: Cadastro Direto de Licenças no Hub
 */
window.OlymposViews = window.OlymposViews || {};

window.OlymposViews.licencas = (function() {
  function init() {
    bindEvents();
    configurarDataInicial();
    alternarCamposPorModalidade();
  }

  function bindEvents() {
    const selMod = document.getElementById('licModalidadeSelect');
    if (selMod && !selMod._bound) {
      selMod._bound = true;
      selMod.addEventListener('change', alternarCamposPorModalidade);
    }

    const dtInicio = document.getElementById('licDataInicioInput');
    if (dtInicio && !dtInicio._bound) {
      dtInicio._bound = true;
      dtInicio.addEventListener('change', autoCalcularTermino);
    }

    const inAnos = document.getElementById('licAnosInput');
    if (inAnos && !inAnos._bound) {
      inAnos._bound = true;
      inAnos.addEventListener('input', autoCalcularTermino);
    }

    const form = document.getElementById('formCadastroLicenca');
    if (form && !form._bound) {
      form._bound = true;
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        handleSalvarLicenca();
      });
    }
  }

  function configurarDataInicial() {
    const dt = document.getElementById('licDataInicioInput');
    if (dt && !dt.value) {
      dt.value = new Date().toISOString().split('T')[0];
      autoCalcularTermino();
    }
  }

  function alternarCamposPorModalidade() {
    const mod = document.getElementById('licModalidadeSelect').value;
    const toggle = function(id, show) {
      const el = document.getElementById(id);
      if (el) el.classList.toggle('hidden', !show);
    };

    const isAnulacao = mod === 'ANULACAO';
    toggle('grpLicNome', !isAnulacao);
    toggle('grpLicMatricula', !isAnulacao);
    toggle('grpLicCargo', !isAnulacao);
    toggle('grpLicDataInicio', !isAnulacao);
    toggle('grpLicDataTermino', !isAnulacao);

    toggle('grpLicPeriodoAquisitivo', mod === 'PREMIO');
    toggle('grpLicAnosAfastados', mod === 'NAO_REMUNERADA');
    toggle('grpLicPortariaAnular', isAnulacao);
    toggle('grpLicParecer', isAnulacao);

    autoCalcularTermino();
  }

  function autoCalcularTermino() {
    const mod = document.getElementById('licModalidadeSelect').value;
    const dtInicioVal = document.getElementById('licDataInicioInput').value;
    const dtTerminoInput = document.getElementById('licDataTerminoInput');
    if (!dtInicioVal || !dtTerminoInput) return;

    if (mod === 'PREMIO') {
      const d = new Date(dtInicioVal + 'T12:00:00');
      d.setDate(d.getDate() + 89);
      dtTerminoInput.value = d.toISOString().split('T')[0];
    } else if (mod === 'NAO_REMUNERADA') {
      const anos = parseInt(document.getElementById('licAnosInput').value, 10);
      if (!isNaN(anos) && anos > 0) {
        const d = new Date(dtInicioVal + 'T12:00:00');
        d.setFullYear(d.getFullYear() + anos);
        d.setDate(d.getDate() - 1);
        dtTerminoInput.value = d.toISOString().split('T')[0];
      }
    }
  }

  function handleSalvarLicenca() {
    const mod = document.getElementById('licModalidadeSelect').value;
    const nome = document.getElementById('licNomeInput').value.trim();
    const matricula = document.getElementById('licMatriculaInput').value.trim();
    const cargo = document.getElementById('licCargoInput').value.trim();
    const portariaAnular = document.getElementById('licPortariaAnularInput').value.trim();
    const parecer = document.getElementById('licParecerInput').value.trim();
    const btn = document.getElementById('btnSalvarLicenca');
    const outBox = document.getElementById('licencaOutputFeedback');

    if (mod === 'ANULACAO') {
      if (!portariaAnular || !parecer) {
        window.OlymposApp.showToast('Informe a Portaria a Anular e o Parecer Jurídico.', true);
        return;
      }
    } else if (!nome || !matricula || !cargo) {
      window.OlymposApp.showToast('Preencha Nome Completo, Matrícula e Cargo Funcional.', true);
      return;
    }

    const payload = {
      tipoLicenca: mod,
      nome: nome,
      matricula: matricula,
      cargo: cargo,
      periodoAquisitivo: document.getElementById('licPeriodoInput').value.trim(),
      anosAfastados: document.getElementById('licAnosInput').value.trim(),
      portariaAnular: portariaAnular,
      parecer: parecer,
      dataInicio: document.getElementById('licDataInicioInput').value,
      dataTermino: document.getElementById('licDataTerminoInput').value,
      numPortaria: document.getElementById('licNumPortariaInput').value.trim() || 'AUTO',
      republicacao: document.getElementById('licRepublicadoCheck').checked ? 'SIM' : 'NÃO',
      retroativo: document.getElementById('licRetroativoCheck').checked ? 'SIM' : 'NÃO',
      gerarDocumentoAgora: document.getElementById('licGerarAgoraCheck').checked
    };

    btn.disabled = true;
    btn.textContent = 'Gravando na planilha e gerando ato...';
    outBox.classList.add('hidden');

    window.OlymposApi.chamar('licenca_cadastrar', payload, function(res) {
      btn.disabled = false;
      btn.textContent = 'Registrar Licença e Gerar Ato';

      if (res && res.ok) {
        window.OlymposApp.showToast(res.mensagem || 'Licença registrada com sucesso!');
        const checkSvg = window.OlymposIcons ? window.OlymposIcons.ui('check') : '✓';
        const urlDoc = res.urlArquivo || res.urlDocumento || '';
        const urlPlan = res.planilhaUrl || 'https://docs.google.com/spreadsheets/d/1agqeKFfubxvmdq2oND3ndykU2037NIuOXBOHVSLS9oc/edit';

        outBox.innerHTML =
          '<div class="job-result-header">' +
            '<div class="job-result-title">' +
              '<span class="job-done-badge">' + checkSvg + '</span>' +
              '<span>Finalização Confirmada — ' + window.OlymposApp.escapeHtml(res.servidor || nome || ('Anulação ' + portariaAnular)) + '</span>' +
            '</div>' +
            '<a href="' + window.OlymposApp.escapeHtml(urlPlan) + '" target="_blank" rel="noopener" class="folder-chip">Abrir Planilha de Licenças ↗</a>' +
          '</div>' +
          '<div style="font-size: 13.5px; color: var(--text-secondary);">' +
            window.OlymposApp.escapeHtml(res.mensagem || 'Registro gravado na planilha oficial.') +
          '</div>' +
          '<div class="job-links-list" id="licencaGeneratedLinks"></div>';

        outBox.classList.remove('hidden');

        const listaArquivos = [];
        if (urlDoc) {
          listaArquivos.push({
            titulo: 'Portaria de Licença Nº ' + (res.numeroPortaria || '--') + '/2026',
            identificador: res.servidor || nome,
            detalhe: res.dataTermino ? ('Término calculado: ' + res.dataTermino) : ('Aba ' + (res.aba || '')),
            url: urlDoc
          });
        } else {
          listaArquivos.push({
            titulo: 'Linha Cadastrada na Planilha Oficial (' + (res.aba || mod) + ')',
            identificador: res.servidor || nome,
            detalhe: 'Pronta para geração futura em lote',
            url: urlPlan
          });
        }

        window.OlymposApp.renderizarItensLinksGerados(
          document.getElementById('licencaGeneratedLinks'),
          listaArquivos
        );

        document.getElementById('licNomeInput').value = '';
        document.getElementById('licMatriculaInput').value = '';
        if (window.OlymposViews && window.OlymposViews.visaoGeral) {
          window.OlymposViews.visaoGeral.recarregar();
        }
      } else {
        window.OlymposApp.showToast((res && res.mensagem) || 'Falha ao cadastrar licença.', true);
      }
    }, function(err) {
      btn.disabled = false;
      btn.textContent = 'Registrar Licença e Gerar Ato';
      window.OlymposApp.showToast('Erro ao registrar licença: ' + err.message, true);
    });
  }

  return {
    init: init
  };
})();


// --- MODULE: js/views/certificados.js ---
/**
 * Hub Olympos V2.1 — Página Modular 5: Certificados & Declarações (A Lira de Orfeu)
 */
window.OlymposViews = window.OlymposViews || {};

window.OlymposViews.certificados = (function() {
  let catalog = [];
  let isCatalogLoaded = false;

  function init() {
    bindEvents();
    if (!isCatalogLoaded) {
      carregarCatalogo();
    }
  }

  function bindEvents() {
    const selPlan = document.getElementById('liraPlanilhaSelect');
    if (selPlan && !selPlan._bound) {
      selPlan._bound = true;
      selPlan.addEventListener('change', handlePlanilhaChange);
    }

    const btnClean = document.getElementById('liraHigienizarBtn');
    if (btnClean && !btnClean._bound) {
      btnClean._bound = true;
      btnClean.addEventListener('click', executarHigienizacao);
    }

    const btnExec = document.getElementById('liraExecutarBtn');
    if (btnExec && !btnExec._bound) {
      btnExec._bound = true;
      btnExec.addEventListener('click', executarLoteLira);
    }
  }

  function carregarCatalogo() {
    const planSelect = document.getElementById('liraPlanilhaSelect');
    planSelect.innerHTML = '<option value="">Carregando planilhas de eventos...</option>';

    window.OlymposApi.chamar('certificados_catalogo', {}, function(res) {
      catalog = Array.isArray(res) ? res : ((res && res.planilhas) || []);
      isCatalogLoaded = true;
      planSelect.innerHTML = '';

      if (catalog.length === 0) {
        planSelect.innerHTML = '<option value="">Nenhuma planilha encontrada na pasta da Lira</option>';
        handlePlanilhaChange();
        return;
      }

      catalog.forEach(function(item, idx) {
        const opt = document.createElement('option');
        opt.value = item.id;
        opt.textContent = item.nome + ' (' + ((item.abas && item.abas.length) || 0) + ' abas)';
        if (idx === 0) opt.selected = true;
        planSelect.appendChild(opt);
      });

      handlePlanilhaChange();
    }, function(err) {
      planSelect.innerHTML = '<option value="">Falha ao listar planilhas</option>';
      window.OlymposApp.showToast('Erro ao consultar eventos: ' + err.message, true);
    });
  }

  function handlePlanilhaChange() {
    const planId = document.getElementById('liraPlanilhaSelect').value;
    const abaSelect = document.getElementById('liraAbaSelect');
    abaSelect.innerHTML = '';

    const found = catalog.find(function(c) { return c.id === planId; });
    if (!found || !found.abas || !found.abas.length) {
      abaSelect.innerHTML = '<option value="">Nenhuma aba de participantes</option>';
      return;
    }

    found.abas.forEach(function(aba) {
      const opt = document.createElement('option');
      opt.value = aba;
      opt.textContent = aba;
      abaSelect.appendChild(opt);
    });
  }

  function executarHigienizacao() {
    const planId = document.getElementById('liraPlanilhaSelect').value;
    const sheetName = document.getElementById('liraAbaSelect').value;
    const out = document.getElementById('liraOutput');

    if (!planId || !sheetName) {
      window.OlymposApp.showToast('Selecione uma planilha e uma aba de participantes.', true);
      return;
    }

    out.innerHTML = 'Padronizando nomes em Title Case, removendo espaços invisíveis e corrigindo domínios de e-mail...';

    window.OlymposApi.chamar('certificados_higienizar', {
      spreadsheetId: planId,
      sheetName: sheetName
    }, function(res) {
      if (res && res.ok) {
        const dupEmails = (res.duplicatasEmails && res.duplicatasEmails.length) || 0;
        const dupNomes = (res.duplicatasNomes && res.duplicatasNomes.length) || 0;
        out.innerHTML =
          '<div style="font-family:var(--font-display); font-weight:700; color:var(--text-main); margin-bottom:8px;">' +
            'Higienização Pré-Voo Concluída — ' + window.OlymposApp.escapeHtml(res.aba || sheetName) +
          '</div>' +
          '<div style="display:flex; flex-wrap:wrap; gap:8px;">' +
            '<span class="pill-badge pill-green">Nomes ajustados: ' + (res.nomesCorrigidos || 0) + '</span>' +
            '<span class="pill-badge pill-blue">E-mails corrigidos: ' + (res.emailsCorrigidos || 0) + '</span>' +
            '<span class="pill-badge ' + ((dupEmails + dupNomes) > 0 ? 'pill-gold' : 'pill-green') + '">Duplicidades sinalizadas: ' + (dupEmails + dupNomes) + '</span>' +
          '</div>';
        window.OlymposApp.showToast('Lista de participantes padronizada!');
      } else {
        out.innerHTML = '<span class="text-danger">' + ((res && res.mensagem) || 'Falha ao higienizar aba.') + '</span>';
      }
    }, function(err) {
      out.innerHTML = '<span class="text-danger">Erro: ' + window.OlymposApp.escapeHtml(err.message) + '</span>';
    });
  }

  function executarLoteLira() {
    const planId = document.getElementById('liraPlanilhaSelect').value;
    const sheetName = document.getElementById('liraAbaSelect').value;
    const modalidade = document.getElementById('liraModalidadeSelect').value;
    const out = document.getElementById('liraOutput');
    const doneBox = document.getElementById('liraCompletedJobBox');
    const btn = document.getElementById('liraExecutarBtn');

    if (!planId || !sheetName) {
      window.OlymposApp.showToast('Selecione uma planilha e uma aba válidas.', true);
      return;
    }

    if (!confirm('Iniciar geração de PDFs com QR Code e envio por e-mail para a aba "' + sheetName + '"?')) return;

    btn.disabled = true;
    btn.textContent = 'Emitindo PDFs e enviando e-mails...';
    doneBox.classList.add('hidden');
    out.innerHTML = 'Processando lote na Lira de Orfeu (geração de PDFs, gravação de hash SHA-256 e envio)...';

    window.OlymposApi.chamar('certificados_executar', {
      spreadsheetId: planId,
      sheetName: sheetName,
      modalidade: modalidade
    }, function(res) {
      btn.disabled = false;
      btn.textContent = 'Emitir PDFs e Enviar por E-mail';

      if (res && res.ok) {
        const pdfs = res.pdfsGerados !== undefined ? res.pdfsGerados : (res.gerados || 0);
        const emails = res.emailsEnviados !== undefined ? res.emailsEnviados : (res.enviados || 0);
        const arquivos = res.arquivosGerados || [];
        const checkSvg = window.OlymposIcons ? window.OlymposIcons.ui('check') : '✓';

        doneBox.innerHTML =
          '<div class="job-result-header">' +
            '<div class="job-result-title">' +
              '<span class="job-done-badge">' + checkSvg + '</span>' +
              '<span>Finalização Confirmada — ' + window.OlymposApp.escapeHtml(res.evento || 'Evento') + '</span>' +
            '</div>' +
            '<div class="button-group">' +
              (arquivos.length > 0 ? '<button type="button" id="liraCopyAllBtn" class="btn btn-secondary btn-sm">Copiar Todos os Links</button>' : '') +
              (res.pastaDestinoUrl ? '<a href="' + window.OlymposApp.escapeHtml(res.pastaDestinoUrl) + '" target="_blank" rel="noopener" class="folder-chip">Abrir Pasta do Evento ↗</a>' : '') +
            '</div>' +
          '</div>' +
          '<div style="font-size:13.5px; color:var(--text-secondary);">' +
            '<strong>' + pdfs + ' novo(s) PDF(s) gerado(s)</strong> • <strong>' + emails + ' e-mail(s) enviado(s)</strong> • Cota restante: <strong>' + (res.cotaRestante !== undefined ? res.cotaRestante : '--') + '</strong>' +
            (res.agendamentoPosCota ? ' • Retomada automática agendada para ' + window.OlymposApp.escapeHtml(res.agendamentoPosCota.horarioAgendado) : '') +
          '</div>' +
          '<div class="job-links-list" id="liraGeneratedLinksList"></div>';

        doneBox.classList.remove('hidden');
        window.OlymposApp.renderizarItensLinksGerados(

// --- MODULE: js/views/diarioOficial.js ---
/**
 * Hub Olympos V2.1 — Página Modular 6: Diário Oficial FEMURN (Fogo de Prometheus — 2 Frentes)
 */
window.OlymposViews = window.OlymposViews || {};

window.OlymposViews.diarioOficial = (function() {
  let publicacoesUnificadas = [];
  let isLoaded = false;

  function init() {
    bindEvents();
    if (!isLoaded) {
      carregarPainel();
    }
  }

  function bindEvents() {
    const bind = function(id, evt, fn) {
      const el = document.getElementById(id);
      if (el && !el._bound) {
        el._bound = true;
        el.addEventListener(evt, fn);
      }
    };

    bind('prometheusSyncBtn', 'click', sincronizarMemoriaManual);
    bind('prometheusChatSummaryBtn', 'click', dispararResumoChat);
    bind('prometheusTriggerActionBtn', 'click', dispararColetaGitHubActions);
    bind('prometheusSectorFilter', 'change', renderizarTabela);
    bind('prometheusSearchInput', 'input', renderizarTabela);
    bind('diarioSalvarBoletimEmailBtn', 'click', function() {
      const inEl = document.getElementById('diarioBoletimEmailInput');
      if (window.OlymposApp && typeof window.OlymposApp.salvarBoletimEmails === 'function') {
        window.OlymposApp.salvarBoletimEmails(inEl ? inEl.value : '');
      }
    });
  }

  function carregarPainel() {
    const inDiario = document.getElementById('diarioBoletimEmailInput');
    if (inDiario && !inDiario.value) {
      inDiario.value = localStorage.getItem('olympos_boletim_emails') || '';
    }

    const tbody = document.getElementById('prometheusTableBody');
    if (tbody && window.OlymposApp && typeof window.OlymposApp.renderSkeletonTable === 'function') {
      window.OlymposApp.renderSkeletonTable(tbody, 5, 4, ['15%', '20%', '50%', '15%']);
    }

    window.OlymposApi.chamar('prometheus_status', {}, function(res) {
      const data = (res && res.data) ? res.data : res;
      const stElem = document.getElementById('promWebhookStatus');
      const lrElem = document.getElementById('promLastRun');
      const sheetBtn = document.getElementById('promSheetLinkBtn');

      if (!data || data.status === 'ERRO' || (!data.statusWebhook && !data.arquivosDrive)) {
        isLoaded = true;
        if (stElem) {
          stElem.textContent = 'Receptor GAS Pronto • Autentique-se ou execute a varredura FEMURN';
        }
        if (lrElem) {
          lrElem.textContent = 'Última recepção: Aguardando sessão autenticada ou sincronização';
        }
        renderizarTabela();
        return;
      }
      isLoaded = true;

      const sw = (typeof data.statusWebhook === 'object' && data.statusWebhook) ? data.statusWebhook : {};

      if (stElem) {
        stElem.textContent = sw.webhookAtivo
          ? 'Webhook Autenticado & Cron Diário Ativo (07:00 BRT)'
          : 'Receptor GAS Pronto • Aguardando Token Secreto ou 1º Disparo';
      }
      if (lrElem) {
        lrElem.textContent = 'Última recepção: ' + (sw.ultimaExecucao || 'Sem disparos recentes') +
          (sw.totalSalvos !== undefined ? (' • ' + sw.totalSalvos + ' ato(s) na última edição') : '');
      }
      if (sheetBtn && data.planilhaOficialUrl) {
        sheetBtn.href = data.planilhaOficialUrl;
      }

      // Mescla publicações ricas com NER do último webhook + arquivos reais das pastas 2026
      const itens = [];
      const urlsVistas = new Set();

      (sw.publicacoes || []).forEach(function(p) {
        const url = p.urlDrive || p.url || '';
        if (url) urlsVistas.add(url);
        let setor = 'Gabinete 2026';
        if (p.categoria === 'PORTARIA') setor = 'Portarias 2026';
        else if (String(p.entidade || '').includes('Câmara')) setor = 'Assessoria Jurídica 2026';

        itens.push({
          data: p.data || sw.dataReferencia || '--',
          setor: setor,
          categoria: p.categoria || 'ATO_OFICIAL',
          titulo: p.titulo || 'Publicação FEMURN',
          codigo: p.codigo || '',
          servidores: p.servidores || [],
          matriculas: p.matriculas || [],
          url: url
        });
      });

      (data.arquivosDrive || []).forEach(function(arq) {
        if (arq.url && urlsVistas.has(arq.url)) return;
        itens.push({
          data: arq.dataCriacao || '--',
          setor: arq.setor || 'Gabinete 2026',
          categoria: arq.setor && arq.setor.includes('Portarias') ? 'PORTARIA' : 'ARQUIVO_DRIVE',
          titulo: arq.nome || 'Documento PDF',
          codigo: '',
          servidores: [],
          matriculas: [],
          url: arq.url || ''
        });
      });

      publicacoesUnificadas = itens;
      renderizarTabela();
    }, function(err) {
      console.warn('Painel Fogo de Prometheus indisponível no momento:', err);
      isLoaded = true;
      const stElem = document.getElementById('promWebhookStatus');
      const lrElem = document.getElementById('promLastRun');
      if (stElem) {
        stElem.textContent = 'Modo Offline / Público • Conecte-se ao Gateway para atualizar';
      }
      if (lrElem) {
        lrElem.textContent = 'Última recepção: Sem conexão ativa com o receptor';
      }
      renderizarTabela();
    });
  }

  function renderizarTabela() {
    const tbody = document.getElementById('prometheusTableBody');
    if (!tbody) return;

    const sectorFilter = document.getElementById('prometheusSectorFilter').value;
    const termFilter = document.getElementById('prometheusSearchInput').value.toLowerCase().trim();

    const filtered = publicacoesUnificadas.filter(function(p) {
      const matchSector = (sectorFilter === 'TODOS' || p.setor === sectorFilter);
      const blob = [p.titulo, p.codigo, p.categoria, (p.servidores || []).join(' '), (p.matriculas || []).join(' ')].join(' ').toLowerCase();
      const matchTerm = (!termFilter || blob.includes(termFilter));
      return matchSector && matchTerm;
    });

    tbody.innerHTML = '';
    if (filtered.length === 0) {
      tbody.innerHTML =
        '<tr>' +
          '<td colspan="4" style="padding: 28px 12px; border: none;">' +
            '<div class="empty-state-card">' +
              '<div class="empty-state-icon">📰</div>' +
              '<div class="empty-state-title">Nenhuma publicação localizada</div>' +
              '<div class="empty-state-desc">Não foram encontrados atos oficiais ou arquivos para os filtros e termos selecionados. Tente ajustar os parâmetros de pesquisa ou atualizar o acervo.</div>' +
              '<div class="empty-state-actions">' +
                '<button type="button" id="diarioLimparFiltrosBtn" class="btn btn-secondary btn-sm">Limpar Filtros</button>' +
                '<button type="button" id="diarioAtualizarListaBtn" class="btn btn-primary btn-sm">Atualizar Lista</button>' +
              '</div>' +
            '</div>' +
          '</td>' +
        '</tr>';

      const btnClear = document.getElementById('diarioLimparFiltrosBtn');
      if (btnClear) {
        btnClear.addEventListener('click', function() {
          const sec = document.getElementById('prometheusSectorFilter');
          const srch = document.getElementById('prometheusSearchInput');
          if (sec) sec.value = 'TODOS';
          if (srch) srch.value = '';
          renderizarTabela();
        });
      }

      const btnRefresh = document.getElementById('diarioAtualizarListaBtn');
      if (btnRefresh) {
        btnRefresh.addEventListener('click', function() {
          carregarPainel();
        });
      }
      return;
    }

    filtered.forEach(function(item) {
      const tr = document.createElement('tr');
      const nerBadges = [];
      if (item.codigo) nerBadges.push('Cód. ' + item.codigo);
      if (item.servidores && item.servidores.length) nerBadges.push('Servidor(es): ' + item.servidores.join(', '));
      if (item.matriculas && item.matriculas.length) nerBadges.push('Mat.: ' + item.matriculas.join(', '));

      tr.innerHTML =
        '<td data-label="Data" style="font-family:var(--font-mono); font-size:12px;">' + window.OlymposApp.escapeHtml(item.data) + '</td>' +
        '<td data-label="Setor">' +
          '<span class="pill-badge pill-blue">' + window.OlymposApp.escapeHtml(item.setor) + '</span>' +
        '</td>' +
        '<td data-label="Ato Oficial">' +
          '<div style="font-weight:600; color:var(--text-main);">' + window.OlymposApp.escapeHtml(item.titulo) + '</div>' +
          (nerBadges.length ? '<div style="font-size:11.5px; color:var(--text-muted); margin-top:3px;">' + window.OlymposApp.escapeHtml(nerBadges.join(' • ')) + '</div>' : '') +
        '</td>' +
        '<td data-label="Documento" class="text-right">' +
          (item.url
            ? '<a href="' + window.OlymposApp.escapeHtml(item.url) + '" target="_blank" rel="noopener" class="btn btn-primary btn-sm">Abrir PDF ↗</a>'
            : '<span class="text-muted">--</span>') +
        '</td>';

      tbody.appendChild(tr);
    });
  }

  function sincronizarMemoriaManual() {
    window.OlymposApp.showToast('Sincronizando documentos 2026 com _memoria_helio.md...');
    window.OlymposApi.chamar('prometheus_sync_manual', {}, function(res) {
      if (res && res.ok) {
        window.OlymposApp.showToast(res.mensagem || 'Memória de Hélio sincronizada!');
        carregarPainel();
      } else {
        window.OlymposApp.showToast((res && res.mensagem) || 'Falha ao sincronizar.', true);
      }
    });
  }

  function dispararResumoChat() {
    window.OlymposApp.showToast('Enviando resumo executivo ao Google Chat / E-mail...');
    window.OlymposApi.chamar('prometheus_resumo_chat', {}, function(res) {
      if (res && res.ok) {
        window.OlymposApp.showToast(res.mensagem || 'Resumo processado com sucesso!');
      } else {
        window.OlymposApp.showToast((res && res.mensagem) || 'Falha ao enviar resumo.', true);
      }
    });
  }

  function dispararColetaGitHubActions() {
    const dt = prompt('Data opcional para varredura na FEMURN (DD/MM/AAAA). Deixe vazio para coletar a edição de hoje:', '');
    if (dt === null) return;

    window.OlymposApp.showToast('Solicitando disparo do workflow Fogo de Prometheus...');
    window.OlymposApi.chamar('prometheus_disparar_coleta', {
      dataInicio: dt.trim(),
      dataFim: dt.trim()
    }, function(res) {
      if (res && res.ok) {
        window.OlymposApp.showToast(res.mensagem || 'Solicitação enviada ao GitHub Actions!');
      } else {
        window.OlymposApp.showToast((res && res.mensagem) || 'Não foi possível disparar remotamente.', true);
      }
    }, function(err) {
      window.OlymposApp.showToast('Erro: ' + err.message, true);
    });
  }

  return {
    init: init
  };
})();

    { id: 'sme_touros', nome: 'SME Touros', municipio: 'Touros', regiao: 'Litoral Norte', tipo: 'Secretaria Municipal Parceira', coords: [-5.1989, -35.4608], cor: '#2563EB', icone: '🏛️', endereco: 'Av. 27 de Março, Centro', contato: '(84) 3263-2210' },
    { id: 'sme_rio_do_fogo', nome: 'SME Rio do Fogo', municipio: 'Rio do Fogo', regiao: 'Litoral Norte', tipo: 'Secretaria Municipal Parceira', coords: [-5.2750, -35.3814], cor: '#059669', icone: '🏛️', endereco: 'Rua José Severiano, Centro', contato: '(84) 3694-0112' },
    { id: 'seec_rn', nome: 'SEEC / Governo do Estado do RN', municipio: 'Governo do Estado do RN (SEEC)', regiao: 'Estadual', tipo: 'Secretaria de Estado da Educação (SEEC/RN)', coords: [-5.8278, -35.2156], cor: '#3B82F6', icone: '🌐', endereco: 'Centro Administrativo do Estado, Bloco I, BR-101, Natal/RN', contato: '(84) 3232-1300 / seec@rn.gov.br' }
  ];

  const STORAGE_KEY_SECRETARIAS = 'olympos_secretarias_parceiras';

  function obterPontosSecretarias() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY_SECRETARIAS);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed) && parsed.length > 0) {
          return PONTOS_GEORREFERENCIADOS.map(function(padrao) {
            const custom = parsed.find(function(p) { return p.id === padrao.id; });
            if (custom) {
              return {
                id: padrao.id,
                nome: custom.nome || padrao.nome,
                municipio: custom.municipio || padrao.municipio,
                regiao: custom.regiao || padrao.regiao,
                tipo: custom.tipo || padrao.tipo,
                coords: (Array.isArray(custom.coords) && custom.coords.length === 2 && !isNaN(custom.coords[0]) && !isNaN(custom.coords[1]))
                  ? [Number(custom.coords[0]), Number(custom.coords[1])]
                  : padrao.coords,
                cor: custom.cor || padrao.cor,
                icone: custom.icone || padrao.icone,
                endereco: custom.endereco || padrao.endereco,
                contato: custom.contato || padrao.contato
              };
            }
            return Object.assign({}, padrao);
          });
        }
      }
    } catch (e) {
      console.warn('[PapiroCadmo] Erro ao carregar secretarias do localStorage:', e);
    }
    return PONTOS_GEORREFERENCIADOS.map(function(p) { return Object.assign({}, p); });
  }

  function obterEscolasDinamicasCadmo() {
    // 1. Tenta API modular de Escolas
    if (window.OlymposViews && window.OlymposViews.escolas && typeof window.OlymposViews.escolas.obterEscolas === 'function') {
      try {
        const arr = window.OlymposViews.escolas.obterEscolas();
        if (Array.isArray(arr) && arr.length > 0) return arr;
      } catch (e) {
        console.warn('[PapiroCadmo] Erro ao obter escolas via módulo:', e);
      }
    }
    // 2. Tenta LocalStorage (chaves oficial e interoperável)
    try {
      const raw = localStorage.getItem('olympos_escolas_ceara_mirim') || localStorage.getItem('olympos_escolas_municipais');
      if (raw) {
        const arr = JSON.parse(raw);
        if (Array.isArray(arr) && arr.length > 0) return arr;
      }
    } catch (e) {
      console.warn('[PapiroCadmo] Erro ao analisar localStorage de escolas:', e);
    }
    // 3. Fallback para catálogo semente de escolasCearaMirim.js
    if (typeof window.BANCO_SEMENTE_ESCOLAS !== 'undefined' && Array.isArray(window.BANCO_SEMENTE_ESCOLAS)) {
      return window.BANCO_SEMENTE_ESCOLAS;
    }
    return [];
  }

  function obterTodosPontosMapa() {
    const pontos = obterPontosSecretarias();
    const escolas = obterEscolasDinamicasCadmo();

    escolas.forEach(function(esc) {
      if (esc.nome && esc.nome.includes('SMEB Sede')) return;
      if (typeof esc.lat !== 'number' || typeof esc.lng !== 'number') return;

      const ehCei = esc.categoria === 'Centro de Educação Infantil' || /^c\.?e\.?i\.?\b/i.test(esc.nome || '');
      const corPadrao = esc.zona === 'Rural' ? '#10B981' : (ehCei ? '#F59E0B' : '#38BDF8');
      pontos.push({
        id: esc.id || ('esc_' + Math.random().toString(36).substr(2, 6)),
        nome: esc.nome + ' (Ceará-Mirim)',
        nomeSimples: esc.nome,
        municipio: 'Ceará-Mirim',
        regiao: 'Ceará-Mirim • ' + (esc.zona || 'Urbana'),
        tipo: esc.categoria || 'Escola Municipal',
        coords: [esc.lat, esc.lng],
        cor: esc.cor || corPadrao,
        icone: (esc.icone === 'C' && !ehCei) ? (esc.zona === 'Rural' ? 'R' : 'U') : (esc.icone || (esc.zona === 'Rural' ? 'R' : (ehCei ? 'C' : 'U'))),
        endereco: esc.endereco || '',
        inep: esc.inep || '',
        isEscolaDinamica: true
      });
    });

    return pontos;

  function normalizarTexto(txt) {
    if (!txt) return '';
    return String(txt)
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toUpperCase()
      .trim();
  }

  function extrairMioloCpf(cpf) {
    if (!cpf) return '';
    const digits = String(cpf).replace(/\D/g, '');
    if (digits.length === 6) return digits;
    if (digits.length === 11) return digits.slice(3, 9);
    return digits.length >= 6 ? digits.slice(0, 6) : digits;
  }

  function parseCargaHoraria(ch) {
    if (!ch) return 30;
    const match = String(ch).match(/\d+/);
    if (match) {
      const val = parseInt(match[0], 10);
      return val > 0 ? val : 30;
    }
    return 30;
  }

  function auditarAcumulacaoCF37(cargoA, chA, cargoB, chB, enteA, enteB) {
    const chNumA = parseCargaHoraria(chA);
    const chNumB = parseCargaHoraria(chB);
    const chTotal = chNumA + chNumB;

    const normA = normalizarTexto(cargoA);
    const normB = normalizarTexto(cargoB);

    const isDocenteA = normA.includes('PROFESSOR') || normA.includes('DOCENTE') || normA.includes('PEDAGOGO') || normA.includes('EDUCADOR') || normA.includes('MAGISTERIO');
    const isDocenteB = normB.includes('PROFESSOR') || normB.includes('DOCENTE') || normB.includes('PEDAGOGO') || normB.includes('EDUCADOR') || normB.includes('MAGISTERIO');

    const isTecnicoA = (normA.includes('TECNICO') || normA.includes('ANALISTA') || normA.includes('ESPECIALISTA')) && !isDocenteA;
    const isTecnicoB = (normB.includes('TECNICO') || normB.includes('ANALISTA') || normB.includes('ESPECIALISTA')) && !isDocenteB;

    let enquadramento = 'Não enquadrado nas exceções constitucionais de acumulação remunerada';
    let legal = false;

    if (isDocenteA && isDocenteB) {
      legal = true;
      enquadramento = "Art. 37, XVI, 'a' da CF/88 (dois cargos de professor)";
    } else if ((isDocenteA && isTecnicoB) || (isTecnicoA && isDocenteB)) {
      legal = true;
      enquadramento = "Art. 37, XVI, 'b' da CF/88 (um cargo de professor com outro técnico ou científico)";
    }

    let parecer = '';
    if (!legal) {
      parecer = 'Vínculos incompatíveis com o caput do Art. 37, XVI da CF/88. Acumulação remunerada não autorizada entre ' + (enteA || 'Ceará-Mirim') + ' e ' + (enteB || 'ente externo') + '.';
    } else if (chTotal > 60) {
      legal = false;
      parecer = 'Alerta de incompatibilidade: a soma das cargas horárias (' + chNumA + 'h + ' + chNumB + 'h = ' + chTotal + 'h semanais) ultrapassa o teto de 60h semanais do TCU/STJ.';
    } else {
      parecer = 'Acumulação lícita e regular conforme ' + enquadramento + '. Carga horária total acumulada de ' + chTotal + 'h semanais dentro do teto constitucional de 60 horas.';
    }

    return {
      carga_horaria_total: chTotal,
      acumulacao_legal: legal,
      enquadramento: enquadramento,
      parecer_hera: parecer
    };
  }

  function popularDatalistServidores() {
    const datalist = document.getElementById('listaServidoresCearaMirim');
    if (!datalist) return;
    datalist.innerHTML = '';

    const fragment = document.createDocumentFragment();
    DOCENTES_CEARA_MIRIM.forEach(function(d) {
      const opt = document.createElement('option');
      opt.value = d.n;
      opt.label = d.m + ' • ' + d.g + ' (' + d.h + ')';
      opt.dataset.matricula = d.m;
      opt.dataset.cargo = d.g;
      opt.dataset.ch = d.h;
      opt.dataset.lotacao = d.l || '';
      fragment.appendChild(opt);
    });
    datalist.appendChild(fragment);
  }

  function configurarAutofillServidor() {
    const inputNome = document.getElementById('permutaNome');
    if (!inputNome || inputNome._autofillBound) return;
    inputNome._autofillBound = true;

    function preencher(valRaw) {
      if (!valRaw) return;
      const termo = normalizarTexto(valRaw);
      const valTrim = String(valRaw).trim();

      const achado = DOCENTES_CEARA_MIRIM.find(function(d) {
        return normalizarTexto(d.n) === termo ||
               d.m === valTrim ||
               valTrim.includes(d.m) ||
               (valTrim.length > 5 && normalizarTexto(d.n).includes(termo));
      });

      if (achado) {
        const inMat = document.getElementById('permutaMatricula');
        if (inMat) inMat.value = achado.m;

        const selCH = document.getElementById('permutaCargaHoraria');
        if (selCH) {
          const chFormat = achado.h.includes('h') ? achado.h : (achado.h + 'h');
          for (let i = 0; i < selCH.options.length; i++) {
            if (selCH.options[i].value === chFormat) {
              selCH.selectedIndex = i;
              break;
            }
          }
        }

        const selCargo = document.getElementById('permutaCargo');
        if (selCargo) {
          const gNorm = normalizarTexto(achado.g);
          if (gNorm.includes('INFANTIL')) {
            selCargo.value = 'Professor de Educação Infantil';
          } else if (gNorm.includes('INICIAIS') || gNorm.includes('MAGISTERIO') || gNorm.includes('POLIVALENTE')) {
            selCargo.value = 'Professor dos Anos Iniciais';
          } else if (gNorm.includes('PEDAGOGO') || gNorm.includes('ESPECIALISTA')) {
            selCargo.value = 'Especialista em Educação';
          } else {
            selCargo.value = 'Professor dos Anos Finais';
          }
        }

        const selDisc = document.getElementById('permutaDisciplina');
        if (selDisc) {
          const gNorm = normalizarTexto(achado.g);
          if (gNorm.includes('MATEMATICA')) selDisc.value = 'Matemática';
          else if (gNorm.includes('PORTUGUES')) selDisc.value = 'Língua Portuguesa';
          else if (gNorm.includes('HISTORIA')) selDisc.value = 'História';
          else if (gNorm.includes('GEOGRAFIA')) selDisc.value = 'Geografia';
          else if (gNorm.includes('CIENCIAS') || gNorm.includes('BIOLOGICAS')) selDisc.value = 'Ciências Biológicas';
          else if (gNorm.includes('INGLES')) selDisc.value = 'Língua Inglesa';
          else if (gNorm.includes('FISICA')) selDisc.value = 'Educação Física';
          else if (gNorm.includes('ARTES')) selDisc.value = 'Artes';
          else selDisc.value = 'Polivalente / Pedagogia';
        }

        const selOrig = document.getElementById('permutaEscolaOrigem');
        if (selOrig && achado.l) {
          const lotNorm = normalizarTexto(achado.l);
          for (let i = 0; i < selOrig.options.length; i++) {

            if (lotNorm.includes(optNorm) || optNorm.includes(lotNorm)) {
              selOrig.selectedIndex = i;
              break;
            }
          }
        }
      }
    }

  function configurarUploadCsv() {
    const btn = document.getElementById('btnCarregarCsvTransparencia');
    const input = document.getElementById('cadmoUploadCsvInput');
    if (!btn || !input || btn._uploadBound) return;
    btn._uploadBound = true;

    btn.addEventListener('click', function() {
      input.click();
    });

    input.addEventListener('change', function(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const text = evt.target.result;
        processarArquivoCsv(text, file.name);
      };
      reader.onerror = function() {
        if (window.OlymposApp && typeof window.OlymposApp.showToast === 'function') {
          window.OlymposApp.showToast('Erro ao ler arquivo CSV.', true);
        }
      };
      reader.readAsText(file, 'utf-8');
      input.value = '';
    });
  }

  function processarArquivoCsv(textoCsv, nomeArquivo) {
    try {
      const linhas = textoCsv.split(/\r?\n/).filter(function(l) { return l.trim().length > 0; });
      if (linhas.length < 2) {
        if (window.OlymposApp && typeof window.OlymposApp.showToast === 'function') {
          window.OlymposApp.showToast('Arquivo CSV vazio ou sem linhas suficientes.', true);
        }
        return;
      }

      // Detecta separador (; ou , ou \t)
      let sep = ';';
      if (linhas[0].includes(';') || (linhas[2] && linhas[2].includes(';'))) sep = ';';
      else if (linhas[0].includes(',') || (linhas[2] && linhas[2].includes(','))) sep = ',';
      else if (linhas[0].includes('\t')) sep = '\t';

      // Detecta linha de cabeçalho
      let headerIdx = 0;
      for (let i = 0; i < Math.min(10, linhas.length); i++) {
        const lNorm = normalizarTexto(linhas[i]);
        if (lNorm.includes('MATRICULA') || lNorm.includes('NOME') || lNorm.includes('CPF') || lNorm.includes('CARGO')) {
          headerIdx = i;
          break;
        }
      }

      const headers = linhas[headerIdx].split(sep).map(function(h) {
        return normalizarTexto(h.replace(/["']/g, ''));
      });

      const idxMat = headers.findIndex(function(h) { return h.includes('MATRICULA'); });
      const idxNome = headers.findIndex(function(h) { return h.includes('NOME') || h.includes('SERVIDOR'); });
      const idxCpf = headers.findIndex(function(h) { return h.includes('CPF'); });
      const idxCargo = headers.findIndex(function(h) { return h.includes('CARGO'); });
      const idxCH = headers.findIndex(function(h) { return h.includes('CARGA') || h.includes('CH') || h.includes('JORNADA'); });
      const idxLot = headers.findIndex(function(h) { return h.includes('LOTACAO') || h.includes('ORGAO') || h.includes('SECRETARIA'); });
      const idxStatus = headers.findIndex(function(h) { return h.includes('SITUACAO') || h.includes('VINCULO') || h.includes('STATUS') || h.includes('INATIVACAO'); });

      if (idxNome === -1) {
        if (window.OlymposApp && typeof window.OlymposApp.showToast === 'function') {
          window.OlymposApp.showToast('Coluna de Nome não identificada no CSV.', true);
        }
        return;
      }

      const novosServidores = [];
      for (let i = headerIdx + 1; i < linhas.length; i++) {
        const cols = linhas[i].split(sep).map(function(c) { return c.replace(/^["']|["']$/g, '').trim(); });
        if (cols.length <= idxNome) continue;
        const nome = cols[idxNome];
        if (!nome) continue;

        const mat = idxMat !== -1 ? cols[idxMat] : ('00' + (i * 13));
        const cpf = idxCpf !== -1 ? cols[idxCpf] : '';
        const cargo = idxCargo !== -1 ? cols[idxCargo] : 'PROFESSOR';
        const ch = idxCH !== -1 ? cols[idxCH] : '30h';
        const lot = idxLot !== -1 ? cols[idxLot] : '';
        const status = idxStatus !== -1 ? cols[idxStatus] : 'Ativo';

        novosServidores.push({
          m: mat,
          n: nome.toUpperCase(),
          c: cpf,
          g: cargo.toUpperCase(),
          h: ch || '30h',
          l: lot,
          status: status
        });
      }

      // Verifica se o arquivo é da folha de Ceará-Mirim ou de outro ente
      const isCearaMirim = normalizarTexto(nomeArquivo).includes('CEARA') || normalizarTexto(linhas[0]).includes('CEARA MIRIM');

      if (isCearaMirim) {
        const apenasDocentes = novosServidores.filter(function(s) {
          return normalizarTexto(s.g).includes('PROFESSOR') && !normalizarTexto(s.status).includes('INATIVO');
        });
        if (apenasDocentes.length > 0) {
          DOCENTES_CEARA_MIRIM = apenasDocentes;
          popularDatalistServidores();
        }
        const badgeRef = document.getElementById('cadmoBadgeBaseRef');
        if (badgeRef) {
          badgeRef.textContent = 'Ceará-Mirim (' + novosServidores.length + ' servidores carregados via ' + nomeArquivo + ')';
        }
        if (window.OlymposApp && typeof window.OlymposApp.showToast === 'function') {
          window.OlymposApp.showToast('Base de Ceará-Mirim atualizada com sucesso (' + novosServidores.length + ' servidores)!');
        }
      } else {
        // Ente externo: realiza cruzamento dinâmico
        const nomeEnte = nomeArquivo.replace(/\.csv$/i, '').replace(/[-_]/g, ' ').toUpperCase();
        let novosCruzamentos = 0;

        novosServidores.forEach(function(ext) {
          const normExt = normalizarTexto(ext.n);
          const mioloExt = extrairMioloCpf(ext.c);

          const matchCeara = DOCENTES_CEARA_MIRIM.find(function(c) {
            if (normalizarTexto(c.n) !== normExt) return false;
            const mioloC = extrairMioloCpf(c.c);
            if (mioloC && mioloExt && mioloC !== mioloExt) return false;
            return true;
          });

          if (matchCeara) {
            const audit = auditarAcumulacaoCF37(matchCeara.g, matchCeara.h, ext.g, ext.h, 'Ceará-Mirim', nomeEnte);
            VINCULOS_TRANSPARENCIA.unshift({
              servidor_referencia: {
                municipio: 'Ceará-Mirim',
                matricula: matchCeara.m,
                nome_completo: matchCeara.n,
                cpf_mascarado: matchCeara.c,
                cpf_miolo: extrairMioloCpf(matchCeara.c),
                cargo: matchCeara.g,
                escola_origem: matchCeara.l || 'SMEB Ceará-Mirim',
                carga_horaria: parseCargaHoraria(matchCeara.h),
                status: 'ATIVO'
              },
              vinculo_externo_detectado: {
                ente_origem: nomeEnte,
                matricula: ext.m,
                cargo: ext.g,
                lotacao_orgao: ext.l || nomeEnte,
                carga_horaria: parseCargaHoraria(ext.h),
                situacao_vinculo: ext.status || 'ATIVO'
              },
              auditoria_constitucional: audit,
              potencial_permuta: {
                polo_parceiro: 'Polo ' + nomeEnte,
                otimizacao_logistica: 'Oportunidade de permuta com redução de trajeto vinculada a ' + nomeEnte + '.'
              }
            });
            novosCruzamentos++;
          }
        });

        if (novosCruzamentos > 0) {
          alternarAbaResultados('vinculos');
          executarCruzamentoVinculosHera();
          if (window.OlymposApp && typeof window.OlymposApp.showToast === 'function') {
            window.OlymposApp.showToast('Cruzamento de vínculos: ' + novosCruzamentos + ' correspondência(s) encontrada(s) em ' + nomeEnte + '!');
          }
        } else {
          if (window.OlymposApp && typeof window.OlymposApp.showToast === 'function') {
            window.OlymposApp.showToast('Nenhum servidor com acúmulo correspondente localizado nesta planilha.');
          }
        }
      }
    } catch (err) {
      console.error('[PapiroCadmo] Erro ao processar CSV:', err);
      if (window.OlymposApp && typeof window.OlymposApp.showToast === 'function') {
        window.OlymposApp.showToast('Erro ao processar estrutura do CSV: ' + err.message, true);
      }
    }
  }

  function garantirBancoPermutasInicial() {
    try {
      const gravado = localStorage.getItem(BANCO_STORAGE_KEY);
      // Saneamento: se for nulo, vazio ou contiver os dados fictícios legados (ex: 2026-1042 ou Mariana Medeiros), atualiza com a base real
      if (!gravado || gravado === '[]' || gravado.includes('2026-1042') || gravado.includes('Mariana Medeiros')) {
        localStorage.setItem(BANCO_STORAGE_KEY, JSON.stringify(BANCO_INICIAL_PERMUTAS));
      }
    } catch (e) {
      console.warn('[PapiroCadmo] LocalStorage inacessível para banco de permutas:', e);
    }
  }

  function obterBancoPermutas() {
    try {
      const raw = localStorage.getItem(BANCO_STORAGE_KEY);
      if (raw) {
        const arr = JSON.parse(raw);
        if (Array.isArray(arr) && arr.length > 0) {
          // Filtra entradas legadas do mock fictício se ainda existirem
          const filtrado = arr.filter(function(item) {
            const mat = String(item.matricula || '');
            const nome = String(item.nome || '');
            return !mat.startsWith('2026-') && !nome.includes('Mariana Medeiros') && !nome.includes('Carlos Eduardo Nogueira');
          });
          if (filtrado.length > 0) return filtrado;
        }
      }
    } catch (e) {
      console.warn('[PapiroCadmo] Erro ao analisar banco de permutas:', e);
    }
    return BANCO_INICIAL_PERMUTAS.slice();
  }

  function extrairMunicipioOrigem(nomeOrigem) {
    const str = String(nomeOrigem || '').toLowerCase();
    if (str.includes('governo do estado') || str.includes('seec') || str.includes('estadual')) return 'Governo do Estado (SEEC)';
    if (str.includes('ceará-mirim') || str.includes('ceara-mirim') || str.includes('smeb')) return 'Ceará-Mirim';
    if (str.includes('natal')) return 'Natal';
    if (str.includes('extremoz')) return 'Extremoz';
    if (str.includes('são gonçalo') || str.includes('sao goncalo') || str.includes('sga')) return 'São Gonçalo do Amarante';
    if (str.includes('macaíba') || str.includes('macaiba')) return 'Macaíba';
    if (str.includes('parnamirim')) return 'Parnamirim';
    if (str.includes('nísia') || str.includes('nisia')) return 'Nísia Floresta';
    if (str.includes('monte alegre')) return 'Monte Alegre';
    if (str.includes('ielmo marinho') || str.includes('ielmo')) return 'Ielmo Marinho';
    if (str.includes('potengi') || str.includes('são paulo') || str.includes('sao paulo')) return 'São Paulo do Potengi';
    if (str.includes('joão câmara') || str.includes('joao camara') || str.includes('câmara') || str.includes('camara')) return 'João Câmara';
    if (str.includes('poço branco') || str.includes('poco branco')) return 'Poço Branco';
    if (str.includes('taipú') || str.includes('taipu')) return 'Taipú';
    if (str.includes('touros')) return 'Touros';
    if (str.includes('rio do fogo')) return 'Rio do Fogo';
    return 'Ceará-Mirim';
  }

  function salvarEdicaoSecretaria(e) {
    if (e && typeof e.preventDefault === 'function') e.preventDefault();

    const inputId = document.getElementById('editSecId');
    const inputNome = document.getElementById('editSecNome');
    const inputMun = document.getElementById('editSecMunicipio');
    const inputContato = document.getElementById('editSecContato');
    const inputLat = document.getElementById('editSecLat');
    const inputLng = document.getElementById('editSecLng');

    if (!inputId || !inputNome || !inputMun || !inputLat || !inputLng) return;

    const pontoId = inputId.value;
    const nome = inputNome.value.trim();
    const municipio = inputMun.value.trim();
    const contato = inputContato ? inputContato.value.trim() : '';
    const lat = parseFloat(inputLat.value);
    const lng = parseFloat(inputLng.value);

    if (!nome || !municipio) {
      if (window.OlymposApp && typeof window.OlymposApp.showToast === 'function') {
        window.OlymposApp.showToast('Preencha o Nome e o Município da secretaria parceira.', 'error');
      }
      return;
    }

    if (isNaN(lat) || isNaN(lng) || lat < -90 || lat > 90 || lng < -180 || lng > 180) {
      if (window.OlymposApp && typeof window.OlymposApp.showToast === 'function') {
        window.OlymposApp.showToast('Coordenadas de latitude e longitude inválidas.', 'error');
      }
      return;
    }

    const secretarias = obterPontosSecretarias();
    const idx = secretarias.findIndex(function(p) { return p.id === pontoId; });
    if (idx === -1) {
      if (window.OlymposApp && typeof window.OlymposApp.showToast === 'function') {
        window.OlymposApp.showToast('Secretaria parceira não encontrada.', 'error');
      }
      return;
    }

    secretarias[idx].nome = nome;
    secretarias[idx].municipio = municipio;
    secretarias[idx].contato = contato;
    secretarias[idx].coords = [lat, lng];
    if (pontoId === 'sme_ceara_mirim') {
      secretarias[idx].nomeSimples = nome;
    }

    try {
      localStorage.setItem(STORAGE_KEY_SECRETARIAS, JSON.stringify(secretarias));
    } catch (err) {
      console.warn('[PapiroCadmo] Erro ao salvar no localStorage:', err);
    }

    if (window.OlymposSupabase && typeof window.OlymposSupabase.sincronizarSecretariaParceira === 'function') {
      window.OlymposSupabase.sincronizarSecretariaParceira(secretarias[idx]).catch(function(eSup) {
        console.warn('[PapiroCadmo] Falha na sincronização assíncrona da secretaria com Supabase:', eSup);
      });
    }

    plotarMarcadores();
    popularSelectsFormularioPermuta();
    fecharModalEdicaoSecretaria();

    if (window.OlymposApp && typeof window.OlymposApp.showToast === 'function') {
      window.OlymposApp.showToast('Secretaria parceira "' + nome + '" salva com sucesso!', 'success');
    }
  }

  /**
   * Motor de Matching Automático da Persona Hera:
   * Pontuação ponderada:
   *  1. Cargo / Disciplina: 40 pontos
   *  2. Carga Horária: 30 pontos
   *  3. Rota Inversa de Permuta: 30 pontos
   * Total: 0 a 100%
   * Badges: Excelente (>= 80%), Boa (>= 60%), Regular (< 60%)
   */
  function calcularCompatibilidadeHera(intA, intB) {
    // 1. Cargo & Disciplina (40 pts)
    let ptsCargo = 0;
    const mesmoCargo = intA.cargo === intB.cargo;
    const mesmaDisciplina = intA.disciplina === intB.disciplina;

    if (mesmoCargo && mesmaDisciplina) {
      ptsCargo = 40;
    } else if (mesmoCargo) {
      ptsCargo = 28;
    } else if (mesmaDisciplina) {
      ptsCargo = 18;
    } else {
      ptsCargo = 0;
    }

    // 2. Carga Horária (30 pts)
    let ptsCH = 0;
    const chA = parseInt(intA.cargaHoraria, 10) || 30;
    const chB = parseInt(intB.cargaHoraria, 10) || 30;
    const diffCH = Math.abs(chA - chB);

    if (diffCH === 0) {
      ptsCH = 30;
    } else if (diffCH <= 10) {
      ptsCH = 16; // Requer compensação de carga horária pela comissão
    } else {
      ptsCH = 0;
    }

    // 3. Rota Inversa de Permuta (30 pts)
    let ptsRota = 0;
    const munOrigA = intA.municipioOrigem || extrairMunicipioOrigem(intA.origem);
    const munDestA = intA.destino;
    const munOrigB = intB.municipioOrigem || extrairMunicipioOrigem(intB.origem);
    const munDestB = intB.destino;

    const sOrigA = String(munOrigA || '').toLowerCase();
    const sDestA = String(munDestA || '').toLowerCase();
    const sOrigB = String(munOrigB || '').toLowerCase();
    const sDestB = String(munDestB || '').toLowerCase();

    const rotaInversaExata = Boolean(sOrigA && sDestB && sOrigB && sDestA) &&
                             (sOrigA === sDestB) &&
                             (sOrigB === sDestA);

    if (rotaInversaExata) {
      ptsRota = 30;
    } else if ((sOrigA && sDestB && sOrigA === sDestB) || (sOrigB && sDestA && sOrigB === sDestA)) {
      ptsRota = 18;
    } else {
      ptsRota = 5;
    }

    const scoreTotal = ptsCargo + ptsCH + ptsRota;

    let nivel = 'Regular';
    let badgeClass = 'badge-regular';
    let parecerHera = 'Parecer Hera: Requer análise curricular detalhada e adequação de carga horária pela Comissão de RH.';

    if (scoreTotal >= 80) {
      nivel = 'Excelente';
      badgeClass = 'badge-excelente';
      parecerHera = 'Parecer Hera: Compatibilidade pedagógica e rota geográfica recíproca perfeitas. Deferimento prioritário recomendado.';
    } else if (scoreTotal >= 60) {
      nivel = 'Boa';
      badgeClass = 'badge-boa';
      parecerHera = 'Parecer Hera: Viabilidade operacional confirmada. Necessário alinhamento de turno ou ajuste funcional leve.';
    }

    return {
      score: scoreTotal,
      nivel: nivel,
      badgeClass: badgeClass,
      ptsCargo: ptsCargo,
      ptsCH: ptsCH,
      ptsRota: ptsRota,
      parecerHera: parecerHera
    };
  }

  // =========================================================================
  // MOTOR DE BUSCA EM TEMPO REAL DE SERVIDORES EM PERMUTAS
  // =========================================================================

  function normalizarBusca(txt) {
    if (!txt) return '';
    return String(txt)
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toUpperCase()
      .trim();
  }

  function filtrarMatchesPorTermo(matches, termo) {
    if (!termo) return matches;
    const q = normalizarBusca(termo);
    return matches.filter(function(m) {
      const a = m.candidatoA || {};
      const b = m.candidatoB || {};
      const corpusA = [a.nome, a.matricula, a.cargo, a.disciplina, a.origem, a.destino, a.municipioOrigem].map(normalizarBusca).join(' ');
      const corpusB = [b.nome, b.matricula, b.cargo, b.disciplina, b.origem, b.destino, b.municipioOrigem].map(normalizarBusca).join(' ');
      return corpusA.includes(q) || corpusB.includes(q);
    });
  }

  function filtrarVinculosPorTermo(vinculos, termo) {
    if (!termo) return vinculos;
    const q = normalizarBusca(termo);
    return vinculos.filter(function(v) {
      const sr = v.servidor_referencia || {};
      const ve = v.vinculo_externo_detectado || {};
      const corpusSr = [sr.nome_completo, sr.matricula, sr.cargo, sr.escola_origem, sr.municipio].map(normalizarBusca).join(' ');
      const corpusVe = [ve.ente_origem, ve.matricula, ve.cargo, ve.lotacao_orgao].map(normalizarBusca).join(' ');
      return corpusSr.includes(q) || corpusVe.includes(q);
    });
  }

  function filtrarDocentesPorTermo(docentes, termo) {
    if (!termo) return docentes;
    const q = normalizarBusca(termo);
    return docentes.filter(function(d) {
      const corpus = [d.n, d.m, d.g, d.l, d.h, d.ente || '', d.orgao || '', d.municipio || ''].map(normalizarBusca).join(' ');
      return corpus.includes(q);
    });
  }

  function executarMatchingHera() {
    const container = document.getElementById('resultadoMatchingHera');
    const badgeTotal = document.getElementById('badgeTotalMatches');
    if (!container) return;

    const banco = obterBancoPermutas();
    const matches = [];

    // Cruzamento combinatório de pares (i < j)
    for (let i = 0; i < banco.length; i++) {
      for (let j = i + 1; j < banco.length; j++) {
        const intA = banco[i];
        const intB = banco[j];

        // Evita cruzar mesma pessoa ou matrícula
        if (intA.matricula === intB.matricula) continue;

        const resultado = calcularCompatibilidadeHera(intA, intB);

        // Considera match relevante se score >= 50 ou se rota inversa for compatível
        if (resultado.score >= 50) {
          matches.push({
            candidatoA: intA,
            candidatoB: intB,
            resultado: resultado
          });
        }
      }
    }

    // Ordenação decrescente por score de compatibilidade
    matches.sort(function(a, b) {
      return b.resultado.score - a.resultado.score;
    });

    const matchesFiltrados = filtrarMatchesPorTermo(matches, termoBuscaServidor);

    if (badgeTotal) {
      if (termoBuscaServidor) {
        badgeTotal.textContent = matchesFiltrados.length + ' de ' + matches.length + ' oportunidades';
      } else {
        badgeTotal.textContent = matches.length + (matches.length === 1 ? ' oportunidade' : ' oportunidades');
      }
    }

    const previewPill = document.getElementById('heraMatchPreviewPill');
    if (previewPill) {
      if (matchesFiltrados.length > 0) {
        previewPill.textContent = 'Top Match: ' + matchesFiltrados[0].resultado.score + '% (' + matchesFiltrados[0].resultado.nivel + ')';
        previewPill.classList.remove('hidden');
      } else {
        previewPill.classList.add('hidden');
      }
    }

    atualizarResumoBusca(matchesFiltrados.length, matches.length, 'permutas');

    if (matchesFiltrados.length === 0) {
      if (termoBuscaServidor) {
        container.innerHTML =
          '<div class="output-panel text-center" style="padding: 32px 20px;">' +
            '<div style="font-size: 1.8rem; margin-bottom: 8px;">🔍</div>' +
            '<strong style="display:block; font-size:15px; margin-bottom:6px; color:var(--text-main);">Nenhum servidor ou oportunidade de permuta localizada</strong>' +
            '<p style="font-size:13px; color:var(--text-muted); max-width:480px; margin:0 auto 14px;">Não foram identificadas permutas para o termo "<strong>' + window.OlymposApp.escapeHtml(termoBuscaServidor) + '</strong>". Tente buscar por matrícula funcional de 7 dígitos, nome, escola de lotação ou município.</p>' +
            '<button type="button" class="btn btn-secondary btn-sm" onclick="window.OlymposViews.papiroCadmo.limparBuscaServidor()">Limpar Busca</button>' +
          '</div>';
      } else {
        container.innerHTML =
          '<div class="output-panel text-center" style="padding: 32px 20px;">' +
            '<div style="font-size: 1.8rem; margin-bottom: 8px;">🤝</div>' +
            '<strong style="display:block; font-size:15px; margin-bottom:6px; color:var(--text-main);">Nenhum cruzamento de permuta recíproca identificado ainda</strong>' +

  function preencherFormComDocente(nome, matricula, cargo, ch, lotacao) {
    const inNome = document.getElementById('permutaNome');

    const inMat = document.getElementById('permutaMatricula');
    if (inMat) inMat.value = matricula;

    const selCH = document.getElementById('permutaCargaHoraria');
    if (selCH && ch) {
      const chFmt = ch.includes('h') ? ch : (ch + 'h');
      for (let i = 0; i < selCH.options.length; i++) {
        if (selCH.options[i].value === chFmt) {
          selCH.selectedIndex = i;
          break;
        }
      }
    }

    const selCargo = document.getElementById('permutaCargo');
    if (selCargo && cargo) {
      const gNorm = normalizarBusca(cargo);
      if (gNorm.includes('INFANTIL')) {
        selCargo.value = 'Professor de Educação Infantil';
      } else if (gNorm.includes('INICIAIS') || gNorm.includes('MAGISTERIO') || gNorm.includes('POLIVALENTE')) {
        selCargo.value = 'Professor dos Anos Iniciais';
      } else if (gNorm.includes('PEDAGOGO') || gNorm.includes('ESPECIALISTA')) {
        selCargo.value = 'Especialista em Educação';
      } else {
        selCargo.value = 'Professor dos Anos Finais';
      }
    }

    const selOrig = document.getElementById('permutaEscolaOrigem');
    if (selOrig && lotacao) {
      const lotNorm = normalizarBusca(lotacao);
      for (let i = 0; i < selOrig.options.length; i++) {

        if (lotNorm.includes(optNorm) || optNorm.includes(lotNorm)) {
          selOrig.selectedIndex = i;
          break;

    const wrapper = document.getElementById('wrapperFormPermuta');
    if (wrapper && wrapper.classList.contains('hidden')) {
      wrapper.classList.remove('hidden');
    }

    const form = document.getElementById('formPermutaCadmo');
    if (form) {
      form.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

      window.OlymposApp.showToast('Professor(a) ' + nome + ' transferido(a) para o formulário de permuta!');
    }
  }

  function tracarRotaPermuta(origemA, origemB, score) {
    if (!leafletMap || !routeLayer) return;
    routeLayer.clearLayers();

    // Localiza coordenadas de A e B
    let coordA = null;
    let coordB = null;

    const todos = obterTodosPontosMapa();
    todos.forEach(function(p) {
      if (!coordA && (p.nome === origemA || origemA.includes(p.nome) || p.nome.includes(origemA))) {
        coordA = p.coords;
      }
      if (!coordB && (p.nome === origemB || origemB.includes(p.nome) || p.nome.includes(origemB))) {
        coordB = p.coords;
      }
    });

    if (!coordA) coordA = [-5.6344, -35.4245];
    if (!coordB) coordB = [-5.7550, -35.2600];

    const corLinha = score >= 80 ? '#10B981' : (score >= 60 ? '#D4AF37' : '#64748B');

    const polyline = window.L.polyline([coordA, coordB], {
      color: corLinha,
      weight: 4,
      dashArray: '8, 8',
      opacity: 0.95
    }).addTo(routeLayer);

    const bounds = window.L.latLngBounds([coordA, coordB]);
    leafletMap.fitBounds(bounds, { padding: [50, 50], maxZoom: 13 });

    // Scroll suave até o mapa
    const mapWrapper = document.getElementById('mapaPermutasCadmo');
    if (mapWrapper) {
      mapWrapper.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    if (window.OlymposApp && typeof window.OlymposApp.showToast === 'function') {
      window.OlymposApp.showToast('Rota de permuta traçada no mapa cartográfico!');
    }
  }

    const disciplina = (document.getElementById('permutaDisciplina')?.value || '').trim();
    const cargaHoraria = (document.getElementById('permutaCargaHoraria')?.value || '').trim();
    const turno = (document.getElementById('permutaTurno')?.value || '').trim();
    const origem = (document.getElementById('permutaEscolaOrigem')?.value || '').trim();
    const destino = (document.getElementById('permutaPoloDestino')?.value || '').trim();

    if (!nome || !matricula || !cargo || !disciplina || !origem || !destino) {
      if (window.OlymposApp && typeof window.OlymposApp.showToast === 'function') {
        window.OlymposApp.showToast('Por favor, preencha todos os campos obrigatórios da permuta.', true);
      }
      return;
    }

    const novaIntencao = {
      id: 'perm_' + Date.now(),
      nome: nome,
      matricula: matricula,
      cargo: cargo,
      disciplina: disciplina,
      cargaHoraria: cargaHoraria,
      turno: turno,
      origem: origem,
      municipioOrigem: extrairMunicipioOrigem(origem),
      destino: destino,
      dataCadastro: new Date().toISOString().slice(0, 10)
    };

    try {
      const banco = obterBancoPermutas();
      banco.unshift(novaIntencao);
      localStorage.setItem(BANCO_STORAGE_KEY, JSON.stringify(banco));

      const form = document.getElementById('formPermutaCadmo');
      if (form) form.reset();

      alternarAbaResultados('permutas');
      executarMatchingHera();

      if (window.OlymposApp && typeof window.OlymposApp.showToast === 'function') {
        window.OlymposApp.showToast('Intenção de permuta gravada com sucesso! Persona Hera recalculou as compatibilidades.');
      }
    } catch (err) {
      console.error('[PapiroCadmo] Erro ao gravar intenção no localStorage:', err);
      if (window.OlymposApp && typeof window.OlymposApp.showToast === 'function') {
        window.OlymposApp.showToast('Erro ao salvar intenção de permuta.', true);
      }
    }
  }

  function carregarStatusDrive() {
    window.OlymposApi.chamar('cadmo_status', {}, function(res) {
      const data = (res && res.data) ? res.data : res;
      if (!data) return;
      isStatusLoaded = true;

      const compEl = document.getElementById('cadmoLastCompetencia');
      const metaEl = document.getElementById('cadmoLastUploadMeta');
      const listEl = document.getElementById('cadmoCsvFilesList');

      if (compEl) compEl.textContent = data.ultimaCompetencia || 'Ciclo Mensal Configurado (Todo dia 12)';
      if (metaEl) {
        metaEl.textContent = data.totalArquivosCsv > 0
          ? (data.totalArquivosCsv + ' base(s) CSV consolidada(s) no Drive • Última atualização: ' + (data.ultimoUploadEm || '--'))
          : 'Pipeline pronto no GitHub Actions. Os arquivos servidores-intermunicipais-AAAA-MM.csv aparecerão automaticamente aqui.';
      }

      if (listEl) {
        const arqs = data.arquivosCsv || [];
        if (arqs.length === 0) {
          listEl.innerHTML = 'Nenhuma base <code>servidores-intermunicipais-AAAA-MM.csv</code> localizada ainda na pasta do Setor Pessoal.';
        } else {
          listEl.className = 'job-links-list';
          window.OlymposApp.renderizarItensLinksGerados(
            listEl,
            arqs.map(function(a) {
              return {
                titulo: a.nome,
                detalhe: 'Competência ' + a.competencia + ' • ' + a.dataCriacao + ' • ' + a.tamanhoKb + ' KB',
                url: a.url
              };
            })
          );
        }
      }
    }, function() {
      const listEl = document.getElementById('cadmoCsvFilesList');
      if (listEl) {
        listEl.innerHTML = 'Conecte-se ao Gateway GAS para listar os arquivos CSV consolidados na pasta do Setor Pessoal.';
      }
    });
  }

  function renderizarPortais(termoRaw) {
    const grid = document.getElementById('cadmoPortaisGrid');
    if (!grid) return;

    const termo = String(termoRaw || '').toLowerCase().trim();
    const filtrados = PORTAIS.filter(function(p) {
      if (!termo) return true;
      return p.nome.toLowerCase().includes(termo) ||
        p.regiao.toLowerCase().includes(termo) ||
        p.tecnologia.toLowerCase().includes(termo);
    });

    grid.innerHTML = '';
    filtrados.forEach(function(p) {
      const card = document.createElement('div');
      card.className = 'output-panel';
      card.style.display = 'flex';
      card.style.flexDirection = 'column';
      card.style.justifyContent = 'space-between';
      card.style.gap = '10px';

      const dataCsv = p.dataUltimoCsv || '12/10/2026';
      card.innerHTML =

          '<div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:6px;">' +
            '<strong style="font-family:var(--font-display); font-size:13.5px; color:var(--text-main);">' + window.OlymposApp.escapeHtml(p.nome) + '</strong>' +
            '<span class="pill-badge pill-green">Dia 12</span>' +

          '<div style="font-size:12px; color:var(--text-muted);">' + window.OlymposApp.escapeHtml(p.regiao) + ' • ' + window.OlymposApp.escapeHtml(p.tecnologia) + '</div>' +
          '<div class="portal-csv-date-box" style="display:flex; align-items:center; gap:5px; font-size:11.5px; color:var(--text-secondary); margin-top:6px; background:var(--bg-tonal); padding:3px 8px; border-radius:var(--radius-sm,6px); border:1px solid var(--border-hairline);">' +
            '<span aria-hidden="true">📥</span> <span>Último CSV:</span> <strong class="portal-csv-date" style="color:var(--brand-gold); font-family:var(--font-mono); font-size:11px;">' + window.OlymposApp.escapeHtml(dataCsv) + '</strong>' +
          '</div>' +
        '</div>' +
        '<div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px;">' +
          '<span style="font-family:var(--font-mono); font-size:10.5px; color:var(--text-muted);">Fallback SIAI/TCE-RN</span>' +
          '<a href="' + window.OlymposApp.escapeHtml(p.url) + '" target="_blank" rel="noopener" class="folder-chip" style="padding:3px 10px; font-size:11px;">Portal ↗</a>' +
        '</div>';

      grid.appendChild(card);
    });
  }

  function dispararColetaMensal() {
    const comp = prompt('Competência opcional (AAAA-MM, ex: 2026-09). Deixe vazio para coletar o mês anterior completo:', '');
    if (comp === null) return;

    window.OlymposApp.showToast('Acionando pipeline O Papiro de Cadmo no GitHub Actions...');
    window.OlymposApi.chamar('cadmo_disparar_coleta', { competencia: comp.trim() }, function(res) {
      if (res && res.ok) {
        window.OlymposApp.showToast(res.mensagem || 'Pipeline O Papiro de Cadmo acionado!');
      } else {
        window.OlymposApp.showToast((res && res.mensagem) || 'Falha ao acionar coleta.', true);
      }
    }, function(err) {
      window.OlymposApp.showToast('Erro: ' + err.message, true);
    });
  }

  /**
   * Obtém os eventos customizados da agenda intersetorial armazenados localmente
   */
  function obterEventosAgendaCustom(anoFiltro) {
    try {
      var raw = localStorage.getItem(STORAGE_AGENDA_KEY) || localStorage.getItem(STORAGE_CUSTOM_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) {
          if (anoFiltro) {
            return parsed.filter(function(e) {
              return !e.ano || Number(e.ano) === Number(anoFiltro);
            });
          }
          return parsed;
        }
      }
    } catch (e) {
      console.warn('[Calendario] Erro ao carregar eventos da agenda do localStorage:', e);
    }
    return [];
  }

  /**
   * Grava lista completa de eventos customizados no localStorage
   */
  function salvarListaAgendaCustom(lista) {
    try {
      localStorage.setItem(STORAGE_AGENDA_KEY, JSON.stringify(lista));
      localStorage.setItem(STORAGE_CUSTOM_KEY, JSON.stringify(lista));
    } catch (e) {
      console.warn('[Calendario] Erro ao salvar eventos da agenda no localStorage:', e);
    }
  }

  /**
   * Retorna todos os eventos (oficiais do ano + agenda intersetorial customizada)
   */
  function obterTodosEventos(dados) {
    var oficiais = (dados && Array.isArray(dados.eventos)) ? dados.eventos : [];
    var custom = obterEventosAgendaCustom((dados && dados.ano) ? dados.ano : selectedYear);
    return oficiais.concat(custom);
  }

  /**
   * Salva ou atualiza um evento da agenda
   */
  function salvarEventoAgenda(evento) {
    if (!evento || !evento.titulo || !evento.dataInicio) {
      if (window.OlymposApp && typeof window.OlymposApp.showToast === 'function') {
        window.OlymposApp.showToast('Título e data de início são obrigatórios!', true);
      }
      return false;
    }

    var lista = obterEventosAgendaCustom();
    var id = evento.id;
    var agoraIso = new Date().toISOString();
    var anoEvt = evento.dataInicio ? parseInt(evento.dataInicio.split('-')[0], 10) : selectedYear;

    var dadosNormalizados = {
      id: id || ('age_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5)),
      ano: anoEvt,
      titulo: String(evento.titulo).trim(),
      dataInicio: evento.dataInicio,
      dataFim: evento.dataFim || evento.dataInicio,
      horario: evento.horario || '',
      setor: evento.setor || 'Gabinete SMEB',
      categoria: evento.categoria || 'agenda_intersetorial',
      local: evento.local || '',
      descricao: evento.descricao || '',
      publicoAlvo: evento.publicoAlvo || '',
      letivo: false, // RIGOR LDB: eventos da agenda intersetorial NUNCA alteram os 203 dias letivos
      cor: evento.cor || '#8B5CF6',
      icone: evento.icone || '🗓️',
      custom: true,
      updated_at: agoraIso
    };

    var idx = lista.findIndex(function(e) { return e.id === dadosNormalizados.id; });
    if (idx >= 0) {
      lista[idx] = Object.assign({}, lista[idx], dadosNormalizados);
    } else {
      lista.push(dadosNormalizados);
    }

    salvarListaAgendaCustom(lista);

    // Sincronização assíncrona com Supabase
    if (window.OlymposSupabase && typeof window.OlymposSupabase.salvarAgendaEvento === 'function') {
      window.OlymposSupabase.salvarAgendaEvento(dadosNormalizados).catch(function(eSup) {
        console.warn('[Calendario] Sincronização em segundo plano com Supabase falhou:', eSup);
      });
    }

    fecharModalFormAgenda();
    renderizar();

    if (window.OlymposApp && typeof window.OlymposApp.showToast === 'function') {
      window.OlymposApp.showToast('Evento "' + dadosNormalizados.titulo + '" registrado com sucesso na Agenda!');
    }
    return true;
  }

  /**
   * Exclui um evento da agenda customizada
   */
  function excluirEventoAgenda(id) {
    if (!id) return;
    var lista = obterEventosAgendaCustom();
    var novaLista = lista.filter(function(e) { return e.id !== id; });
    salvarListaAgendaCustom(novaLista);

    // Sincronização assíncrona com Supabase
    if (window.OlymposSupabase && typeof window.OlymposSupabase.excluirAgendaEvento === 'function') {
      window.OlymposSupabase.excluirAgendaEvento(id).catch(function(eSup) {
        console.warn('[Calendario] Falha ao excluir do Supabase:', eSup);
      });
    }

    fecharModalFormAgenda();
    fecharModalDetalhesDia();
    renderizar();

    if (window.OlymposApp && typeof window.OlymposApp.showToast === 'function') {
      window.OlymposApp.showToast('Evento da agenda excluído com sucesso!');
    }
  }

  /**
   * Abre o modal de formulário da agenda para criar ou editar
   */
  function abrirModalFormAgenda(evOuData) {
    var modal = document.getElementById('modalFormAgendaEvento');
    var form = document.getElementById('formAgendaEventoCalendario');
    var tituloModal = document.getElementById('modalFormAgendaTitulo');
    var btnExcluir = document.getElementById('btnExcluirEventoAgenda');
    if (!modal || !form) return;

    form.reset();

    var idIn = document.getElementById('agendaEventoId');
    var tituloIn = document.getElementById('agendaTitulo');
    var dataInicioIn = document.getElementById('agendaDataInicio');
    var dataFimIn = document.getElementById('agendaDataFim');
    var horarioIn = document.getElementById('agendaHorario');
    var setorIn = document.getElementById('agendaSetor');
    var catIn = document.getElementById('agendaCategoria');
    var localIn = document.getElementById('agendaLocal');
    var descIn = document.getElementById('agendaDescricao');

    var eventoEncontrado = null;
    if (typeof evOuData === 'string' && evOuData.indexOf('age_') === 0) {
      var todos = obterEventosAgendaCustom();
      eventoEncontrado = todos.find(function(e) { return e.id === evOuData; });
    } else if (typeof evOuData === 'object' && evOuData !== null) {
      eventoEncontrado = evOuData;
    }

    if (eventoEncontrado) {
      if (tituloModal) tituloModal.textContent = 'Editar Evento da Agenda';
      if (btnExcluir) {
        btnExcluir.classList.remove('hidden');
        btnExcluir.style.display = 'block';
      }
      if (idIn) idIn.value = eventoEncontrado.id || '';
      if (tituloIn) tituloIn.value = eventoEncontrado.titulo || '';
      if (dataInicioIn) dataInicioIn.value = eventoEncontrado.dataInicio || '';
      if (dataFimIn) dataFimIn.value = eventoEncontrado.dataFim || eventoEncontrado.dataInicio || '';
      if (horarioIn) horarioIn.value = eventoEncontrado.horario || '';
      if (setorIn && eventoEncontrado.setor) setorIn.value = eventoEncontrado.setor;
      if (catIn && eventoEncontrado.categoria) catIn.value = eventoEncontrado.categoria;
      if (localIn) localIn.value = eventoEncontrado.local || '';
      if (descIn) descIn.value = eventoEncontrado.descricao || '';
    } else {
      if (tituloModal) tituloModal.textContent = 'Novo Evento da Agenda Intersetorial';
      if (btnExcluir) {
        btnExcluir.classList.add('hidden');
        btnExcluir.style.display = 'none';
      }
      if (idIn) idIn.value = '';

      var dataPadrao = (typeof evOuData === 'string' && evOuData.match(/^\d{4}-\d{2}-\d{2}$/))
        ? evOuData
        : (selectedYear + '-' + padZero(selectedMonth + 1) + '-15');
      if (dataInicioIn) dataInicioIn.value = dataPadrao;
      if (dataFimIn) dataFimIn.value = dataPadrao;
      if (horarioIn) horarioIn.value = '09:00 - 11:30';
    }

    modal.classList.remove('hidden');
    modal.style.display = 'flex';
  }

  /**
   * Fecha o modal de formulário da agenda
   */
  function fecharModalFormAgenda() {
    var modal = document.getElementById('modalFormAgendaEvento');
    if (modal) {
      modal.classList.add('hidden');
      modal.style.display = 'none';
    }

    activeSector = setor || 'todos';
    var sel = document.getElementById('selectFiltroSetorCalendario');
    if (sel && sel.value !== activeSector) sel.value = activeSector;
