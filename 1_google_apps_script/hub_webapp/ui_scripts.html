// --- MODULE: js/setup_modal.js ---
/**
 * @fileoverview Modal Interativo de Configuração do Supabase (Zero Senhas Hardcoded).
 * Permite ao operador inserir a URL e Anon Key do Supabase ou alternar para modo contingência,
 * armazenando as preferências exclusivamente no localStorage do navegador.
 * Versão 2.0.0 — Projeto Olympos
 */

window.OlymposSetupModal = (function() {
  function getElements() {
    return {
      modal: document.getElementById('supabaseSetupModal'),
      form: document.getElementById('supabaseSetupForm'),
      inputUrl: document.getElementById('setupSupabaseUrl'),
      inputKey: document.getElementById('setupSupabaseAnonKey'),
      inputGas: document.getElementById('setupGasWebhookUrl'),
      btnTest: document.getElementById('testSupabaseConnectionBtn'),
      btnClose: document.getElementById('closeSetupModalBtn'),
      feedback: document.getElementById('setupModalFeedback')
    };
  }

  function abrirModal() {
    const el = getElements();
    if (!el.modal) return;

    // Preenche com os valores salvos no localStorage (se existirem)
    if (el.inputUrl) {
      el.inputUrl.value = localStorage.getItem('olympos_supabase_url') || '';
    }
    if (el.inputKey) {
      el.inputKey.value = localStorage.getItem('olympos_supabase_anon_key') || '';
    }
    if (el.inputGas) {
      el.inputGas.value = localStorage.getItem('olympos_api_url') || '';
    }

    if (el.feedback) {
      el.feedback.style.display = 'none';
      el.feedback.textContent = '';
    }

    el.modal.style.display = 'flex';
  }

  function fecharModal() {
    const el = getElements();
    if (el.modal) {
      el.modal.style.display = 'none';
    }
  }

  function exibirFeedback(mensagem, tipo) {
    const el = getElements();
    if (!el.feedback) return;

    el.feedback.style.display = 'block';
    el.feedback.textContent = mensagem;

    if (tipo === 'sucesso') {
      el.feedback.style.backgroundColor = 'rgba(16, 185, 129, 0.15)';
      el.feedback.style.color = '#10b981';
      el.feedback.style.border = '1px solid rgba(16, 185, 129, 0.3)';
    } else if (tipo === 'aviso') {
      el.feedback.style.backgroundColor = 'rgba(245, 158, 11, 0.15)';
      el.feedback.style.color = '#f59e0b';
      el.feedback.style.border = '1px solid rgba(245, 158, 11, 0.3)';
    } else {
      el.feedback.style.backgroundColor = 'rgba(239, 68, 68, 0.15)';
      el.feedback.style.color = '#ef4444';
      el.feedback.style.border = '1px solid rgba(239, 68, 68, 0.3)';
    }
  }

  function normalizeUrl(rawUrl) {
    return String(rawUrl || '')
      .trim()
      .replace(/\/+$/, '')
      .replace(/\/(rest|auth)\/v1(\/.*)?$/i, '');
  }

  async function testarConexao() {
    const el = getElements();
    const url = normalizeUrl(el.inputUrl ? el.inputUrl.value : '');
    if (el.inputUrl && url) {
      el.inputUrl.value = url;
    }
    const key = (el.inputKey ? el.inputKey.value : '').trim();

    if (!url || !url.startsWith('https://')) {
      exibirFeedback('Informe uma URL HTTPS válida para a instância Supabase.', 'erro');
      return;
    }
    if (!key || key.length < 20) {
      exibirFeedback('A chave anônima (anon public key) informada é inválida ou muito curta.', 'erro');
      return;
    }

    exibirFeedback('Testando conectividade com o Supabase...', 'aviso');

    try {
      const endpoint = url.replace(/\/$/, '') + '/rest/v1/';
      const response = await fetch(endpoint, {
        method: 'GET',
        headers: {
          'apikey': key,
          'Authorization': 'Bearer ' + key
        }
      });

      if (response.ok || response.status === 200 || response.status === 404 || response.status === 401) {
        // Se respondeu HTTP do PostgREST, endpoint é válido
        if (response.status === 401) {
          exibirFeedback('A URL respondeu, mas a chave Anon informada foi recusada (HTTP 401). Verifique a chave.', 'erro');
        } else {
          exibirFeedback('Conexão com o Supabase estabelecida com sucesso! (Status ' + response.status + ')', 'sucesso');
        }
      } else {
        exibirFeedback('Resposta inesperada da instância Supabase: HTTP ' + response.status, 'aviso');
      }
    } catch (err) {
      console.error('[OlymposSetupModal] Erro ao testar conexão:', err);
      exibirFeedback('Falha de rede ao conectar à URL informada: ' + err.message, 'erro');
    }
  }

  function salvarConfiguracao(e) {
    if (e && e.preventDefault) e.preventDefault();
    const el = getElements();

    const url = normalizeUrl(el.inputUrl ? el.inputUrl.value : '');
    if (el.inputUrl && url) {
      el.inputUrl.value = url;
    }
    const key = (el.inputKey ? el.inputKey.value : '').trim();
    const gas = (el.inputGas ? el.inputGas.value : '').trim();

    if (!url || !url.startsWith('https://')) {
      exibirFeedback('URL do Supabase inválida. Deve iniciar com https://', 'erro');
      return;
    }
    if (!key || key.length < 20) {
      exibirFeedback('A Chave Anônima do Supabase informada é inválida.', 'erro');
      return;
    }

    try {
      localStorage.setItem('olympos_supabase_url', url);
      localStorage.setItem('olympos_supabase_anon_key', key);
      if (gas) {
        localStorage.setItem('olympos_api_url', gas);
      }

      // Reinicializa o cliente Supabase forçando atualização de credenciais
      if (window.OlymposSupabase && typeof window.OlymposSupabase.init === 'function') {
        window.OlymposSupabase.init(true);
      }

      exibirFeedback('Configurações salvas no localStorage com sucesso!', 'sucesso');

      setTimeout(function() {
        fecharModal();
        if (window.OlymposApp && typeof window.OlymposApp.showToast === 'function') {
          window.OlymposApp.showToast('Instância Supabase configurada com sucesso!', 'success');
        }
      }, 700);
    } catch (err) {
      exibirFeedback('Erro ao salvar no localStorage: ' + err.message, 'erro');
    }
  }

  function bindEvents() {
    const el = getElements();

    if (el.btnClose) {
      el.btnClose.addEventListener('click', fecharModal);
    }
    if (el.btnTest) {
      el.btnTest.addEventListener('click', testarConexao);
    }
    if (el.form) {
      el.form.addEventListener('submit', salvarConfiguracao);
    }

    // Botão de abertura a partir da tela de login
    const btnOpenFromLogin = document.getElementById('openSetupModalFromLoginBtn');
    if (btnOpenFromLogin) {
      btnOpenFromLogin.addEventListener('click', abrirModal);
    }

    // Clique fora fecha o modal
    if (el.modal) {
      el.modal.addEventListener('click', function(e) {
        if (e.target === el.modal) {
          fecharModal();
        }
      });
    }
  }

  // Inicializa os bindings quando o DOM estiver pronto
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', bindEvents);
  } else {
    bindEvents();
  }

  return {
    abrirModal: abrirModal,
    fecharModal: fecharModal,
    testarConexao: testarConexao,
    salvarConfiguracao: salvarConfiguracao
  };
})();

 * Projeto Olympos — Secretaria Municipal de Educação Básica (SMEB de Ceará-Mirim/RN)
 * 
 * Implementa verificação k-Anonymity SHA-1 conforme RFC e documentação HaveIBeenPwned.org (v3 API)
 * e validação estrutural de complexidade de senhas baseada no NIST SP 800-63B.
 * 
 * Funciona nativamente no navegador sem expor a senha ou o hash completo para a rede.
 */
(function(global) {
  'use strict';

  /**
   * Converte uma string em hash SHA-1 hexadecimal (maiúsculo).
   * Utiliza a Web Crypto API (crypto.subtle) com fallback para ambiente Node.js se disponível.
   * @param {string} text 
   * @returns {Promise<string>}
   */
  async function sha1Hex(text) {
    if (typeof text !== 'string') {
      text = String(text || '');
    }

    // Suporte a Web Crypto API no navegador
    var cryptoObj = (typeof window !== 'undefined' && (window.crypto || window.msCrypto)) || 
                    (typeof global !== 'undefined' && global.crypto);

    if (cryptoObj && cryptoObj.subtle && typeof TextEncoder !== 'undefined') {
      var encoder = new TextEncoder();
      var data = encoder.encode(text);
      var hashBuffer = await cryptoObj.subtle.digest('SHA-1', data);
      var hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(function(b) {
        return b.toString(16).padStart(2, '0');
      }).join('').toUpperCase();
    }

    // Fallback para Node.js (execução de testes em backend)
    if (typeof require !== 'undefined') {
      try {
        var nodeCrypto = require('crypto');
        return nodeCrypto.createHash('sha1').update(text, 'utf8').digest('hex').toUpperCase();
      } catch (e) {
        // Fallback não disponível
      }
    }

    throw new Error('Ambiente criptográfico seguro (Web Crypto API) não disponível.');
  }

  /**
   * Consulta a API pública HaveIBeenPwned usando o modelo k-Anonymity (v3 Range API).
   * Envia apenas os primeiros 5 caracteres do hash SHA-1 da senha.
   * A senha em texto claro e o hash completo NUNCA trafegam pela rede.
   * 
   * @param {string} password Senha a ser verificada
   * @returns {Promise<{ leaked: boolean, breachCount: number, checked: boolean }>}
   */
  async function checkHaveIBeenPwned(password) {
    if (!password || typeof password !== 'string') {
      return { leaked: false, breachCount: 0, checked: false };
    }

    try {
      var fullHash = await sha1Hex(password);
      var prefix = fullHash.substring(0, 5);
      var suffix = fullHash.substring(5);

      var fetchFn = typeof fetch === 'function' ? fetch : (typeof window !== 'undefined' ? window.fetch : null);
      if (!fetchFn) {
        console.warn('[OlymposPasswordSecurity] Função fetch não disponível no ambiente.');
        return { leaked: false, breachCount: 0, checked: false };
      }

      var response = await fetchFn('https://api.pwnedpasswords.com/range/' + prefix, {
        method: 'GET',
        headers: {
          'Add-Padding': 'true' // Previne análise de tráfego por tamanho de pacote
        }
      });

      if (!response.ok) {
        console.warn('[OlymposPasswordSecurity] API HaveIBeenPwned indisponível (HTTP ' + response.status + '). Prosseguindo em modo defensivo.');
        return { leaked: false, breachCount: 0, checked: false };
      }

      var bodyText = await response.text();
      var lines = bodyText.split('\n');

      for (var i = 0; i < lines.length; i++) {
        var line = lines[i].trim();
        if (!line) continue;
        var parts = line.split(':');
        if (parts[0] && parts[0].toUpperCase() === suffix) {
          var count = parseInt(parts[1], 10) || 1;
          return { leaked: true, breachCount: count, checked: true };
        }
      }

      return { leaked: false, breachCount: 0, checked: true };
    } catch (err) {
      console.warn('[OlymposPasswordSecurity] Falha na verificação de vazamento HaveIBeenPwned:', err);
      // Fallback gracioso: não bloqueia o fluxo em caso de falha de conexão externa
      return { leaked: false, breachCount: 0, checked: false };
    }
  }

  /**
   * Valida os requisitos estruturais de complexidade de senha institucional recomendados pelo NIST SP 800-63B.
   * @param {string} password 
   * @returns {{ valid: boolean, errors: string[] }}
   */
  function validateComplexity(password) {
    var errors = [];
    if (!password || typeof password !== 'string' || password.length < 12) {
      errors.push('A senha deve possuir pelo menos 12 caracteres.');
    }
    if (!/[A-Z]/.test(password || '')) {
      errors.push('A senha deve conter ao menos uma letra maiúscula.');
    }
    if (!/[a-z]/.test(password || '')) {
      errors.push('A senha deve conter ao menos uma letra minúscula.');
    }
    if (!/[0-9]/.test(password || '')) {
      errors.push('A senha deve conter ao menos um número.');
    }
    if (!/[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?`~]/.test(password || '')) {
      errors.push('A senha deve conter ao menos um caractere especial (!@#$%...).');
    }

    return {
      valid: errors.length === 0,
      errors: errors
    };
  }

  var api = {
    sha1Hex: sha1Hex,
    checkHaveIBeenPwned: checkHaveIBeenPwned,
    validateComplexity: validateComplexity
  };

  // Exportação em ambiente de navegador
  if (typeof window !== 'undefined') {
    window.OlymposPasswordSecurity = api;
  }

  // Exportação em ambiente CommonJS / Node.js (testes unitários)
  if (typeof module !== 'undefined' && module.exports) {
    module.exports = api;
  }

  return api;
})(typeof window !== 'undefined' ? window : (typeof global !== 'undefined' ? global : this));

/**
 * @fileoverview Cliente de Inicialização Supabase com Proteção Contra Falhas (Resilience Layer).
 * Se as variáveis de ambiente/localStorage não estiverem configuradas,
 * exibe o Setup Modal amigavelmente sem travar ou emitir tela branca no navegador.
 * Versão 2.0.0 — Projeto Olympos
 */

window.OlymposSupabase = (function() {
  let supabaseInstance = null;
  let cachedProfile = null;
  let activeUrl = null;
  let activeKey = null;

  function normalizeSupabaseUrl(rawUrl) {
    return String(rawUrl || '')
      .trim()
      .replace(/\/+$/, '')
      .replace(/\/(rest|auth)\/v1(\/.*)?$/i, '');
  }

  const DEFAULT_PUBLIC_SUPABASE_URL = 'https://rbwizevjvbvjwtbwwyif.supabase.co';

  function getConfig() {
    let rawUrl = localStorage.getItem('olympos_supabase_url');
    if (!rawUrl) {
      rawUrl = DEFAULT_PUBLIC_SUPABASE_URL;
      try {
        localStorage.setItem('olympos_supabase_url', DEFAULT_PUBLIC_SUPABASE_URL);
      } catch (e) {}
    }
    const cleanUrl = normalizeSupabaseUrl(rawUrl);
    if (rawUrl && cleanUrl && rawUrl !== cleanUrl) {
      localStorage.setItem('olympos_supabase_url', cleanUrl);
    }
    return {
      url: cleanUrl,
      anonKey: (localStorage.getItem('olympos_supabase_anon_key') || '').trim()
    };
  }

  function isConfigured() {
    const cfg = getConfig();
    return Boolean(cfg.url && cfg.anonKey && cfg.url.startsWith('https://') && cfg.anonKey.length > 20);
  }

  function init(force) {
    const cfg = getConfig();

    if (!isConfigured()) {
      console.info('[OlymposSupabase] Inicialização em modo público. Credenciais de autenticação aguardando configuração via Setup Modal.');
      // Evita travar a página: aguarda o DOM e abre o Setup Modal de forma graciosa
      if (window.OlymposSetupModal && typeof window.OlymposSetupModal.abrirModal === 'function') {
        window.OlymposSetupModal.abrirModal();
      } else {
        setTimeout(function() {
          if (window.OlymposSetupModal && typeof window.OlymposSetupModal.abrirModal === 'function') {
            window.OlymposSetupModal.abrirModal();
          }
        }, 500);
      }
      return null;
    }

    if (!window.supabase) {
      console.error('[OlymposSupabase] A biblioteca Supabase JS (@supabase/supabase-js) não foi carregada pelo CDN.');
      return null;
    }

    // Padrão Singleton Estrito: Reutiliza instância ativa se URL e Chave forem idênticas
    if (supabaseInstance && !force && activeUrl === cfg.url && activeKey === cfg.anonKey) {
      return supabaseInstance;
    }

    // Se já havia instância ativa mas credenciais mudaram ou force=true, encerra auto-refresh anterior
    if (supabaseInstance && supabaseInstance.auth && typeof supabaseInstance.auth.stopAutoRefreshToken === 'function') {
      try {
        supabaseInstance.auth.stopAutoRefreshToken();
      } catch (eStop) {}
    }

    try {
      supabaseInstance = window.supabase.createClient(cfg.url, cfg.anonKey, {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      });
      activeUrl = cfg.url;
      activeKey = cfg.anonKey;
      console.log('[OlymposSupabase] Cliente Supabase inicializado com sucesso (Singleton).');

      // Escuta renovação automática de token e sincroniza sessão do app
      if (supabaseInstance.auth && typeof supabaseInstance.auth.onAuthStateChange === 'function') {
        supabaseInstance.auth.onAuthStateChange(function(event, session) {
          if (event === 'TOKEN_REFRESHED' && session && window.OlymposApp && typeof window.OlymposApp.atualizarTokenSessao === 'function') {
            window.OlymposApp.atualizarTokenSessao(session.access_token);
          }
        });
      }

      return supabaseInstance;
    } catch (err) {
      console.error('[OlymposSupabase] Erro ao instanciar createClient:', err);
      return null;
    }
  }

  function getClient() {
    if (!supabaseInstance) {
      init();
    }
    return supabaseInstance;
  }

  /**
   * Realiza login autenticado com e-mail institucional e senha no Supabase Auth.
   * @param {string} email
   * @param {string} password
   * @returns {Promise<Object>} Dados do usuário, sessão e perfil RBAC
   */
  async function login(email, password) {
    const client = getClient();
    if (!client) {
      if (window.OlymposSetupModal && typeof window.OlymposSetupModal.abrirModal === 'function') {
        window.OlymposSetupModal.abrirModal();
      }
      throw new Error('Supabase não está configurado. Por favor, configure a URL e a Chave Anônima.');
    }

    const cleanEmail = String(email || '').trim();
    const cleanPassword = String(password || '').trim();

    if (!cleanEmail || !cleanPassword) {
      throw new Error('Informe e-mail e senha para prosseguir.');
    }

    // Chamada oficial ao Supabase Auth GoTrue
    const { data, error } = await client.auth.signInWithPassword({
      email: cleanEmail,
      password: cleanPassword
    });

    if (error) {
      throw error;
    }

    // Carregar perfil associado na tabela public.profiles
    let profile = null;
    try {
      const { data: profData, error: profErr } = await client
        .from('profiles')
        .select('*')
        .eq('id', data.user.id)
        .maybeSingle();

      if (!profErr && profData) {
        profile = profData;
      }
    } catch (eProf) {
      console.warn('[OlymposSupabase] Aviso ao buscar perfil na tabela profiles:', eProf);
    }

    // Fallback de perfil via metadados do token se a tabela não tiver registro
    if (!profile) {
      const userMeta = data.user.user_metadata || {};
      const appMeta = data.user.app_metadata || {};
      profile = {
        id: data.user.id,
        email: data.user.email,
        full_name: userMeta.full_name || data.user.email,
        role: appMeta.role || 'RH_COMISSAO',
        department: userMeta.department || 'Secretaria Municipal de Educacao'
      };
    }

    cachedProfile = profile;

    // Cache RBAC de alta performance em sessionStorage para navegação veloz
    try {
      sessionStorage.setItem('olympos_rbac_profile_cache', JSON.stringify(profile));
      sessionStorage.setItem('olympos_session_rbac', JSON.stringify({
        user: data.user,
        profile: profile,
        role: profile.role,
        token: data.session ? data.session.access_token : null
      }));
    } catch (eStorage) {
      console.warn('[OlymposSupabase] Aviso ao persistir RBAC no sessionStorage:', eStorage);
    }

    return {
      user: data.user,
      session: data.session,
      profile: profile
    };
  }

  /**
   * Resgata perfil e claims RBAC em cache (memória ativa ou sessionStorage).
   */
  function getCachedProfile() {
    if (cachedProfile) return cachedProfile;
    try {
      const raw = sessionStorage.getItem('olympos_rbac_profile_cache');
      if (raw) {
        cachedProfile = JSON.parse(raw);
        return cachedProfile;
      }
    } catch (e) {
      console.warn('[OlymposSupabase] Falha ao ler cache RBAC do sessionStorage:', e);
    }
    return null;
  }

  /**
   * Encerra a sessão ativa no Supabase Auth.
   */
  async function logout() {
    const client = getClient();
    if (client) {
      try {
        await client.auth.signOut();
      } catch (e) {
        console.warn('[OlymposSupabase] Erro ao executar signOut:', e);
      }
    }
    cachedProfile = null;
    localStorage.removeItem('olympos_session');
    try {
      sessionStorage.removeItem('olympos_rbac_profile_cache');
      sessionStorage.removeItem('olympos_session_rbac');
    } catch (e) {}
  }

  /**
   * Resgata a sessão atual autenticada.
   */
  async function getSession() {
    const client = getClient();
    if (!client) return null;
    try {
      const { data } = await client.auth.getSession();
      return data ? data.session : null;
    } catch (e) {
      return null;
    }
  }

  /**
   * Resgata o JWT token de acesso da sessão atual.
   */
  async function getJwtToken() {
    const sess = await getSession();
    return (sess && sess.access_token) ? sess.access_token : null;
  }

  /**
   * Helper de busca semântica vetorial (pgvector) no acervo oficial.
   * Invoca a RPC 'match_publicacoes_semanticas' com threshold e count configuráveis.
   * Se o pgvector não estiver populado, se queryEmbedding for termo de texto ou se ocorrer erro na RPC,
   * executa fallback gracioso para busca textual padrão na tabela publicacoes_diario.
   *
   * @param {Array<number>|string} queryEmbedding - Vetor float 768 dimensões ou termo textual de consulta
   * @param {number} [threshold=0.65] - Limiar mínimo de similaridade de cosseno
   * @param {number} [count=10] - Limite máximo de publicações retornadas
   * @returns {Promise<Array<Object>>} Lista de publicações encontradas com similaridade
   */
  async function buscarPublicacoesSemanticas(queryEmbedding, threshold = 0.65, count = 10) {
    const client = getClient();
    if (!client) {
      console.warn('[OlymposSupabase] Cliente não inicializado para busca semântica.');
      return [];
    }

    // 1. Tentativa de busca vetorial se queryEmbedding for um vetor numérico válido
    if (Array.isArray(queryEmbedding) && queryEmbedding.length > 0) {
      try {
        const { data, error } = await client.rpc('match_publicacoes_semanticas', {
          query_embedding: queryEmbedding,
          match_threshold: threshold,
          match_count: count
        });

        if (!error && Array.isArray(data) && data.length > 0) {
          return data;
        }

        if (error) {
          console.warn('[OlymposSupabase] RPC match_publicacoes_semanticas retornou erro. Acionando fallback textual:', error.message);
        } else {
          console.info('[OlymposSupabase] Busca vetorial retornou 0 registros. Executando fallback.');
        }
      } catch (errRpc) {
        console.warn('[OlymposSupabase] Exceção na chamada RPC match_publicacoes_semanticas:', errRpc);
      }
    }

    // 2. Fallback gracioso para busca textual na tabela publicacoes_diario
    try {
      let query = client
        .from('publicacoes_diario')
        .select('id, data_publicacao, edicao, titulo, ato_tipo, servidores_envolvidos, conteudo_ner')
        .order('data_publicacao', { ascending: false })
        .limit(count);

      if (typeof queryEmbedding === 'string' && queryEmbedding.trim()) {
        const term = queryEmbedding.trim();
        query = query.or(`titulo.ilike.%${term}%,ato_tipo.ilike.%${term}%`);
      }

      const { data: textData, error: textErr } = await query;
      if (!textErr && Array.isArray(textData)) {
        return textData.map(function(item) {
          return Object.assign({}, item, {
            similarity: 1.0,
            fallback_textual: true
          });
        });
      }
    } catch (errFallback) {
      console.warn('[OlymposSupabase] Falha ao executar fallback textual:', errFallback);
    }

    return [];
  }

  // =========================================================================
  // PERSISTÊNCIA: ESCOLAS MUNICIPAIS DE CEARÁ-MIRIM
  // =========================================================================
  // PERSISTÊNCIA: ESCOLAS MULTI-REDE E MULTI-SEGMENTOS
  // =========================================================================

  function normalizarCategoriaInstitucional(cat, nome) {
    var c = String(cat || '').trim();
    var cLow = c.toLowerCase();
    var nLow = String(nome || '').trim().toLowerCase();

    if (c === 'Instituição' || cLow.includes('institui') || cLow.includes('sede') || nLow.includes('smeb sede') || nLow.includes('secretaria') || nLow.includes('ifrn')) {
      return 'Instituição';
    }
    if (
      c === 'Centro de Educação Infantil' ||
      c === 'Educação Infantil' ||
      c === 'Educação Infantil (CEI)' ||
      cLow === 'cei' ||
      cLow === 'cmei' ||
      cLow === 'creche' ||
      /^c\.?e\.?i\.?\b/i.test(nLow) ||
      /^cmei\b/i.test(nLow) ||
      nLow.includes('centro de educação infantil')
    ) {
      return 'Centro de Educação Infantil';
    }
    return 'Escola';
  }

  function normalizarEscola(e) {
    if (!e) return e;
    var redeValida = ['Municipal', 'Estadual', 'Federal', 'Privada'].includes(e.rede) ? e.rede : 'Municipal';
    var categoriaInstitucional = normalizarCategoriaInstitucional(e.categoria, e.nome);
    var segmentos = Array.isArray(e.segmentos) && e.segmentos.length > 0 ? e.segmentos : null;
    if (!segmentos) {
      if (categoriaInstitucional === 'Centro de Educação Infantil') {
        segmentos = ['Ed. Infantil'];
      } else if (categoriaInstitucional === 'Instituição') {
        segmentos = ['Sede Administrativa'];
      } else {
        segmentos = ['Ens. Fundamental I', 'Ens. Fundamental II'];
      }
    }

    var zonaValida = e.zona || 'Urbana';
    var corPadrao = '#38BDF8';
    var iconePadrao = 'U';
    if (redeValida === 'Estadual') {
      corPadrao = '#2563EB';
      iconePadrao = '🏛';
    } else if (redeValida === 'Federal') {
      corPadrao = '#16A34A';
      iconePadrao = '🎓';
    } else if (redeValida === 'Privada') {
      corPadrao = '#9333EA';
      iconePadrao = '⭐';
    } else if (categoriaInstitucional === 'Instituição') {
      corPadrao = '#D4AF37';
      iconePadrao = '★';
    } else if (categoriaInstitucional === 'Centro de Educação Infantil') {
      corPadrao = '#F59E0B';
      iconePadrao = 'C';
    } else if (String(zonaValida).toLowerCase() === 'rural') {
      corPadrao = '#10B981';
      iconePadrao = 'R';
    }

    var iconeFinal = e.icone || iconePadrao;
    var corFinal = e.cor || corPadrao;
    // Corrige caso legado onde uma Escola recebeu indevidamente símbolo 'C' de CEI por ofertar Ed. Infantil
    if (categoriaInstitucional === 'Escola' && iconeFinal === 'C') {
      iconeFinal = iconePadrao;
      corFinal = corPadrao;
    }

    return {
      id: e.id,
      nome: e.nome,
      inep: e.inep || '',
      rede: redeValida,
      segmentos: segmentos,
      categoria: categoriaInstitucional,
      zona: zonaValida,
      bairroDistrito: e.bairroDistrito || e.bairro_distrito || '',
      endereco: e.endereco || '',
      lat: typeof e.lat === 'number' ? e.lat : parseFloat(e.latitude || 0),
      lng: typeof e.lng === 'number' ? e.lng : parseFloat(e.longitude || 0),
      turnos: Array.isArray(e.turnos) ? e.turnos : ['Matutino', 'Vespertino'],
      telefone: e.telefone || '',
      diretor: e.diretor || '',
      cor: corFinal,
      icone: iconeFinal,
      status: e.status || 'ATIVA'
    };
  }

  async function carregarEscolas() {
    const client = getClient();
    if (client) {
      try {
        const { data, error } = await client
          .from('escolas')
          .select('*')
          .order('id');
        if (!error && Array.isArray(data) && data.length > 0) {
          const adaptadas = data.map(normalizarEscola);
          try {
            localStorage.setItem('olympos_escolas_municipais', JSON.stringify(adaptadas));
          } catch (eStorage) {}
          return adaptadas;
        }

        // Fallback secundário: carrega arquivo JSON estruturado em public.catalogos_json
        const { data: catDoc, error: catErr } = await client
          .from('catalogos_json')
          .select('conteudo')
          .eq('chave', 'escolas_ceara_mirim')
          .maybeSingle();
        if (!catErr && catDoc && Array.isArray(catDoc.conteudo) && catDoc.conteudo.length > 0) {
          const adaptadasJson = catDoc.conteudo.map(normalizarEscola);
          try {
            localStorage.setItem('olympos_escolas_municipais', JSON.stringify(adaptadasJson));
          } catch (eStoreJson) {}
          return adaptadasJson;
        }
      } catch (err) {
        console.warn('[OlymposSupabase] Falha ao carregar escolas do Supabase. Utilizando cache local:', err);
      }
    }
    // Fallback offline com normalização
    try {
      const cached = localStorage.getItem('olympos_escolas_municipais');
      if (cached) {
        const parsed = JSON.parse(cached);
        if (Array.isArray(parsed) && parsed.length > 0) {
          return parsed.map(normalizarEscola);
        }
      }
    } catch (eCache) {}
    return (window.BANCO_SEMENTE_ESCOLAS || []).map(normalizarEscola);
  }

  async function sincronizarCatalogoEscolasJson(listaEscolas) {
    if (!Array.isArray(listaEscolas)) return false;
    const client = getClient();
    if (!client) return false;
    const sess = await getSession();
    if (!sess) return false;

    const normalizadas = listaEscolas.map(normalizarEscola);
    try {
      const { error } = await client.from('catalogos_json').upsert({
        chave: 'escolas_ceara_mirim',
        descricao: 'Catálogo JSON georreferenciado oficial das Escolas, CEIs e Instituições de Ceará-Mirim/RN',
        versao: 2,
        conteudo: normalizadas
      });
      if (error) {
        console.warn('[OlymposSupabase] Aviso ao atualizar catalogos_json no Supabase:', error);
        return false;
      }
      return true;
    } catch (e) {
      console.warn('[OlymposSupabase] Exceção ao sincronizar catalogos_json:', e);
      return false;
    }
  }

  async function sincronizarEscola(escola) {
    if (!escola || !escola.id) return false;
    const client = getClient();
    if (client) {
      const sess = await getSession();
      if (!sess) {
        console.info('[OlymposSupabase] Escola salva localmente (autentique-se no Supabase para sincronizar na nuvem).');
        return false;
      }
      const normalizada = normalizarEscola(escola);
      const payload = {
        id: normalizada.id,
        inep: normalizada.inep || '',
        nome: normalizada.nome,
        rede: normalizada.rede,
        segmentos: normalizada.segmentos,

/**
 * Hub Olympos V2 — Camada Modular de API (Dual-Front: GitHub Pages HTTP + GAS Nativo)
 * Integrado ao Supabase JWT e validação de sessão segura.
 * Versão 2.0.3 — Projeto Olympos (Release V2.03)
 */
window.OlymposApi = (function() {
  const DEFAULT_API_URL = 'https://script.google.com/macros/s/AKfycbw-zKUdYJO6Zw1_XHo12a49p2wpgNtfii-2CJOq1838f6S1-L0SYM6iI9A2PS2ZPjYdmQ/exec';

  // IDs de implantações antigas/revogadas que retornam HTTP 404 HTML sem cabeçalho CORS
  const REVOKED_DEPLOYMENT_IDS = [
    'AKfycbwM8M-L4QzDmsT3SGSUyuAAwwYri5McqL6HI2AGutVd7ZzXn5mQMfZj1O4eBs-ci2Ub7Q'
  ];

  function isRevokedOrInvalidUrl(url) {
    if (!url || typeof url !== 'string' || !url.startsWith('https://')) return true;
    for (let i = 0; i < REVOKED_DEPLOYMENT_IDS.length; i++) {
      if (url.includes(REVOKED_DEPLOYMENT_IDS[i])) return true;
    }
    return false;
  }

  function sanitizeStoredApiUrl() {
    try {
      const savedA = localStorage.getItem('olympos_api_url');
      const savedB = localStorage.getItem('olympos_gas_api_url');
      if (savedA && isRevokedOrInvalidUrl(savedA)) {
        localStorage.setItem('olympos_api_url', DEFAULT_API_URL);
      }
      if (savedB && isRevokedOrInvalidUrl(savedB)) {
        localStorage.setItem('olympos_gas_api_url', DEFAULT_API_URL);
      }
    } catch (e) {}
  }

  sanitizeStoredApiUrl();

  function getApiUrl() {
    sanitizeStoredApiUrl();
    return localStorage.getItem('olympos_api_url') || localStorage.getItem('olympos_gas_api_url') || DEFAULT_API_URL;
  }

  function setApiUrl(url) {
    if (!url || !url.startsWith('https://')) {
      throw new Error('A URL da API deve começar com https://');
    }
    const clean = isRevokedOrInvalidUrl(url.trim()) ? DEFAULT_API_URL : url.trim();
    localStorage.setItem('olympos_api_url', clean);
    localStorage.setItem('olympos_gas_api_url', clean);
  }

  function getSession() {
    try {
      const s = localStorage.getItem('olympos_session');
      return s ? JSON.parse(s) : null;
    } catch (e) {
      return null;
    }
  }

  function getJwtToken() {
    const session = getSession();
    if (session) {
      if (session.access_token) return session.access_token;
      if (session.token) return session.token;
      if (session.session && session.session.access_token) return session.session.access_token;
    }
    return null;
  }

  function processarResposta(data, onSuccess, onError) {
    if (data && data.code === 'AUTH_REQUIRED') {
      if (window.OlymposApp && typeof window.OlymposApp.solicitarLogin === 'function') {
        window.OlymposApp.solicitarLogin();
      }
      if (onError) onError(new Error(data.mensagem || 'Sessão expirada. Faça login novamente via Supabase.'));
      return;
    }
    if (onSuccess) onSuccess(data);
  }

  function chamar(action, payload, onSuccess, onError) {
    const token = getJwtToken();
    const bodyData = Object.assign({}, payload || {}, {
      action: action,
      token: token,
      _token: token,
      sessionToken: token,
      jwtToken: token
    });

    // Frente 1: Execução embarcada no Google Apps Script (HtmlService)
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(data) {
          processarResposta(data, onSuccess, onError);
        })
        .withFailureHandler(function(err) {
          console.error('Erro google.script.run [' + action + ']:', err);
          if (onError) onError(err);
        })
        .executarAcaoHubClient(bodyData);
      return;
    }

    // Frente 2: Execução desacoplada via GitHub Pages / HTTP Fetch
    // Protocolo estrito de CORS Simple Request:
    // 1. Método POST
    // 2. Content-Type: text/plain;charset=utf-8 (evita preflight OPTIONS no GAS)
    // 3. ZERO headers de autorização HTTP (token trafega no corpo JSON)
    // 4. redirect: 'follow' explícito para redirecionamentos do script.googleusercontent.com
    const url = getApiUrl();
    const fetchOpts = {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(bodyData),
      redirect: 'follow'
    };

    fetch(url, fetchOpts)
      .catch(function(firstErr) {
        if (url !== DEFAULT_API_URL) {
          try {
            localStorage.setItem('olympos_api_url', DEFAULT_API_URL);
            localStorage.setItem('olympos_gas_api_url', DEFAULT_API_URL);
          } catch (e) {}
          return fetch(DEFAULT_API_URL, fetchOpts);
        }
        throw firstErr;
      })
      .then(function(res) {
        if (!res.ok) {
          throw new Error('Falha HTTP ' + res.status + ': ' + (res.statusText || 'Erro no Gateway'));
        }
        return res.text();
      })
      .then(function(text) {
        let data;
        try {
          data = JSON.parse(text);
        } catch (e) {
          throw new Error('Resposta não-JSON do Gateway GAS: ' + (text ? text.substring(0, 100) : 'vazio'));
        }
        processarResposta(data, onSuccess, onError);
      })
      .catch(function(err) {
        console.warn('Erro de rede/Gateway [' + action + ']:', err.message);
        if (onError) onError(err);
      });
  }

  function testarConexao(onResult) {
    const start = performance.now();

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(data) {
          if (typeof onResult === 'function') {
            onResult({
              ok: true,
              latency: Math.round(performance.now() - start),
              data: data || { sistema: 'Hub Olympos GAS Nativo', versao: '2.0.3' }
            });
          }
        })
        .withFailureHandler(function(err) {
          if (typeof onResult === 'function') {
            onResult({ ok: false, error: err.message });
          }
        })
        .executarAcaoHubClient({ action: 'ping', api: '1', token: '' });
      return;
    }

    const url = getApiUrl();
    const token = getJwtToken();
    const pingPayload = {
      action: 'ping',
      api: '1',
      token: token,
      _token: token
    };
    const pingOpts = {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(pingPayload),
      redirect: 'follow'
    };

    fetch(url, pingOpts)
      .catch(function(firstErr) {
        if (url !== DEFAULT_API_URL) {
          try {
            localStorage.setItem('olympos_api_url', DEFAULT_API_URL);
            localStorage.setItem('olympos_gas_api_url', DEFAULT_API_URL);
          } catch (e) {}
          return fetch(DEFAULT_API_URL, pingOpts);
        }
        throw firstErr;
      })
      .then(function(res) {
        if (!res.ok) {
          throw new Error('Falha HTTP ' + res.status + ' (' + (res.statusText || 'Offline') + ')');
        }
        return res.text();
      })
      .then(function(text) {
        let data;
        try {
          data = JSON.parse(text);
        } catch (e) {
          throw new Error('Resposta HTML ou não-JSON recebida. Verifique a implantação pública do Apps Script.');
        }
        const latency = Math.round(performance.now() - start);
        if (typeof onResult === 'function') {
          onResult({ ok: true, latency: latency, data: data });
        }
      })
      .catch(function(err) {
        if (typeof onResult === 'function') {
          onResult({ ok: false, error: err.message || 'Gateway offline ou inacessível' });
        }
      });
  }

  /**
   * Atualiza o conteúdo Markdown de uma memória existente no Google Drive via Gateway GAS.
   * Modifica in-place sem gerar duplicatas no Drive.
   * @param {string} arquivo Nome do arquivo canônico (ex: _memoria_hera.md).
   * @param {string} conteudo Texto consolidado em Markdown.
   * @param {Function} [onSuccess] Callback de sucesso.
   * @param {Function} [onError] Callback de erro.
   */
  function salvarMemoria(arquivo, conteudo, onSuccess, onError) {
    return chamar('memorias_salvar', {
      arquivo: arquivo,
      conteudo: conteudo
    }, onSuccess, onError);
  }

  /**
   * Provisiona novo usuário administrativo através do Gateway GAS intermediando o Supabase Auth.
   * Suporta tanto padrão assíncrono via Promise quanto callbacks tradicionais (onSuccess, onError).
   * @param {Object} dados Dados cadastrais { email, nome, role, departamento, senhaTemporaria }.
   * @param {Function} [onSuccess] Callback de sucesso.
   * @param {Function} [onError] Callback de erro.
   * @returns {Promise<Object>}
   */
  function criarUsuario(dados, onSuccess, onError) {
    return new Promise(function(resolve, reject) {
      chamar('usuario_criar', { dados: dados }, function(res) {
        if (onSuccess) onSuccess(res);
        resolve(res);
      }, function(err) {
        if (onError) onError(err);
        reject(err);
      });
    });
  }

  return {
    getApiUrl: getApiUrl,
    setApiUrl: setApiUrl,
    DEFAULT_API_URL: DEFAULT_API_URL,
    getSession: getSession,
    getJwtToken: getJwtToken,
    chamar: chamar,
    criarUsuario: criarUsuario,
    salvarMemoria: salvarMemoria,
    testarConexao: testarConexao
  };
})();

      pageId = 'portarias';
      targetSubtab = 'licencas';
    }

    if (!PAGES[pageId]) {
      pageId = 'visao-geral';
    }

    activePage = pageId;
    if (window.location.hash !== '#' + pageId) {
      if (replaceState) {
        window.history.replaceState(null, '', '#' + pageId);
      } else {
        suppressNextHashChange = true;
        window.location.hash = '#' + pageId;
      }
    }

    document.querySelectorAll('.page-view').forEach(function(view) {
      const isTarget = view.id === 'page-' + pageId;
      view.classList.toggle('active', isTarget);
      view.classList.toggle('hidden', !isTarget);
    });

    document.querySelectorAll('.nav-link').forEach(function(link) {
      const linkPage = link.getAttribute('data-page');
      if (linkPage) {
        link.classList.toggle('active', linkPage === pageId);
      }
    });

    // Destaque ativo para container e trigger do dropdown Documentos
    const isDocPage = ['oficios', 'portarias', 'certificados'].includes(pageId);
    document.querySelectorAll('.nav-dropdown').forEach(function(dd) {
      dd.classList.toggle('active', isDocPage);
    });
    document.querySelectorAll('.nav-dropdown-trigger').forEach(function(trigger) {
      trigger.classList.toggle('active', isDocPage);
    });

    // Fechar dropdowns de navegação ao navegar
    if (window.OlymposApp && typeof window.OlymposApp.fecharDropdowns === 'function') {
      window.OlymposApp.fecharDropdowns();
    }

    const meta = PAGES[pageId];
    const eyebrowElem = document.getElementById('pageHeaderEyebrow');
    const titleElem = document.getElementById('pageHeaderTitle');
    const subtitleElem = document.getElementById('pageHeaderSubtitle');

    if (eyebrowElem) eyebrowElem.textContent = meta.eyebrow;
    if (titleElem) titleElem.textContent = meta.title;
    if (subtitleElem) subtitleElem.textContent = meta.subtitle;

    document.body.classList.remove('nav-drawer-open');
    window.scrollTo({ top: 0, behavior: 'smooth' });

    if (pageId === 'portarias') {
      if (window.OlymposViews && window.OlymposViews.portarias && typeof window.OlymposViews.portarias.alternarSubtab === 'function') {
        window.OlymposViews.portarias.alternarSubtab(targetSubtab || 'lote');
      }
    }

    dispararCarregamentoPagina(pageId);
  }

  function dispararCarregamentoPagina(pageId) {
    if (!window.OlymposViews) return;
    const map = {
      'visao-geral': 'visaoGeral',
      'oficios': 'oficios',
      'portarias': 'portarias',
      'licencas': 'licencas',
      'certificados': 'certificados',
      'diario-oficial': 'diarioOficial',
      'papiro-cadmo': 'papiroCadmo',
      'escolas': 'escolas',
      'calendario': 'calendario',
      'personas': 'personas',
      'busca': 'busca',
      'configuracoes': 'configuracoes'
    };
    const key = map[pageId];
    if (key && window.OlymposViews[key] && typeof window.OlymposViews[key].init === 'function') {
      window.OlymposViews[key].init();
    }
    if (pageId === 'portarias' && window.OlymposViews.licencas && typeof window.OlymposViews.licencas.init === 'function') {
      window.OlymposViews.licencas.init();
    }
  }

  function getPaginaAtual() {
    return activePage;
  }

  return {
    init: init,
    navegarPara: navegarPara,
    getPaginaAtual: getPaginaAtual,
    PAGES: PAGES
  };
})();


// --- MODULE: js/views/visaoGeral.js ---
/**
 * Hub Olympos V2.1 — Página Modular 1: Visão Geral do Gabinete + Constelação das 17 Personas
 */
window.OlymposViews = window.OlymposViews || {};

window.OlymposViews.visaoGeral = (function() {
  let isLoaded = false;
  let lastOverviewData = null;

  function init() {
    bindEvents();
    renderizarConstelacao17Personas(lastOverviewData ? lastOverviewData.memorias : null);
    if (!isLoaded) {
      carregarDados();
    }
  }

  function bindEvents() {
    const bindClick = function(id, fn) {
      const el = document.getElementById(id);
      if (el && !el._bound) {
        el._bound = true;
        el.addEventListener('click', fn);
      }
    };

    bindClick('copyOficioBtn', function() {
      window.OlymposApp.copiarKpi('kpiProximoOficio', 'Próximo Ofício 2026');
    });
    bindClick('copyPortariaBtn', function() {
      window.OlymposApp.copiarKpi('kpiProximaPortaria', 'Próxima Portaria 2026');
    });
    bindClick('reserveOficioBtn', function() { reservarNumero('OFICIO'); });
    bindClick('reservePortariaBtn', function() { reservarNumero('PORTARIA'); });
    bindClick('editOficioBtn', function() { window.OlymposApp.abrirModalContadores(); });
    bindClick('editPortariaBtn', function() { window.OlymposApp.abrirModalContadores(); });
  }

  function carregarDados() {
    // Verifica se há sessão institucional ou token configurado antes de chamar endpoint protegido
    const sessao = (window.OlymposApp && typeof window.OlymposApp.getSession === 'function')
      ? window.OlymposApp.getSession()
      : null;
    const jwtToken = (window.OlymposApi && typeof window.OlymposApi.getJwtToken === 'function')
      ? window.OlymposApi.getJwtToken()
      : null;

    // Se não há sessão autenticada, renderiza o catálogo local das 17 personas sem emitir erro de rede
    if (!sessao && !jwtToken) {
      renderizarConstelacao17Personas(lastOverviewData ? lastOverviewData.memorias : null);
      return;
    }

    window.OlymposApi.chamar('overview_get', {}, function(res) {
      const data = (res && res.data) ? res.data : res;
      if (data && (data.numeracao || data.memorias)) {
        lastOverviewData = data;
        atualizarKpis(data);
        renderizarConstelacao17Personas(data.memorias || []);
        isLoaded = true;
      }
    }, function(err) {
      // Degradação graciosa para catálogo local sem poluir o console com advertências
      renderizarConstelacao17Personas(lastOverviewData ? lastOverviewData.memorias : null);
    });
  }

  function atualizarKpis(data) {
    if (!data) return;

    if (data.numeracao) {
      const n = data.numeracao;
      const ofVal = (n.proximoOficio2026 !== undefined && n.proximoOficio2026 !== null)
        ? n.proximoOficio2026
        : ((n.proximoOficio !== undefined && n.proximoOficio !== null) ? n.proximoOficio : null);
      const ptVal = (n.proximaPortaria2026 !== undefined && n.proximaPortaria2026 !== null)
        ? n.proximaPortaria2026
        : ((n.proximaPortaria !== undefined && n.proximaPortaria !== null) ? n.proximaPortaria : null);
      const ultOf = (n.ultimoOficio2026 !== undefined && n.ultimoOficio2026 !== null)
        ? n.ultimoOficio2026
        : (ofVal !== null ? (ofVal - 1) : null);
      const ultPt = (n.ultimaPortaria2026 !== undefined && n.ultimaPortaria2026 !== null)
        ? n.ultimaPortaria2026
        : (ptVal !== null ? (ptVal - 1) : null);
      const memUrl = n.arquivoUrl || 'https://drive.google.com/file/d/1DOt17v7gf3WD_380rYNnFX0j3IdWZaH_/view';

      const elOf = document.getElementById('kpiProximoOficio');
      const elUltOf = document.getElementById('kpiUltimoOficio');
      const elPt = document.getElementById('kpiProximaPortaria');
      const elUltPt = document.getElementById('kpiUltimaPortaria');

      if (elOf) elOf.textContent = ofVal !== null ? ('Nº ' + ofVal) : '--';
      if (elUltOf) {
        elUltOf.innerHTML = '<span>Último emitido: ' + (ultOf !== null ? ('Nº ' + ultOf) : '--') + '</span>' +
          '<a href="' + window.OlymposApp.escapeHtml(memUrl) + '" target="_blank" rel="noopener" class="folder-chip">Memória de Apolo ↗</a>';
      }

      if (elPt) elPt.textContent = ptVal !== null ? ('Nº ' + ptVal) : '--';
      if (elUltPt) {
        elUltPt.innerHTML = '<span>Última emitida: ' + (ultPt !== null ? ('Nº ' + ultPt) : '--') + '</span>' +
          '<a href="' + window.OlymposApp.escapeHtml(memUrl) + '" target="_blank" rel="noopener" class="folder-chip">Memória de Apolo ↗</a>';
      }

      const inOf = document.getElementById('inputProximoOficioMd');
      const inPt = document.getElementById('inputProximaPortariaMd');
      const inSig = document.getElementById('inputSignatarioMd');
      if (inOf && ofVal !== null) inOf.value = ofVal;
      if (inPt && ptVal !== null) inPt.value = ptVal;
      if (inSig && (n.signatarioTitular || n.signatario)) {
        inSig.value = n.signatarioTitular || n.signatario;
      }

      const inputOficioForm = document.getElementById('oficioNumeroInput');
      if (inputOficioForm && !inputOficioForm.value && ofVal !== null) {
        inputOficioForm.value = String(ofVal);
      }
    }

    const cota = data.cotaEmailRestante !== undefined ? data.cotaEmailRestante : data.cotaEmail;
    if (cota !== undefined) {
      const elCota = document.getElementById('kpiCotaEmail');
      if (elCota) elCota.textContent = cota + ' envios';
    }

    if (data.statusPrometheus) {
      const meta = document.getElementById('kpiPrometheusMeta');
      if (meta && data.statusPrometheus.ultimaExecucao) {
        meta.textContent = 'Fogo de Prometheus: ' + data.statusPrometheus.ultimaExecucao;
      }
    }
  }

  function renderizarConstelacao17Personas(memoriasLive) {
    const container = document.getElementById('homePersonasConstellation');
    if (!container || !window.OlymposIcons) return;

    const catalogo = window.OlymposIcons.getCatalogo17Personas();
    const mapaLive = {};
    (memoriasLive || []).forEach(function(m) {
      if (m.arquivo) mapaLive[m.arquivo] = m;
    });

    container.innerHTML = '';
    catalogo.forEach(function(p) {
      const live = p.arquivo ? mapaLive[p.arquivo] : null;
      const isHost = p.tipo === 'anfitriao';
      const svg = window.OlymposIcons.get(p.id);
      const linhasInfo = live && live.totalLinhas !== undefined
        ? (live.totalLinhas + ' / 60 linhas • ' + p.arquivo)
        : (isHost ? ('Anfitriã: ' + p.anfitriao) : p.arquivo);

      const tile = document.createElement('div');
      tile.className = 'home-persona-tile';
      tile.title = 'Clique para abrir ' + p.nome + ' na página Personas & Memórias';
      tile.innerHTML =
        '<div class="persona-emblem ' + (isHost ? 'is-host-routed' : '') + '" aria-hidden="true">' + svg + '</div>' +
        '<div class="home-persona-info">' +
          '<div class="home-persona-top">' +
            '<span class="home-persona-name">' + window.OlymposApp.escapeHtml(p.nome) + '</span>' +
            '<span class="home-persona-layer">' + window.OlymposApp.escapeHtml(p.camada) + '</span>' +
          '</div>' +
          '<div class="home-persona-domain">' + window.OlymposApp.escapeHtml(p.dominio) + '</div>' +
          '<div class="home-persona-meta">' + window.OlymposApp.escapeHtml(linhasInfo) + '</div>' +
        '</div>';

      tile.addEventListener('click', function() {
        window.OlymposRouter.navegarPara('personas');
        const filtro = document.getElementById('memoriaSearchInput');
        if (filtro) {
          filtro.value = p.nome;
          filtro.dispatchEvent(new Event('input'));
        }
      });

      container.appendChild(tile);
    });
  }

  function reservarNumero(tipo) {
    const desc = prompt('Informe a finalidade/destinatário para reservar o próximo ' + tipo + ' em _memoria_apolo.md:', 'Emissão pelo Gabinete SMEB');
    if (!desc) return;

    window.OlymposApi.chamar('reservar_numero_md', { tipo: tipo, detalhe: desc }, function(res) {
      if (res && res.ok) {
        const codigo = res.numeroFormatado || res.codigoOficial || (res.numeroReservado + '/2026');
        window.OlymposApp.showToast(tipo + ' reservado: Nº ' + codigo + ' (Próximo: ' + res.proximoDisponivel + ')');
        carregarDados();
      } else {
        window.OlymposApp.showToast((res && res.mensagem) || 'Falha ao reservar número.', true);
      }
    }, function(err) {
      window.OlymposApp.showToast('Erro ao reservar número: ' + err.message, true);
    });
  }

  return {
    init: init,
    recarregar: carregarDados,
    getLastOverviewData: function() { return lastOverviewData; }
  };
})();

/**
 * Hub Olympos V2.1 — Página Modular 2: Emissão de Ofícios (Padrão PR/2018)
 */
window.OlymposViews = window.OlymposViews || {};

window.OlymposViews.oficios = (function() {
  function init() {
    bindEvents();
    sugerirProximoNumero();
  }

  function bindEvents() {
    const btnGerar = document.getElementById('gerarOficioRapidoBtn');
    if (btnGerar && !btnGerar._bound) {
      btnGerar._bound = true;
      btnGerar.addEventListener('click', handleGerarOficio);
    }
  }

  function sugerirProximoNumero() {
    const kpiElem = document.getElementById('kpiProximoOficio');
    const inputNumero = document.getElementById('oficioNumeroInput');
    if (kpiElem && inputNumero) {
      if (kpiElem.textContent.includes('--')) {
        inputNumero.value = '';
        inputNumero.placeholder = 'Carregando...';
      } else {
        const match = kpiElem.textContent.match(/\d+/);
        if (match) inputNumero.value = match[0];
      }
    }
  }

  function handleGerarOficio() {
    const numero = document.getElementById('oficioNumeroInput').value.trim();
    const destinatario = document.getElementById('oficioDestinatarioInput').value.trim();
    const assunto = document.getElementById('oficioAssuntoInput').value.trim();
    const corpo = document.getElementById('oficioCorpoInput').value.trim();
    const fecho = document.getElementById('oficioFechoSelect').value;
    const btn = document.getElementById('gerarOficioRapidoBtn');
    const outBox = document.getElementById('oficioRapidoOutput');

    if (!destinatario || !assunto) {
      window.OlymposApp.showToast('Preencha ao menos o Destinatário e o Assunto do Ofício.', true);
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Gerando Ofício no Google Docs...';
    outBox.classList.add('hidden');

    window.OlymposApi.chamar('oficio_emitir', {
      numero: numero,
      destinatario: destinatario,
      assunto: assunto,
      corpo: corpo,
      fecho: fecho
    }, function(res) {
      btn.disabled = false;
      btn.textContent = 'Emitir Ofício no Google Docs';

      const urlFinal = res && (res.url || res.urlArquivo);
      if (res && res.ok && urlFinal) {
        window.OlymposApp.showToast('Ofício Nº ' + res.numero + '/2026 emitido com sucesso!');

        const checkSvg = window.OlymposIcons ? window.OlymposIcons.ui('check') : '✓';
        outBox.innerHTML =
          '<div class="job-result-header">' +
            '<div class="job-result-title">' +
              '<span class="job-done-badge">' + checkSvg + '</span>' +
              '<span>Finalização Confirmada — Ofício Nº ' + window.OlymposApp.escapeHtml(res.numero) + '/2026 - GS/SMEB</span>' +
            '</div>' +
          '</div>' +
          '<div style="font-size: 13.5px; color: var(--text-secondary);">' +
            'Expediente salvo na pasta <strong>Ofícios 2026</strong> e numeração atualizada em <code>_memoria_apolo.md</code>.' +
          '</div>' +
          '<div class="job-links-list" id="oficioGeneratedList"></div>';

        outBox.classList.remove('hidden');
        window.OlymposApp.renderizarItensLinksGerados(
          document.getElementById('oficioGeneratedList'),
          [{
            titulo: res.nomeArquivo || ('Ofício Nº ' + res.numero + '/2026 - GS/SMEB'),
            detalhe: destinatario + ' • ' + assunto,
            url: urlFinal
          }]
        );

        document.getElementById('oficioDestinatarioInput').value = '';
        document.getElementById('oficioAssuntoInput').value = '';
        document.getElementById('oficioCorpoInput').value = '';
        if (res.numero) {
          const prox = parseInt(String(res.numero), 10) + 1;
          if (!isNaN(prox)) document.getElementById('oficioNumeroInput').value = String(prox);
        }
        if (window.OlymposViews && window.OlymposViews.visaoGeral) {
          window.OlymposViews.visaoGeral.recarregar();
        }
      } else {
        window.OlymposApp.showToast((res && res.mensagem) || 'Falha ao gerar ofício.', true);
      }
    }, function(err) {
      btn.disabled = false;
      btn.textContent = 'Emitir Ofício no Google Docs';
      window.OlymposApp.showToast('Erro ao emitir ofício: ' + err.message, true);
    });
  }

  return {
    init: init
  };
})();

/**
 * Hub Olympos V2.1 — Página Modular 3: Portarias em Lote (O Pincel de Homero)
 */
window.OlymposViews = window.OlymposViews || {};

window.OlymposViews.portarias = (function() {
  let catalog = [];
  let pollTimer = null;
  let isCatalogLoaded = false;
  let lastGeneratedFiles = [];

  function init() {
    bindEvents();
    if (!isCatalogLoaded) {
      carregarCatalogo();
    }
  }

  function bindEvents() {
    const bind = function(id, evt, fn) {
      const el = document.getElementById(id);
      if (el && !el._bound) {
        el._bound = true;
        el.addEventListener(evt, fn);
      }
    };

    bind('subtabBtnPortariasLote', 'click', function() { alternarSubtab('lote'); });
    bind('subtabBtnPortariasLicencas', 'click', function() { alternarSubtab('licencas'); });
    bind('pincelOperacaoSelect', 'change', carregarCatalogo);
    bind('pincelPlanilhaSelect', 'change', handlePlanilhaChange);
    bind('pincelDryRunBtn', 'click', executarDryRun);
    bind('pincelGenerateBtn', 'click', iniciarGeracaoLote);
    bind('pincelStopBtn', 'click', interromperLote);
    bind('copyAllJobLinksBtn', 'click', copiarTodosOsLinks);
    bind('closeJobResultBtn', 'click', function() {
      document.getElementById('pincelCompletedJobBox').classList.add('hidden');
    });
  }

  function alternarSubtab(tabKey) {
    const paneLote = document.getElementById('subpanePortariasLote');
    const paneLic = document.getElementById('subpanePortariasLicencas');
    const btnLote = document.getElementById('subtabBtnPortariasLote');
    const btnLic = document.getElementById('subtabBtnPortariasLicencas');

    const isLic = (tabKey === 'licencas');
    if (btnLote) btnLote.classList.toggle('active', !isLic);
    if (btnLic) btnLic.classList.toggle('active', isLic);
    if (paneLote) paneLote.classList.toggle('hidden', isLic);
    if (paneLic) paneLic.classList.toggle('hidden', !isLic);

    if (isLic && window.OlymposViews.licencas && typeof window.OlymposViews.licencas.init === 'function') {
      window.OlymposViews.licencas.init();
    }
  }

  function obterCatalogoPadrao(op) {
    if (op === 'READAPTACOES') {
      return [
        {
          id: '1Mz95vIv024qO62nO1USBtY2iQIrVThaeqcWYOcTQ2X0',
          nome: 'Planilha Oficial de Readaptações 2026',
          abas: ['Readaptações 2026', 'Página1']
        }
      ];
    }
    return [
      {
        id: '1agqeKFfubxvmdq2oND3ndykU2037NIuOXBOHVSLS9oc',
        nome: 'Planilha Oficial de Licenças 2026',
        abas: ['Licenças 2026', 'Página1']
      }
    ];
  }

  function renderizarOpcoesCatalogo(planSelect) {
    planSelect.innerHTML = '';
    if (catalog.length === 0) {
      planSelect.innerHTML = '<option value="">Nenhuma planilha localizada nesta modalidade</option>';
      handlePlanilhaChange();
      return;
    }

    catalog.forEach(function(item, idx) {
      const opt = document.createElement('option');
      opt.value = item.id;
      opt.textContent = item.nome + ' (' + ((item.abas && item.abas.length) || 0) + ' abas)';
      if (idx === 0) opt.selected = true;
      planSelect.appendChild(opt);
    });

    handlePlanilhaChange();
  }

  function carregarCatalogo() {
    const op = document.getElementById('pincelOperacaoSelect').value;
    const planSelect = document.getElementById('pincelPlanilhaSelect');
    planSelect.innerHTML = '<option value="">Carregando planilhas oficiais...</option>';

    window.OlymposApi.chamar('portarias_catalogo', { operacao: op }, function(res) {
      const lista = Array.isArray(res) ? res : ((res && res.planilhas) || []);
      if (lista.length === 0 && res && res.status === 'ERRO') {
        catalog = obterCatalogoPadrao(op);
      } else {
        catalog = lista.length > 0 ? lista : obterCatalogoPadrao(op);
      }
      isCatalogLoaded = true;
      renderizarOpcoesCatalogo(planSelect);
    }, function(err) {
      console.warn('Catálogo de portarias em modo fallback local:', err);
      catalog = obterCatalogoPadrao(op);
      isCatalogLoaded = true;
      renderizarOpcoesCatalogo(planSelect);
    });
  }

  function handlePlanilhaChange() {
    const planId = document.getElementById('pincelPlanilhaSelect').value;
    const abaSelect = document.getElementById('pincelAbaSelect');
    abaSelect.innerHTML = '';

    const found = catalog.find(function(c) { return c.id === planId; });
    if (!found || !found.abas || found.abas.length === 0) {
      abaSelect.innerHTML = '<option value="">Nenhuma aba de dados disponível</option>';
      return;
    }

    found.abas.forEach(function(aba) {
      const opt = document.createElement('option');
      opt.value = aba;
      opt.textContent = aba;
      abaSelect.appendChild(opt);
    });
  }

  function executarDryRun() {
    const planId = document.getElementById('pincelPlanilhaSelect').value;
    const sheetName = document.getElementById('pincelAbaSelect').value;
    const op = document.getElementById('pincelOperacaoSelect').value;
    const out = document.getElementById('pincelOutput');

    if (!planId || !sheetName) {
      window.OlymposApp.showToast('Selecione uma planilha e uma aba válidas.', true);
      return;
    }

    out.innerHTML = 'Inspecionando linhas pendentes e verificando integridade dos campos obrigatórios...';

    window.OlymposApi.chamar('portarias_dry_run', {
      spreadsheetId: planId,
      sheetName: sheetName,
      operacao: op
    }, function(res) {
      if (!res || !res.ok) {
        out.innerHTML = '<span class="text-danger">' + ((res && res.mensagem) || 'Falha no diagnóstico pré-voo.') + '</span>';
        return;
      }

      const totalPend = res.totalPendentes !== undefined ? res.totalPendentes : (res.pendentes || 0);
      const validas = res.validas !== undefined ? res.validas : 0;
      const invalidas = res.invalidas !== undefined ? res.invalidas : 0;

      let html = '<div style="font-family:var(--font-display); font-weight:700; color:var(--text-main); margin-bottom:10px;">' +
        'Diagnóstico Pré-Voo — ' + window.OlymposApp.escapeHtml(res.planilha || 'Planilha') + ' (' + window.OlymposApp.escapeHtml(res.aba || sheetName) + ')' +
      '</div>';

      html += '<div style="display:flex; flex-wrap:wrap; gap:10px; margin-bottom:12px;">' +
        '<span class="pill-badge pill-gold">Pendentes: ' + totalPend + '</span>' +
        '<span class="pill-badge pill-green">Prontas p/ Emitir: ' + validas + '</span>' +
        '<span class="pill-badge ' + (invalidas > 0 ? 'pill-red' : 'pill-blue') + '">Inconsistências: ' + invalidas + '</span>' +
      '</div>';

      if (res.erros && res.erros.length > 0) {
        html += '<div style="max-height:140px; overflow-y:auto; padding:10px 12px; border-radius:12px; background:var(--danger-soft); color:var(--danger); font-size:12.5px; margin-bottom:12px;">';
        res.erros.forEach(function(e) {
          html += '<div style="margin-bottom:4px;">• <strong>Linha ' + e.linha + '</strong> (' + window.OlymposApp.escapeHtml(e.servidor || '') + '): ' + window.OlymposApp.escapeHtml(e.motivo) + '</div>';
        });
        html += '</div>';
      } else if (totalPend === 0) {
        html += '<div style="font-size:13px; margin-bottom:12px;">Todas as linhas desta aba já estão com status <strong>Documento Gerado</strong>.</div>';
      } else {
        html += '<div style="font-size:13px; color:var(--success); font-weight:600; margin-bottom:12px;">Nenhum erro de preenchimento encontrado! Clique em "Gerar Portarias Pendentes" para emitir os documentos.</div>';
      }

      // Tabela de Valores Reais lidos da Planilha Oficial
      if (res.amostraLinhas && res.amostraLinhas.length > 0) {
        html += '<div style="margin-top:14px; font-weight:700; font-size:13px; color:var(--text-main); margin-bottom:6px;">Registros Identificados na Planilha (' + res.amostraLinhas.length + ' linhas)</div>';
        html += '<div class="table-wrapper" style="max-height:260px; overflow-y:auto;">';
        html += '<table class="clean-table table-responsive-cards" style="font-size:12px;">';
        html += '<thead><tr><th>Linha</th><th>Servidor(a)</th><th>Matrícula</th><th>Cargo / Função</th><th>Portaria</th><th>Status</th></tr></thead>';
        html += '<tbody>';
        res.amostraLinhas.forEach(function(item) {
          const badgeClass = item.status === 'DOCUMENTO GERADO' ? 'pill-green' : (item.valida ? 'pill-gold' : 'pill-red');
          html += '<tr>' +
            '<td data-label="Linha"><strong>' + item.linha + '</strong></td>' +
            '<td data-label="Servidor(a)">' + window.OlymposApp.escapeHtml(item.servidor) + '</td>' +
            '<td data-label="Matrícula">' + window.OlymposApp.escapeHtml(item.matricula || '—') + '</td>' +
            '<td data-label="Cargo / Função">' + window.OlymposApp.escapeHtml(item.cargo || '—') + '</td>' +
            '<td data-label="Portaria">' + window.OlymposApp.escapeHtml(item.portaria || 'Automática') + '</td>' +
            '<td data-label="Status"><span class="pill-badge ' + badgeClass + '" style="font-size:11px; padding:2px 8px;">' + window.OlymposApp.escapeHtml(item.status) + '</span></td>' +
          '</tr>';
        });
        html += '</tbody></table></div>';
      }

      out.innerHTML = html;
    }, function(err) {
      out.innerHTML = '<span class="text-danger">Erro no diagnóstico: ' + window.OlymposApp.escapeHtml(err.message) + '</span>';
    });
  }

  function iniciarGeracaoLote() {
    const planId = document.getElementById('pincelPlanilhaSelect').value;
    const sheetName = document.getElementById('pincelAbaSelect').value;
    const op = document.getElementById('pincelOperacaoSelect').value;
    const btnGen = document.getElementById('pincelGenerateBtn');
    const btnStop = document.getElementById('pincelStopBtn');
    const progBox = document.getElementById('pincelProgressBox');

    if (!planId || !sheetName) {
      window.OlymposApp.showToast('Selecione uma planilha e uma aba válidas.', true);
      return;
    }

    if (!confirm('Iniciar emissão oficial de portarias pendentes na aba "' + sheetName + '"?')) return;

    btnGen.classList.add('hidden');
    btnStop.classList.remove('hidden');
    progBox.classList.remove('hidden');
    document.getElementById('pincelCompletedJobBox').classList.add('hidden');
    atualizarBarraProgresso(0, 1, 'Iniciando lote no Pincel de Homero...');

    window.OlymposApi.chamar('portarias_gerar_lote', {
      spreadsheetId: planId,
      sheetName: sheetName,
      operacao: op
    }, function(res) {
      if (res && res.started === false) {
        btnGen.classList.remove('hidden');
        btnStop.classList.add('hidden');
        progBox.classList.add('hidden');
        window.OlymposApp.showToast(res.message || 'Nenhuma portaria pendente nesta aba.', true);
        return;
      }
      window.OlymposApp.showToast((res && res.message) || 'Processamento de portarias iniciado!');
      iniciarPollingStatus();
    }, function(err) {
      btnGen.classList.remove('hidden');
      btnStop.classList.add('hidden');
      progBox.classList.add('hidden');
      window.OlymposApp.showToast('Erro ao iniciar lote: ' + err.message, true);
    });
  }

  function atualizarBarraProgresso(proc, tot, label) {
    const fill = document.getElementById('pincelProgressFill');
    const num = document.getElementById('pincelProgressNumbers');
    const lbl = document.getElementById('pincelProgressLabel');
    const safeTot = Math.max(1, tot || 1);
    const pct = Math.min(100, Math.round((proc / safeTot) * 100));

    if (fill) fill.style.width = pct + '%';
    if (num) num.textContent = proc + ' / ' + tot + ' (' + pct + '%)';
    if (lbl && label) lbl.textContent = label;
  }

  function iniciarPollingStatus() {
    if (pollTimer) clearInterval(pollTimer);

    const checar = function() {
      window.OlymposApi.chamar('portarias_status_lote', {}, function(status) {
        if (!status) return;

        const emExecucao = Boolean(status.isRunning);
        if (emExecucao) {
          atualizarBarraProgresso(status.processed || 0, status.total || 1, 'Gerando documentos Google Docs em "' + (status.sheetName || '') + '"...');
          return;
        }

        clearInterval(pollTimer);
        pollTimer = null;

        document.getElementById('pincelGenerateBtn').classList.remove('hidden');
        document.getElementById('pincelStopBtn').classList.add('hidden');
        document.getElementById('pincelProgressBox').classList.add('hidden');

        const consolidado = status.ultimoLoteConcluido || status;
        exibirResultadoConclusao(consolidado);
        if (window.OlymposViews && window.OlymposViews.visaoGeral) {
          window.OlymposViews.visaoGeral.recarregar();
        }
      }, function() {});
    };

    checar();
    pollTimer = setInterval(checar, 2400);
  }

  function interromperLote() {
    window.OlymposApi.chamar('portarias_parar_lote', {}, function() {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = null;
      document.getElementById('pincelGenerateBtn').classList.remove('hidden');
      document.getElementById('pincelStopBtn').classList.add('hidden');
      document.getElementById('pincelProgressBox').classList.add('hidden');
      window.OlymposApp.showToast('Execução do lote interrompida.');
    });
  }

  function exibirResultadoConclusao(jobData) {
    const card = document.getElementById('pincelCompletedJobBox');
    const summary = document.getElementById('jobResultSummary');
    const linksList = document.getElementById('jobLinksList');

    const arquivos = jobData.generatedFiles || jobData.arquivosGerados || [];
    const erros = jobData.errors || [];
    lastGeneratedFiles = arquivos;

    card.classList.remove('hidden');
    summary.innerHTML =
      'Lote finalizado na aba <strong>' + window.OlymposApp.escapeHtml(jobData.sheetName || 'Selecionada') + '</strong>: ' +
      '<strong>' + arquivos.length + ' arquivo(s) gerado(s)</strong>' +
      (erros.length > 0 ? ' • <span class="text-danger">' + erros.length + ' linha(s) com erro</span>' : '') +
      '. Clique abaixo para acessar diretamente no Google Docs:';

    window.OlymposApp.renderizarItensLinksGerados(linksList, arquivos);
  }

  function copiarTodosOsLinks() {
    if (!lastGeneratedFiles || lastGeneratedFiles.length === 0) {
      window.OlymposApp.showToast('Nenhum link disponível para copiar.', true);
      return;
    }
    const texto = lastGeneratedFiles.map(function(a) {
      const label = a.portaria ? ('Portaria Nº ' + a.portaria + '/2026 - ' + (a.identificador || '')) : (a.identificador || 'Portaria');
      return label + ': ' + (a.url || '');
    }).join('\n');
    window.OlymposApp.copiarTexto(texto, lastGeneratedFiles.length + ' link(s) do lote');
  }

  return {
    init: init,
    alternarSubtab: alternarSubtab
  };
})();
