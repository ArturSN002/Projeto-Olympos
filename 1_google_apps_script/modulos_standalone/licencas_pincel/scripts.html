<script>
  const sheetSelector = document.getElementById('sheetSelector');
  const diagnoseButton = document.getElementById('diagnoseBtn');
  const generateButton = document.getElementById('generateBtn');
  const stopButton = document.getElementById('stopBtn');
  const statusDiv = document.getElementById('status');
  const mainControls = document.getElementById('main-controls');
  const progressContainer = document.getElementById('progress-container');
  const progressBar = document.getElementById('progress-bar');
  const progressText = document.getElementById('progress-text');
  const metricsBox = document.getElementById('metricsBox');
  const mPendentes = document.getElementById('mPendentes');
  const mValidas = document.getElementById('mValidas');
  const mErros = document.getElementById('mErros');

  let pollingInterval = null;

  document.addEventListener('DOMContentLoaded', loadSidebar);
  diagnoseButton.addEventListener('click', handleDiagnoseClick);
  generateButton.addEventListener('click', handleGenerateClick);
  stopButton.addEventListener('click', handleStopClick);

  function setUIState(state) {
    const isIdle = state === 'IDLE';
    const isGenerating = state === 'GENERATING';

    sheetSelector.disabled = !isIdle;
    diagnoseButton.disabled = !isIdle;
    generateButton.disabled = !isIdle;
    stopButton.disabled = !isGenerating;

    mainControls.classList.toggle('hidden', isGenerating);
    progressContainer.classList.toggle('hidden', !isGenerating);
  }

  function loadSidebar() {
    setUIState('LOADING');
    setStatus('info', 'Carregando abas da planilha...');
    google.script.run
      .withSuccessHandler(onSheetNamesSuccess)
      .withFailureHandler(onFailure)
      .getSheetNames();
  }

  function onSheetNamesSuccess(sheetNames) {
    sheetSelector.innerHTML = "";
    if (sheetNames && sheetNames.length > 0) {
      sheetNames.forEach(name => {
        const option = document.createElement('option');
        option.value = name;
        option.textContent = name;
        sheetSelector.appendChild(option);
      });
      pollStatus();
    } else {
      setStatus('error', 'Nenhuma aba processável foi encontrada. Crie abas como "Premio" ou "Não remunerada".');
      setUIState('IDLE');
      diagnoseButton.disabled = true;
      generateButton.disabled = true;
    }
  }

  function pollStatus() {
    google.script.run
      .withSuccessHandler(updateUIFromStatus)
      .withFailureHandler(onFailure)
      .getProcessStatus();
  }

  function updateUIFromStatus(status) {
    if (status.isRunning) {
      setUIState('GENERATING');
      if (!pollingInterval) {
        pollingInterval = setInterval(pollStatus, 4000);
      }
      const total = status.total > 0 ? status.total : 1;
      const pct = Math.min(100, Math.round((status.processed / total) * 100));
      progressBar.value = status.processed;
      progressBar.max = total;
      progressText.textContent = `${status.processed} / ${total} Gerados (${pct}%)`;
      setStatus('info', `Processando a planilha "${status.sheetName}"...`);
    } else {
      setUIState('IDLE');
      if (pollingInterval) {
        clearInterval(pollingInterval);
        pollingInterval = null;
      }
      setStatus('success', 'Pronto para iniciar. Execute o Diagnóstico Pré-Voo ou clique em gerar.');
    }
  }

  function handleDiagnoseClick() {
    const selectedSheet = sheetSelector.value;
    if (!selectedSheet) {
      setStatus('error', 'Por favor, selecione uma aba.');
      return;
    }
    setUIState('LOADING');
    setStatus('info', `Executando diagnóstico pré-voo em "${selectedSheet}"...`);
    google.script.run
      .withSuccessHandler(onDiagnoseSuccess)
      .withFailureHandler(onFailure)
      .runPreFlightCheck(selectedSheet);
  }

  function onDiagnoseSuccess(report) {
    setUIState('IDLE');
    metricsBox.classList.remove('hidden');
    mPendentes.textContent = report.totalPendentes || 0;
    mValidas.textContent = report.validas || 0;
    mErros.textContent = report.invalidas || 0;

    if (report.totalPendentes === 0) {
      setStatus('info', `Nenhuma linha pendente encontrada (${report.jaGeradas || 0} já geradas).`);
      return;
    }
    if (report.invalidas === 0) {
      setStatus('success', `✅ Diagnóstico aprovado! Todas as ${report.validas} linhas pendentes estão íntegras e prontas para gerar.`);
    } else {
      const lista = report.erros
        .slice(0, 10)
        .map(e => `• <strong>Linha ${e.linha}</strong> (${e.servidor}): ${e.motivo}`)
        .join('<br>');
      const extra = report.erros.length > 10 ? `<br><em>...e mais ${report.erros.length - 10} linha(s).</em>` : '';
      setStatus('error', `⚠️ <strong>${report.invalidas} inconsistência(s) encontrada(s)</strong> (de ${report.totalPendentes} pendentes):<br>${lista}${extra}`);
    }
  }

  function handleGenerateClick() {
    const selectedSheet = sheetSelector.value;
    if (!selectedSheet) {
      setStatus('error', 'Por favor, selecione uma aba.');
      return;
    }
    setUIState('LOADING');
    setStatus('info', `Iniciando a geração para "${selectedSheet}"...`);
    google.script.run
      .withSuccessHandler(onGenerationStart)
      .withFailureHandler(onFailure)
      .startGenerationProcess(selectedSheet);
  }

  function onGenerationStart(result) {
    if (result.started) {
      pollStatus();
    } else {
      setUIState('IDLE');
      setStatus('error', result.message);
    }
  }

  function handleStopClick() {
    setUIState('LOADING');
    setStatus('info', 'Interrompendo o processo...');
    google.script.run
      .withSuccessHandler(onStopSuccess)
      .withFailureHandler(onFailure)
      .resetProcess(true);
  }

  function onStopSuccess(result) {
    setStatus('success', result.message);
    pollStatus();
  }

  function onFailure(error) {
    setUIState('IDLE');
    setStatus('error', 'Erro: ' + error.message);
  }

  function setStatus(type, message) {
    statusDiv.className = `status status-${type} ${type}`;
    statusDiv.innerHTML = message;
  }
</script>
