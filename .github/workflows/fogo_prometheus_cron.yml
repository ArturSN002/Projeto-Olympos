name: "Olympos — Fogo de Prometheus (Monitor Diário FEMURN)"

permissions:
  contents: read

on:
  schedule:
    # Janela matinal 06h–08h BRT (UTC-3), Segunda a Sexta:
    # 05:17 BRT — coleta antecipada para constar na interface às 06h00
    - cron: '17 8 * * 1-5'
    # 06:47 BRT — varredura intermediária para edições publicadas/atrasadas
    - cron: '47 9 * * 1-5'
    # 08:23 BRT — varredura final para edições tardias ou retificadas
    - cron: '23 11 * * 1-5'
  workflow_dispatch:
    inputs:
      data_inicio:
        description: 'Data Inicial (DD/MM/AAAA) - Vazio = Hoje'
        required: false
        default: ''
      data_fim:
        description: 'Data Final (DD/MM/AAAA) - Vazio = Hoje'
        required: false
        default: ''
      secao_diario:
        description: 'Nome da Seção do Diário Oficial (ex: Secretaria Municipal de Educação)'
        required: false
        default: ''
      modo_coleta:
        description: 'Modo de coleta (INTEGRAL = 100% Ceará-Mirim | SMEB_ONLY = apenas Educação)'
        required: false
        default: 'INTEGRAL'
      recatalogar_ia:
        description: 'Forçar recatalogação com Gemma 4 31B em atos já salvos (true/false)'
        required: false
        default: 'false'

jobs:
  monitorar-femurn:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: "2_github_pages_actions/engines/fogo_de_prometheus"

    steps:
      - name: 1. Checkout do Monorepo Olympos
        uses: actions/checkout@v6

      - name: 2. Configurar Python 3.11 com Cache de Dependências
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '2_github_pages_actions/engines/fogo_de_prometheus/src/requirements.txt'

      - name: 3. Instalar Dependências Python, Tesseract OCR (pt-BR) e Chromium
        run: |
          sudo apt-get update -y
          sudo apt-get install -y tesseract-ocr tesseract-ocr-por
          pip install --upgrade pip
          pip install -r src/requirements.txt
          playwright install --with-deps chromium

      - name: 4. Coletar FEMURN e Persistir no Supabase e Webhook GAS
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
          OLYMPOS_SECRET_TOKEN: ${{ secrets.OLYMPOS_SECRET_TOKEN }}
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATA_INICIO_CUSTOM: ${{ github.event.inputs.data_inicio }}
          DATA_FIM_CUSTOM: ${{ github.event.inputs.data_fim }}
          SECAO_DIARIO_OFICIAL: ${{ github.event.inputs.secao_diario || '' }}
          PROMETHEUS_MODO_COLETA: ${{ github.event.inputs.modo_coleta || 'INTEGRAL' }}
          RECATALOGAR_IA: ${{ github.event.inputs.recatalogar_ia || 'false' }}
        run: |
          python src/scraper_femurn.py
