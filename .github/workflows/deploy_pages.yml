name: "Olympos — Deploy Frontend (GitHub Pages)"

on:
  push:
    branches: ["main"]
    paths:
      - "2_github_pages_actions/frontend_spa/**"
      - ".github/workflows/deploy_pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "olympos-pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: 1. Checkout do Monorepo Olympos
        uses: actions/checkout@v6

      - name: 2. Configurar GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: 3. Injetar CARTO_API_KEY dos GitHub Secrets no Frontend
        env:
          CARTO_API_KEY: ${{ secrets.CARTO_API_KEY }}
        run: |
          python3 -c "import os, json, re, pathlib; p = pathlib.Path('2_github_pages_actions/frontend_spa/js/carto_config.js'); k = os.environ.get('CARTO_API_KEY', '').strip(); txt = p.read_text(encoding='utf-8'); (p.write_text(re.sub(r'apiKey:\s*\'[^\']*\'', 'apiKey: ' + json.dumps(k), txt, count=1), encoding='utf-8')) if k else print('CARTO_API_KEY vazia no secret, mantendo chave canonica padrao.')"

      - name: 4. Empacotar exclusivamente o Frontend Estático
        uses: actions/upload-pages-artifact@v5
        with:
          path: "2_github_pages_actions/frontend_spa"

      - name: 5. Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
