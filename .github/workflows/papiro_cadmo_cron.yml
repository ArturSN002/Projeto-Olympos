name: "Olympos — O Papiro de Cadmo (ETL Mensal de Servidores RN)"

on:
  schedule:
    # Executa todo dia 12 às 03:00 UTC (após fechamento das folhas municipais e SEEC/RN)
    - cron: '0 3 12 * *'
  workflow_dispatch:
    inputs:
      competencia:
        description: 'Competência customizada (MM/AAAA ou AAAA-MM) - Vazio = Mês Anterior'
        required: false
        default: ''
      filtro_ente:
        description: 'Filtrar ente específico (ex: Natal, Governo do RN) - Vazio = Todos os 16 entes'
        required: false
        default: ''

jobs:
  executar-etl:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: "2_github_pages_actions/engines/papiro_de_cadmo"

    steps:
      - name: 1. Checkout do Monorepo Olympos
        uses: actions/checkout@v6

      - name: 2. Configurar Python 3.11 com Cache
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '2_github_pages_actions/engines/papiro_de_cadmo/requirements.txt'

      - name: 3. Instalar Dependências e Chromium Headless
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: 4. Extrair Servidores dos 16 Portais da Transparência
        env:
          COMPETENCIA_CUSTOM: ${{ github.event.inputs.competencia }}
          FILTRO_ENTE_CUSTOM: ${{ github.event.inputs.filtro_ente }}
        run: |
          python -m extractors.run_all

      - name: 5. Normalizar Esquemas e Consolidar Base Única
        run: |
          python -m pipeline.normalizador

      - name: 6. Sincronizar com Supabase e Google Drive
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          DRIVE_FOLDER_ID: "1dcc_5GcNG0ciVE-i1J6iwtojATk-1utD"
          PERMUTAS_SHEET_ID: "1fOZHe871yxu6UdF0vsRzjSzQBc7AVFRZZtx3JSCdwCY"
        run: |
          python -m pipeline.upload_drive

      - name: 7. Publicar Resumo Executivo no GitHub Actions ($GITHUB_STEP_SUMMARY)
        if: always()
        run: |
          python -m pipeline.resumo_executivo

