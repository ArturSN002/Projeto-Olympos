name: "Olympos — Fogo de Prometheus (Monitor Diário FEMURN)"

on:
  schedule:
    # 10:00 UTC = 07:00 BRT (America/Fortaleza), Segunda a Sexta
    - cron: '0 10 * * 1-5'
  workflow_dispatch:
    inputs:
      data_inicio:
        description: 'Data Inicial (DD/MM/AAAA) - Vazio = Hoje'
        required: false
        default: ''
      data_fim:
        description: 'Data Final (DD/MM/AAAA) - Vazio = Hoje'
        required: false
        default: ''
      secao_diario:
        description: 'Nome da Seção do Diário Oficial (ex: Secretaria Municipal de Educação)'
        required: false
        default: ''

jobs:
  monitorar-femurn:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: "2_github_pages_actions/engines/fogo_de_prometheus"

    steps:
      - name: 1. Checkout do Monorepo Olympos
        uses: actions/checkout@v6

      - name: 2. Configurar Python 3.11 com Cache de Dependências
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '2_github_pages_actions/engines/fogo_de_prometheus/src/requirements.txt'

      - name: 3. Instalar Dependências Python, Tesseract OCR (pt-BR) e Chromium
        run: |
          sudo apt-get update -y
          sudo apt-get install -y tesseract-ocr tesseract-ocr-por
          pip install --upgrade pip
          pip install -r src/requirements.txt
          playwright install --with-deps chromium

      - name: 4. Coletar FEMURN e Persistir no Supabase e Webhook GAS
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
          OLYMPOS_SECRET_TOKEN: ${{ secrets.OLYMPOS_SECRET_TOKEN }}
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          DATA_INICIO_CUSTOM: ${{ github.event.inputs.data_inicio }}
          DATA_FIM_CUSTOM: ${{ github.event.inputs.data_fim }}
          SECAO_DIARIO_OFICIAL: ${{ github.event.inputs.secao_diario || '' }}
        run: |
          python src/scraper_femurn.py
