name: "Olympos — Ingestão Vetorial Incremental do Oráculo ($0)"

permissions:
  contents: read

on:
  schedule:
    # Diariamente às 04:15 BRT (07:15 UTC) — custo $0 com gemini-embedding-2 incremental por SHA-256
    - cron: '15 7 * * *'
  workflow_dispatch:

jobs:
  ingestar-conhecimento-vetorial:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: 2_github_pages_actions/engines/oraculo_vetorial

    steps:
      - name: 1. Checkout do Monorepo Olympos
        uses: actions/checkout@v6

      - name: 2. Configurar Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 3. Executar Ingestão Vetorial Incremental (Zero-PII + SHA-256 + pgvector 768)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
          OLYMPOS_SECRET_TOKEN: ${{ secrets.OLYMPOS_SECRET_TOKEN }}
        run: python ingest_knowledge.py
