name: "Olympos — Deploy Frontend (GitHub Pages)"

on:
  push:
    branches: ["main"]
    paths:
      - "2_github_pages_actions/frontend_spa/**"
      - ".github/workflows/deploy_pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "olympos-pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: 1. Checkout do Monorepo Olympos
        uses: actions/checkout@v6

      - name: 2. Configurar GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: 3. Empacotar exclusivamente o Frontend Estático
        uses: actions/upload-pages-artifact@v5
        with:
          path: "2_github_pages_actions/frontend_spa"

      - name: 4. Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
