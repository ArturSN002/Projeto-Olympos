name: "Olympos — Deploy Frontend (GitHub Pages)"

on:
  push:
    branches: ["main"]
    paths:
      - "2_github_pages_actions/frontend_spa/**"
      - ".github/workflows/deploy_pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "olympos-pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: 1. Checkout do Monorepo Olympos
        uses: actions/checkout@v6

      - name: 2. Configurar GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: 3. Configurar Node.js 20 e Cache NPM
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "2_github_pages_actions/frontend_spa/package.json"

      - name: 4. Instalar Dependências e Build Vite (Code Splitting)
        working-directory: "2_github_pages_actions/frontend_spa"
        env:
          VITE_CARTO_API_KEY: ${{ secrets.CARTO_API_KEY }}
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build

      - name: 5. Empacotar Bundle Otimizado (dist/)
        uses: actions/upload-pages-artifact@v5
        with:
          path: "2_github_pages_actions/frontend_spa/dist"

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: 6. Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
